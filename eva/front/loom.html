  $('fanjump').hidden = true;
  $('fanpane').hidden = true;
  $('notepane').hidden = true;
  $('artpane').hidden = true;
  $('textpane').hidden = false;
  $('canvaspane').hidden = true;
  $('textview').scrollTop = 0;
  $('textback').focus({preventScroll:true});
}

function exportName(){
  const n = shownTitle().replace(/[^\w.-]+/g, '-').replace(/^-|-$/g, '');
  return (n || 'artifact') + '.txt';
}

function downloadText(){
  if(!artifact && !walk) return;
  const blob = new Blob([$('textview').textContent], {type: 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = exportName();
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Revoked on the next tick, not immediately: Safari has not finished reading the blob when
  // click() returns, and a revoked url downloads an empty file.
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  sys('exported ' + a.download);
}

async function copyText(){
  // No fallback to execCommand: on a page served over https to this mac and this phone the
  // clipboard api is there, and a silent half-copy of a document is worse than a refusal.
  try{
    await navigator.clipboard.writeText($('textview').textContent);
    sys('copied');
  }catch(e){
    sys('could not copy: ' + e.message, true);
  }
}

// The few numbers that decide the register, in the order they matter. One list, because an
// artifact and a walked room are read side by side and two orders would look like two runs.
function samplerLine(params){
  const p = params || {};
  return ['temperature', 'spread', 'min_p', 'top_k', 'top_p', 'top_n_sigma',
    'xtc_probability', 'repeat_penalty', 'dry_multiplier', 'n_predict', 'fan']
    .filter(k => p[k] !== undefined).map(k => k + ' ' + p[k]).join(' · ') +
    (p.logit_bias_text ? ' · bias ' + p.logit_bias_text.split('\n').join(', ') : '');
}

function drawArtifact(a){
  const view = $('artview');
  view.textContent = '';
  $('arttitle').textContent = a.title || a.name;
  $('artagain').hidden = $('artgo').hidden = false;
  const steps = stepsOf(a);
  view.appendChild(drawTree(a, steps));
  mk(view, 'div', 'artfoot', artFoot(a, steps));

  const nums = mk(view, 'div', 'artnums');
  const pair = (k, v) => { mk(nums, 'span', '', k); mk(nums, 'span', 'v', v); };
  const m = a.model;
  pair('model', m && m.file ? m.file + (m.n_ctx ? ' · ' + m.n_ctx + ' ctx' : '') : 'not recorded');
  pair('sampler', samplerLine(a.params));
  const turn = a.turn || {};
  pair('turn', (turn.prefix || turn.suffix) ? esc(turn.prefix || '') + ' … ' + esc(turn.suffix || '') : 'bare');
  pair('saved', when(a.created));
  const src = a.source || {};
  pair('from', src.title ? src.title + ' (' + src.room + ')' : (src.room || '?'));

  // The tree is measured, so it has to be redrawn whenever its own box changes size — a
  // window resize, the fold opening, the pane going from hidden (every rect zero) to shown.
  if(artRO) artRO.disconnect();
  if(window.ResizeObserver){
    artRO = new ResizeObserver(drawArtLinks);
    artRO.observe($('arttree'));
  }
  requestAnimationFrame(() => { drawArtLinks(); centreTree(); });
}

async function openArtifact(name){
  let d;
  try{ d = await getJSON('/api/artifact?name=' + encodeURIComponent(name)); }
  catch(e){ sys('could not open the artifact: ' + e.message, true); return; }
  if(d.error){ sys(d.error, true); return; }
  artifact = d;
  walk = null;
  drawArtifact(d);
  showTree();
}

// Coming back to an artifact is a new room, never a change to the artifact: its prompt is
// the root, its turn and sampler come along, and nothing fans until he asks.
async function fanAgain(){
  if(!artifact) return;
  const a = artifact;
  const turn = a.turn || {prefix: '', suffix: ''};
  await newSitting(!(turn.prefix || turn.suffix), {
    rootText: a.prompt || '',
    title: ('again: ' + (a.title || a.name)).slice(0, 120),
    params: a.params && Object.keys(a.params).length ? a.params : PARAMS,
    turn: turn,
  });
}

// The artifact as a room again: the spine, then at every fork the line taken and the
// branches kept beside it — nothing else of the fan, that being the whole cut. The sampler
// comes along and stays editable like any room's. A walk that ends on an open fan lands on
// that fan, so the next move is a pick.
function treeOf(a){
  // Copies: the steps are the artifact on screen, and the old shape below writes `at`.
  const steps = stepsOf(a).map(st => Object.assign({}, st));
  const base = Date.now() / 1000;
  const nodes = {};
  const put = (id, kind, parent, text, ts, extra) => {
    while(!id || nodes[id]) id = hex(4);
    nodes[id] = Object.assign({id, parent, kind, text: text || '', ts, pruned: false,
                               posed: false, meta: null}, extra || {});
    return id;
  };
  // No star comes along: in the new room these are simply the fan, and the first star
  // there starts that room's own artifact instead of cloning this one.
  const branch = row => ({posed: !!row.posed, meta: row.meta || null});
  let current;
  if(Array.isArray(a.blocks) && a.blocks.length){
    // Ids are kept: a step names its fan point by id, and it is one of these blocks.
    let prev = null;
    a.blocks.forEach((b, i) => {
      prev = put(b.id, i ? b.kind : 'root', prev, b.text, base + i, {posed: !!b.posed});
    });
    current = prev;
  }else{
    // Written before artifacts carried their blocks: the prompt is the root and each lead
    // one line, flat — the text is right, the turns are gone.
    current = put(null, 'root', null, a.prompt, base);
    steps.forEach((st, i) => {
      if(st.lead) current = put(null, 'human', current, st.lead, base + i + 0.5);
      st.at = current;
      if(st.took) current = put(st.took.id, 'model', current, st.took.text, base + i + 0.9);
    });
  }
  for(const st of steps){
    const head = nodes[st.at];
    if(!head) continue;
    // Siblings keep the order the fan had: the page sorts a fan by ts.
    if(st.took && nodes[st.took.id]){
      Object.assign(nodes[st.took.id], branch(st.took), {ts: head.ts + (st.took.at || 0) / 1e4});
    }
    for(const k of st.kept || [])
      put(k.id, 'model', head.id, k.text, head.ts + (k.at || 0) / 1e4, branch(k));
  }
  const last = steps[steps.length - 1];
  return {nodes, current, open: !!(last && !last.took && nodes[last.at])};
}

async function continueArtifact(){
  if(!artifact) return;
  const a = artifact;
  const tree = treeOf(a);
  const turn = a.turn || {prefix: '', suffix: ''};
  await newSitting(!(turn.prefix || turn.suffix), {
    tree,
    title: ('go on: ' + (a.title || a.name)).slice(0, 120),
    params: a.params && Object.keys(a.params).length ? a.params : PARAMS,
    turn: turn,
  });
  if(tree.open && sitting && sitting.nodes[tree.current] && alternativesFrom() === tree.current)
    showChoices(tree.current);
}

// ---- berserk's walks -------------------------------------------------------------------
// Nobody sat in these rooms: the daemon fanned, the same model read its own fan and said
// which branch it meant, a matcher turned that into a letter, and the walk went on. The
// record of a night is the ROOM plus the LEDGER — never the artifact, which keeps the
// branches nobody took as 80-character openings and not one word of what was said, and those
// two are the whole point. `/api/berserk` hands both over; this draws them on the tree
// screen, and the html page on the sheets site draws the same pair for a phone in bed.

// a, b, c … aa. A branch's name here is its place in the order the READER saw — shuffled
// under about and quote — and not its place in the fan.
function letter(i){
  let out = '', n = i + 1;
  while(n > 0){
    const r = (n - 1) % 26;
    out = String.fromCharCode(97 + r) + out;
    n = (n - 1 - r) / 26;
  }
  return out || '?';
}

// A fork row written before `tries` existed, read back as far as the row allows: every entry
// of `wished` was an ask that named nothing in the fan, and `quote` is the ask that landed.
// The whys of the misses do not exist to show — which is exactly why berserk records the
// tries now. Rule for rule the sheets page's `fallback_tries`: two readings of one row that
// disagree about what happened are worse than one reading.
function fallbackTries(row, tookAt){
  const tries = (row.wished || []).filter(w => (w || '').trim())
    .map(w => ({said: w, why: '', hit: null, widened: false}));
  const said = (row.quote || '').trim();
  if(said && row.outcome === 'match')
    tries.push({said: said, why: row.why || '', hit: tookAt, widened: false});
  // The widened ask is the last one made. Where an ask came back empty — counted in
  // `attempts`, never in `wished` — that is a guess, and it costs a label, not a branch.
  if(row.widened && tries.length) tries[tries.length - 1].widened = true;
  return tries;
}

// Every ask one fan cost, in the order they happened: the reader of this screen wants to see
// the machine MISS — three attempts that named nothing, a fan widened, then an arrow or a
// coin toss. The resolver is not a character here: its answer is an arrow to a letter and
// nothing else, no substring witness and no bit count anywhere.
function triesBlock(row, picker, tookAt){
  const box = mk(null, 'div', 'tries');
  const arrow = () => (tookAt === null ? '?' : letter(tookAt));
  if(picker === 'margin'){
    // Margin has nothing to reroll: the notes are written once against the branches that
    // exist, so either the resolver picks a note or the branch is chance.
    mk(box, 'div', 'plumb', (row.outcome === 'random' ? 'random → ' : '→ ') + arrow());
    return box;
  }
  const tries = Array.isArray(row.tries) ? row.tries : fallbackTries(row, tookAt);
  let widened = false;
  tries.forEach((t, k) => {
    if(t.widened && !widened){
      widened = true;
      mk(box, 'div', 'plumb', 'widened to ' + (row.fan_size || '?'));
    }
    mk(box, 'div', 'plumb', 'attempt ' + (k + 1) + (k ? ' · reshuffled' : ''));
    const said = (t.said || '').trim();
    if(said){
      mk(box, 'div', 'plumb', 'said');
      mk(box, 'div', 'body say', picker === 'quote' ? '“' + said + '”' : said);
    }else{
      mk(box, 'div', 'plumb', 'said nothing');
    }
    const why = (t.why || '').trim();
    if(why){
      mk(box, 'div', 'plumb', 'why');
      mk(box, 'div', 'body say', why);
    }
    mk(box, 'div', 'plumb',
       typeof t.hit === 'number' ? '→ ' + letter(t.hit) : 'not in the fan');
  });
  // Nothing the reader said was in the fan. The walk went on anyway, and says so.
  if(row.outcome === 'random') mk(box, 'div', 'plumb', 'random → ' + arrow());
  return box;
}

function fanHead(row){
  const box = mk(null, 'div', 'head');
  mk(box, 'div', 'plumb', 'fan ' + (row.fork || '?') + (row.closing ? ' · closing' : ''));
  // The beat rides on the fork row, so this screen never has to walk the room to find out
  // which of the document's lines was ours. It goes above the branches because that is where
  // it stands in the document: every branch below is continuing it.
  const beat = (row.beat || '').trim();
  if(beat){
    mk(box, 'div', 'plumb', 'beat');
    mk(box, 'div', 'body beat', beat);   // `.body` keeps its capitals — it is text nemo read
  }
  if(row.lead){
    const line = mk(box, 'div', 'plumb', 'every branch finishes: …');
    // The lead is nemo's document, not a label: `.body` is what exempts a string from the
    // page's lowercase rule, and a lead shown as st. catherine is a lead retouched.
    mk(line, 'span', 'body', row.lead);
  }
  return box;
}

function fanCard(w, row, i, nid, taken){
  const box = mk(null, 'div', 'n fan' + (taken ? ' took' : ''));
  mk(box, 'div', 'plumb letter', letter(i));
  const text = ((w.sitting.nodes || {})[nid] || {}).text || '';
  // Whole, never cut to an opening: the branches nobody took are what this screen is for.
  // An empty one is a single dim line and not a paragraph — a base model standing on a
  // licence footer answers with nothing at all, and that nothing set as prose is noise.
  if(text.trim()) mk(box, 'div', 'body', text);
  else mk(box, 'div', 'plumb', '(empty)');
  if(row.picker === 'margin'){
    const note = ((row.notes || [])[i] || '').trim();
    mk(box, 'div', 'body note', note ? '~ ' + note : '~ (nothing written)');
  }
  if(taken) mk(box, 'div', 'plumb', row.closing ? 'kept' : 'taken');
  return box;
}

// The accent runs branch taken → what was said about that fan → the lead the next fan was
// finishing → that fan's branches. Every connector therefore joins two blocks that are
// neighbours on the page, so no curve is ever drawn across a paragraph of text.
function drawWalkTree(w){
  const host = treeHost();
  const nodes = w.sitting.nodes || {};
  let prev = promptCard((nodes[w.sitting.root] || {}).text, 'the seed',
                        '(empty — the room began on nothing)');
  mk(artInner, 'div', 'lvl').appendChild(prev);
  for(const row of w.rows){
    const ids = row.order || [];
    // The closing fan is the one nobody continued from: its branch is kept, not taken.
    const took = row.pick || (row.keep || [])[0] || null;
    const at = ids.indexOf(took);
    const head = fanHead(row);
    artInner.appendChild(head);
    artPairs.push([prev, head, true]);
    const lvl = mk(artInner, 'div', 'lvl fanrow');
    let tookBox = null;
    ids.forEach((nid, i) => {
      const box = fanCard(w, row, i, nid, nid === took);
      lvl.appendChild(box);
      artPairs.push([head, box, nid === took]);
      if(nid === took) tookBox = box;
    });
    const tries = triesBlock(row, row.picker || '', at < 0 ? null : at);
    artInner.appendChild(tries);
    artPairs.push([tookBox || head, tries, true]);
    prev = tries;
  }
  return host;
}

function walkFoot(w, view){
  const rows = w.rows;
  const out = [w.name, (rows[0] || {}).picker || '?',
               rows.length + (rows.length === 1 ? ' fan' : ' fans'),
               rows.filter(r => r.outcome === 'match').length + ' resolved',
               rows.filter(r => r.outcome === 'random').length + ' random'];
  // Off the nodes and not off today's constants: a run is described by what it really used,
  // or the page quietly rewrites history the first time somebody changes a default.
  const temps = [];
  let model = '';
  for(const id in (w.sitting.nodes || {})){
    const m = w.sitting.nodes[id].meta || {};
    const t = m.params && m.params.temperature;
    if(typeof t === 'number') temps.push(t);
    if(!model && m.model && m.model.file) model = m.model.file;
  }
  if(model) out.push(model);
  if(temps.length){
    const lo = Math.min.apply(null, temps), hi = Math.max.apply(null, temps);
    out.push('temp ' + num(lo) + (hi > lo ? '–' + num(hi) : ''));
  }
  mk(view, 'div', 'artfoot', out.join(' · '));
  const asked = (rows.find(r => r.ask) || {}).ask;
  if(asked){
    const line = mk(view, 'div', 'artfoot', 'asked with: ');
    mk(line, 'span', 'body', asked);      // the frame line, verbatim, capitals and all
  }
}

function drawWalk(w){
  const view = $('artview');
  view.textContent = '';
  $('arttitle').textContent = w.sitting.title || w.name;
  // Fan again is an artifact's gesture: a walked room is still on the shelf and opens in the
  // dialogue like any other, so there is nothing here to make a copy of.
  $('artagain').hidden = $('artgo').hidden = true;
  view.appendChild(drawWalkTree(w));
  walkFoot(w, view);
  const nums = mk(view, 'div', 'artnums');
  const pair = (k, v) => { mk(nums, 'span', '', k); mk(nums, 'span', 'v', v); };
  pair('sampler', samplerLine(w.sitting.params));
  pair('walked', when((w.rows[0] || {}).ts));
  if(artRO) artRO.disconnect();
  if(window.ResizeObserver){
    artRO = new ResizeObserver(drawArtLinks);
    artRO.observe($('arttree'));
  }
  requestAnimationFrame(() => { drawArtLinks(); centreTree(); });
}

async function openWalk(name){
  let d;
  try{ d = await getJSON('/api/berserk?name=' + encodeURIComponent(name)); }
  catch(e){ sys('could not open the walk: ' + e.message, true); return; }
  if(d.error){ sys(d.error, true); return; }
  walk = {name: name, sitting: d.sitting || {}, rows: d.rows || [], text: d.text || ''};
  artifact = null;
  drawWalk(walk);
  showTree();
}

// The page's three addresses. #tree=<room> opens a walk straight on the tree screen — that is
// what the sheets page links to: a night read on the phone has to be one tap from the branches
// nobody took, not a room picker and a menu away. #canvas=<folder> opens a whole experiment as
// one picture. #room=<path> opens one room on the dialogue, which is the address the canvas's
// `open room` goes to, so that the browser's own back button comes back to the picture.
function hashBits(){
  const m = /^#(tree|canvas|room)=(.+)$/.exec(location.hash || '');
  return m ? {kind: m[1], value: decodeURIComponent(m[2])} : {kind: '', value: ''};
}
// The one hash the rest of the page still asks about by name.
function hashRoom(){ const h = hashBits(); return h.kind === 'tree' ? h.value : ''; }

// Writing an address is how this page navigates now, so that back and forward work. Setting
// the hash to what it already is fires no event, and a control pressed twice must still do
// something, so that case is routed by hand.
function setHash(h){
  if(location.hash === h) routeHash();
  else location.hash = h;
}

async function routeHash(){
  const h = hashBits();
  if(h.kind === 'tree'){ await openWalk(h.value); return; }
  if(h.kind === 'canvas'){ await openCanvas(h.value); return; }
  if(h.kind === 'room'){
    const name = onShelf(h.value) || h.value;
    if(!sitting || sitting.name !== name) await openSitting(name);
    else showDialogue();
  }
}

// The control beside the picker, for the room that is picked. A room nobody walked has no
// ledger rows, so the button is not merely disabled there — there is nothing behind it.
function gateTree(){
  const name = picked || (sitting && sitting.name) || '';
  const row = shelf.find(s => s.name === name);
  $('treebtn').hidden = !(row && row.berserk);
}

// A name off a link or off localStorage, as a room on the shelf. The `#tree=` links the
// sheets pages print carry the bare name berserk made the room with, so a room filed into
// a folder since must still answer to it — the same rule the server resolves by, and the
// same refusal when two rooms share a last segment.
function onShelf(want){
  if(!want) return '';
  if(shelf.some(s => s.name === want)) return want;
  if(want.includes('/')) return '';
  const hits = shelf.filter(s => leafOf(s.name) === want);
  return hits.length === 1 ? hits[0].name : '';
}

// ---- the canvas ------------------------------------------------------------------------
// A whole experiment — one folder of rooms — as a picture: a title node, an arrow to every
// room's seed, and under each seed the fan it grew as a grid of uniform cards. It exists
// because a census of thirty rooms of thirty branches cannot be read a fan at a time: what
// bekh is looking for is which fans went somewhere, and that is a SHAPE, visible only when
// the whole thing is on one surface. The camera is the reading instrument — zoomed out the
// cards drop their text and become bricks coloured by how many branches said the same thing,
// zoomed in they are the branches themselves.
//
// The whole folder arrives in one call and never streams: `/api/folder` is built to be small
// enough for that, and a canvas that fetched as you panned would be a canvas that stutters
// exactly when you are looking for something.
const CN = {
  CARD_W: 300, GAP: 18, COLS: 5, PAD: 18,
  BLOCK_GAP: 200, COLUMNS: 6, ROW_GAP: 340, TITLE_GAP: 260,
  SEED_W: 820, STEM_H: 56,
  // Every branch card, both modes, one number. Not a percentile: the grid reads calmer at a
  // brick the eye takes in whole, and how much of a branch fits is the fade's problem.
  CARD_H: 185,
  SUB_GAP: 110,      // between a frame and the frame of a fan drawn under one of its cards
  INDENT: 44,        // how far each level of that staircases right, so depth is visible
  FIT_PAD: 40, BLOCK_PAD: 30,
  // A card carries ink from ~120 css px of on-screen width. 150 was the first guess and it
  // was wrong by exactly the case that matters: a whole 5-across block fitted on a laptop
  // lands between k 0.45 and 0.55, so a 150px threshold sat inside that band and flying to a
  // seed was a coin toss between text and bars. 120 sits below it.
  TEXT_PX: 120,
};
CN.BLOCK_W = CN.COLS * CN.CARD_W + (CN.COLS - 1) * CN.GAP + 2 * CN.PAD;   // 1608

const canStage = $('canstage'), canWorld = $('canworld'), canWires = $('canwires');

let canFolder = '';      // the folder drawn, '' until one is
let canRooms = [];       // the payload's rooms, nodes and all
let canBlocks = [];      // one per room
let canStacks = [];      // every collapsed cluster on the canvas
let canArrows = [];      // [block, card, target, on the path?] — a fan drawn under a branch
let canModels = [];      // the distinct models in this folder, in one fixed order
let canCam = {x: 0, y: 0, k: 1};
let canSized = false;    // the natural heights have been measured and CARD_H applied
let canOpenCard = null;
let canHoverStack = null;
let canBox = {w: 1000, h: 1000};
let canAnim = null;      // the fly-to tween, so a new one can cancel the last

const canOn = () => !$('canvaspane').hidden;
// The filter, in three states, and the whole of it: '' shows everything, 'marked' shows both
// marks, 'keptonly' shows keeps alone. Held as the class the world wears, so the CSS above is
// the only place the rule is written down and the button is just what cycles it.
const CAN_FILTERS = ['', 'marked', 'keptonly'];
const CAN_FILTER_LABEL = {'': 'all', marked: '● + ★', keptonly: '★ only'};
let canFilter = '';
const canPasses = b => canFilter === '' || (b.kept || (canFilter === 'marked' && b.good));
// look-alikes: the same first 40 characters, whitespace collapsed and casefolded
const canKey = t => t.replace(/\s+/g, ' ').trim().toLowerCase().slice(0, 40);
// how hot a cluster is, log-ish in its size — one place, and the legend prints the same bands
const canHeatStep = n => n >= 25 ? 6 : n >= 16 ? 5 : n >= 9 ? 4 : n >= 5 ? 3 : n >= 3 ? 2 : 1;
const CN_WEB = ['http', 'www.', '©', '##', 'Posted by', 'comments:', 'Kindle', 'All rights reserved'];
const CN_BRACKET = /\[[A-Z][^\]]{0,78}\]/;
// The web furniture a base model falls into. Dimmed and never hidden: it is evidence about
// what the document summoned, so it goes quiet rather than away.
const canFurniture = t => CN_WEB.some(m => t.includes(m)) || CN_BRACKET.test(t);
const canTemp = n => typeof n.temperature === 'number' ? num(n.temperature) : '?';
// A model is named by its file; the folder legend carries the whole string, a card has room
// for the front of it and nothing more.
const canShortModel = s => {
  const base = String(s).split('/').pop().replace(/\.gguf$/i, '');
  return base.length > 18 ? base.slice(0, 17) + '…' : base;
};

// The longest common prefix of a cluster, over the raw texts, backed off to the last
// whitespace so the dim/lit seam never lands inside a word.
function canPrefix(texts){
  let p = texts[0];
  for(let i = 1; i < texts.length && p; i++){
    const t = texts[i];
    let j = 0;
    const m = Math.min(p.length, t.length);
    while(j < m && p[j] === t[j]) j++;
    p = p.slice(0, j);
  }
  let cut = -1;
  for(let i = p.length - 1; i >= 0; i--) if(/\s/.test(p[i])){ cut = i; break; }
  return cut >= 0 ? p.slice(0, cut + 1) : '';
}

// The fan under a node: its model children, in the order the file keeps them — which is the
// order they were written, because a json object keeps its insertion order and the server
// hands the room's nodes over untouched. No `ts` rides in this payload on purpose.
function canFanOf(room, id){
  const out = [];
  for(const nid in room.nodes){
    const n = room.nodes[nid];
    if(n.parent === id && n.kind === 'model') out.push(n);
  }
  return out;
}
// A line WE posed into the document — a berserk beat. It sits between the branch taken and
// the fan drawn under it, and it is the one text on the canvas no model wrote.
function canBeatsOf(room, id){
  const out = [];
  for(const nid in room.nodes){
    const n = room.nodes[nid];
    if(n.parent === id && n.kind === 'human') out.push(n);
  }
  return out;
}
// What hangs under a branch: a fan somebody drew under it, and a beat with its own fan.
// Each becomes its own framed grid below the frame this branch sits in.
function canSubsOf(room, id){
  const out = [];
  if(canFanOf(room, id).length) out.push({beat: null, at: id});
  for(const h of canBeatsOf(room, id)) if(canFanOf(room, h.id).length) out.push({beat: h, at: h.id});
  return out;
}
const canUnder = (room, id) =>
  canSubsOf(room, id).reduce((a, s) => a + canFanOf(room, s.at).length, 0);

// root→current as a set of ids: the line this room actually walked. An arrow down it is the
// accent, every other arrow is dim — on a berserk night that is the difference between the
// walk and the thirty branches it refused.
function canPathOf(room){
  const seen = new Set();
  let n = room.nodes[room.current];
  while(n && !seen.has(n.id)){
    seen.add(n.id);
    n = n.parent ? room.nodes[n.parent] : null;
  }
  return seen;
}

// ---- the two marks: they go in the room, not in this browser ----------------------------
// `kept: true` and `good: true`, the same flags the choose screen leaves, written through
// /api/mark, so a harvest made here is in the rooms and in git. ★ is "this made me feel
// something, keep it"; ● is "kind of nice, wouldn't keep", and it exists so a model
// comparison has counts to read. **A branch wears at most one** (2026-09-17): they answer
// one question, and a card wearing both answers it twice — which is what made keep mean
// nothing. Optimistic, because the alternative is a button that waits on a disk write
// before it lights up; a refusal puts the card back the way it was, the cleared mark and all.
const MARK_GLYPH = {kept: ['☆', '★'], good: ['○', '●']};
const OTHER_MARK = {kept: 'good', good: 'kept'};

// The local half of the rule, ahead of the write. Returns whether the other mark was on and
// had to go — a refusal has to put that back too, or the card comes out of a failed write
// wearing neither.
function markLocally(n, mark, want){
  const other = OTHER_MARK[mark];
  const cleared = want && !!n[other];
  if(want){ n[mark] = true; delete n[other]; }   // optional keys: absent means not marked
  else delete n[mark];
  return cleared;
}

function unmarkLocally(n, mark, want, cleared){
  if(want){ delete n[mark]; if(cleared) n[OTHER_MARK[mark]] = true; }
  else n[mark] = true;
}

// The server is where the rule lives, and its answer carries both flags after the write:
// take them, so a page that guessed wrong about what a mark cleared can't stay wrong.
// Returns whether anything moved, so the card is only repainted when it has to be.
function adoptMarks(n, d){
  let moved = false;
  for(const m of ['kept', 'good']){
    if(!!d[m] === !!n[m]) continue;
    if(d[m]) n[m] = true; else delete n[m];
    moved = true;
  }
  return moved;
}

async function canToggleMark(room, node, mark, after){
  const want = !node[mark];
  const paint = () => { after(); canPaintMarks(); if(canFilter) canLayout(); };
  const cleared = markLocally(node, mark, want);
  paint();
  let d;
  try{ d = await postJSON('/api/mark', {room: room.name, node: node.id, mark, on: want}); }
  catch(e){ d = {error: e.message}; }
  if(d && d.error){
    unmarkLocally(node, mark, want, cleared);
    paint();
    sys('not marked: ' + d.error, true);
  }else if(adoptMarks(node, d)) paint();
}

// One glyph button. The label is the shape — ☆/★, ○/● — so the word it stands for lives in
// the title and the aria-label, and a screen reader is not handed a lone star.
function canMarkBtn(room, mark, get, after){
  const b = mk(null, 'button', 'cn-mark cn-' + (mark === 'kept' ? 'keep' : 'good'), '');
  b.type = 'button';
  b.title = mark === 'kept' ? 'keep' : 'good';
  b.setAttribute('aria-label', b.title);
  b.dataset.nodrag = '1';          // a control is not the canvas: a press on it never pans
  b.addEventListener('click', () => canToggleMark(room, get(), mark, after));
  b.paint = node => {
    const on = !!(node && node[mark]);
    b.textContent = MARK_GLYPH[mark][on ? 1 : 0];
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  };
  return b;
}

// Both marks for one card, in the order the bar counts them. `spring` on the first pushes
// the pair to the right end of the head.
function canMarkBtns(room, get, after){
  const btns = ['kept', 'good'].map(m => canMarkBtn(room, m, get, after));
  btns[0].classList.add('spring');
  return btns;
}

// Which model wrote this card, when `reveal` is on: a tag in the head and a patterned edge
// along the top. Pattern and not hue — the heat ramp already owns every cold colour on this
// page, and a fourth one beside it would be read as more heat.
function canModelMark(face, head){
  const edge = mk(face, 'span', 'cn-edge');
  const tag = mk(head, 'span', 'cn-tag');
  return node => {
    const i = node.model ? canModels.indexOf(node.model) : -1;
    edge.className = 'cn-edge m' + (i < 0 ? 0 : i % 4);
    edge.style.visibility = i < 0 ? 'hidden' : '';
    tag.textContent = node.model ? canShortModel(node.model) : '';
    tag.title = node.model || '';
  };
}

// One plain branch, one grid cell.
function canSingle(room, b){
  const card = mk(null, 'div', 'cn-card');
  const face = mk(card, 'div', 'cn-face');
  const head = mk(face, 'div', 'cn-head');
  mk(head, 'span', '', 't' + canTemp(b));
  const mark = canModelMark(face, head);
  // Which branch this card is showing, on the card: the choose screen marks its cards the
  // same way, and it is what lets anything outside the page — a driver, a shot rig — say
  // which node it just pressed keep on.
  card.dataset.node = b.id;
  const under = canUnder(room, b.id);
  // A branch somebody fanned under. The mark is the join in words; the arrow to its own
  // frame below is the join in the picture.
  if(under) mk(head, 'span', 'cn-sub', '▾ ' + under);
  const btns = canMarkBtns(room, () => b, () => paint());
  const paint = () => {
    card.classList.toggle('kept', !!b.kept);
    card.classList.toggle('good', !!b.good);
    for(const x of btns) x.paint(b);
  };
  for(const x of btns) head.appendChild(x);
  if(canFurniture(b.text)) card.classList.add('furniture');
  paint();
  mark(b);
  mk(face, 'div', 'body', b.text);
  mk(face, 'span', 'cn-clip', 'more');
  return card;
}

// A whole look-alike cluster as one card, flipped in place. Two offset sheets behind the face
// say how many without a number: no ×N anywhere, the heat colour and the legend say it.
function canStackCard(room, group){
  const card = mk(null, 'div', 'cn-card cn-stack');
  card.style.setProperty('--cn-heat', 'var(--heat-' + canHeatStep(group.length) + ')');
  for(const cls of ['s2', 's1']) mk(card, 'div', 'cn-sheet ' + cls);   // behind the face
  const face = mk(card, 'div', 'cn-face');
  const head = mk(face, 'div', 'cn-head');
  const temp = mk(head, 'span', '', '');
  const pos = mk(head, 'span', '', '');
  const mark = canModelMark(face, head);
  const prev = mk(head, 'button', 'cn-flip', '‹');
  const next = mk(head, 'button', 'cn-flip', '›');
  for(const [b, label] of [[prev, 'previous member'], [next, 'next member']]){
    b.type = 'button';
    b.dataset.nodrag = '1';
    b.setAttribute('aria-label', label);
  }
  const marks = mk(head, 'span', 'cn-marks');
  const marksK = mk(marks, 'span', 'k', '');
  const marksG = mk(marks, 'span', 'g', '');
  const body = mk(face, 'div', 'body');
  const pre = mk(body, 'span', 'cn-pre');
  const tail = mk(body, 'span', 'cn-tail');
  mk(face, 'span', 'cn-clip', 'more');
  const st = {card, group, temp, pos, pre, tail, marksK, marksG, mark, i: 0, heights: null,
              btns: null, prefix: canPrefix(group.map(g => g.text))};
  // The marks apply to the member on TOP, not to the cluster: a stack is a way of reading
  // thirty near-identical branches, never a way of marking them all at once.
  st.btns = canMarkBtns(room, () => st.group[st.i], () => canSetMember(st, st.i));
  // the counts span already carries the spring here; two auto margins would share the gap
  st.btns[0].classList.remove('spring');
  for(const x of st.btns) head.appendChild(x);
  prev.addEventListener('click', () => canFlip(st, -1));
  next.addEventListener('click', () => canFlip(st, 1));
  card.addEventListener('pointerenter', () => { canHoverStack = st; });
  card.addEventListener('pointerleave', () => { if(canHoverStack === st) canHoverStack = null; });
  canSetMember(st, 0);
  canStacks.push(st);
  return card;
}

function canSetMember(st, i){
  st.i = i;
  const b = st.group[i];
  st.card.dataset.node = b.id;        // the member on top is the one keep would mark
  st.temp.textContent = 't' + canTemp(b);
  st.pos.textContent = (i + 1) + ' / ' + st.group.length;
  st.pre.textContent = st.prefix;
  const rest = b.text.slice(st.prefix.length);
  st.tail.textContent = rest || '(nothing after it)';
  st.tail.classList.toggle('empty', !rest);
  st.mark(b);
  st.card.classList.toggle('furniture', canFurniture(b.text));
  st.card.classList.toggle('kept', !!b.kept);
  st.card.classList.toggle('good', !!b.good);
  for(const x of st.btns) x.paint(b);
  // Clipping is read off the measured natural height and never off scrollHeight: it has to
  // stay right while the card is open, where the box is auto and nothing overflows.
  st.card.classList.toggle('clips', !!st.heights && st.heights[i] > CN.CARD_H);
  const k = st.group.reduce((a, g) => a + (g.kept ? 1 : 0), 0);
  const g = st.group.reduce((a, x) => a + (x.good ? 1 : 0), 0);
  st.marksK.textContent = k ? '★ ' + k : '';
  st.marksG.textContent = g ? '● ' + g : '';
  st.card.classList.toggle('haskept', k > 0);
  st.card.classList.toggle('hasgood', g > 0);
}

// Wrap around; with the filter on, walk only the members that earned the card its place.
function canFlip(st, dir){
  const n = st.group.length;
  for(let step = 1; step <= n; step++){
    const j = ((st.i + dir * step) % n + n) % n;
    if(canPasses(st.group[j])){ canSetMember(st, j); return; }
  }
}

// One fan's cells. A branch somebody fanned under is never folded into a cluster: it is a
// road taken, not one of thirty near-identical ones, and it has a frame hanging off it.
function canCells(room, fan){
  const groups = new Map();
  for(const b of fan){
    if(canUnder(room, b.id)) continue;
    const k = canKey(b.text);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(b);
  }
  const out = [], placed = new Set();
  for(const b of fan){
    if(canUnder(room, b.id)){ out.push({stack: false, nodes: [b]}); continue; }
    const k = canKey(b.text), g = groups.get(k);
    if(g.length > 1){
      if(placed.has(k)) continue;          // the siblings take no grid cell
      placed.add(k);
      out.push({stack: true, nodes: g});
    }else{
      out.push({stack: false, nodes: [b]});
    }
  }
  return out;
}

// One fan and everything hanging off it, appended to the block in document order: this fan's
// frame, then a frame for every branch of it that was fanned under, depth first. A census is
// one frame; a berserk night is a staircase of them, one per beat.
function canGrow(room, block, at, beat, from, depth, path){
  if(beat){
    const line = mk(block, 'div', 'cn-beat');
    line._depth = depth;
    line._beat = true;
    mk(line, 'span', 'body', beat.text.trim() || '(an empty line)');
    block._rows.push(line);
    // The arrow lands on the beat, and the frame under it needs none: the beat sits right
    // on top of its own fan, which is exactly where it stands in the document.
    if(from) canArrows.push([block, from, line, path.has(beat.id)]);
    from = null;
  }
  const frame = mk(block, 'div', 'cn-frame');
  frame._depth = depth;
  block._rows.push(frame);
  if(from) canArrows.push([block, from, frame, path.has(at)]);
  const cells = canCells(room, canFanOf(room, at));
  frame._cells = cells.length;
  const cards = cells.map(cell =>
    frame.appendChild(cell.stack ? canStackCard(room, cell.nodes) : canSingle(room, cell.nodes[0])));
  // Depth first, and only after the whole frame exists, so a card's own frame is always
  // below the frame the card sits in.
  cells.forEach((cell, i) => {
    if(cell.stack) return;           // a clustered branch never has a fan under it
    for(const sub of canSubsOf(room, cell.nodes[0].id))
      canGrow(room, block, sub.at, sub.beat, cards[i], depth + 1, path);
  });
}

function canBuildBlock(room){
  const block = mk(canWorld, 'div', 'cn-block');
  block.style.width = CN.BLOCK_W + 'px';
  block._rows = [];               // every frame and beat in it, in document order
  const seedNode = room.nodes[room.root] || {text: ''};
  const seedText = seedNode.text || '';
  const seed = mk(block, 'div', 'cn-seed');
  seed.style.width = CN.SEED_W + 'px';
  const label = leafOf(room.name);
  const h2 = mk(seed, 'h2', '', label);
  h2.dataset.nodrag = '1';
  h2.title = room.title && room.title !== room.name ? room.title : room.name;
  // The END of the seed is what the model was standing on, so that is the part shown.
  const short = seedText.length > 280 ? '…' + seedText.slice(-280) : seedText;
  const body = mk(seed, 'div', 'body', short || '(empty — the room began on nothing)');
  const foot = mk(seed, 'div', 'cn-foot');
  const more = mk(foot, 'button', '', 'whole seed ▸');
  more.type = 'button';
  more.dataset.nodrag = '1';
  let open = false;
  more.addEventListener('click', () => {
    open = !open;
    body.textContent = open ? seedText : short;
    more.textContent = open ? 'whole seed ▾' : 'whole seed ▸';
    canLayout();
  });
  // A real button in the card's bottom-right corner, not a dim word beside `whole seed`:
  // the canvas is for the gist and the room is for the reading, so the way across has to be
  // the easiest thing on the card to find and to hit.
  const go = mk(foot, 'button', 'cn-go', '→');
  go.type = 'button';
  go.dataset.nodrag = '1';
  go.title = 'open this room';
  go.setAttribute('aria-label', 'open this room');
  go.addEventListener('click', () => canOpenRoom(room.name));
  if(room.berserk){
    const tr = mk(foot, 'button', '', 'tree ↗');
    tr.type = 'button';
    tr.dataset.nodrag = '1';
    tr.title = "berserk's walk of this room, as a tree";
    tr.addEventListener('click', () => {
      canSaveCam();
      setHash('#tree=' + encodeURIComponent(room.name));
    });
  }
  mk(block, 'div', 'cn-stem');
  const far = mk(block, 'div', 'cn-farlabel', label);
  // The root is read like any other node: what hangs under it is a fan (a census), or a
  // posed line with a fan under that (a berserk night opens on one of ours), or both. A room
  // with no branches yet is the one case with nothing to grow, and it still gets its frame —
  // an empty box under a seed is a true statement about that room.
  const path = canPathOf(room);
  const subs = canSubsOf(room, room.root);
  if(!subs.length) canGrow(room, block, room.root, null, null, 0, path);
  else for(const sub of subs) canGrow(room, block, sub.at, sub.beat, null, 0, path);
  const b = {el: block, room, seedEl: seed, h2, stem: block.querySelector('.cn-stem'),
             farlabel: far, name: room.name};
  h2.addEventListener('click', () => canFlyTo(b));
  return b;
}

function canBuild(d){
  canWorld.querySelectorAll('.cn-block').forEach(el => el.remove());
  canBlocks = [];
  canStacks = [];
  canArrows = [];
  canSized = false;
  canOpenCard = null;
  canHoverStack = null;
  canWorld.classList.remove('uniform', 'far');
  canFolder = d.folder;
  canRooms = d.rooms || [];
  // Every node knows its own id from here on: the payload keys them and the page walks them
  // by parent, so carrying the key inside is worth the one loop.
  const models = new Set();
  let branches = 0;
  for(const room of canRooms){
    for(const nid in room.nodes){
      const n = room.nodes[nid];
      n.id = nid;
      if(n.kind === 'model'){
        branches++;
        if(n.model) models.add(n.model);
      }
    }
  }
  canModels = [...models].sort();
  for(const room of canRooms) canBlocks.push(canBuildBlock(room));

  $('canname').textContent = d.folder;
  const counts = canRooms.length + (canRooms.length === 1 ? ' room · ' : ' rooms · ') +
    branches + (branches === 1 ? ' branch' : ' branches');
  $('cancounts').textContent = counts;
  $('cantitleh').textContent = d.folder;
  $('cantitlep').textContent = counts;
  // With one model or none there is nothing to reveal, and the switch would be a control
  // that says something about a distinction that isn't there.
  const many = canModels.length > 1;
  $('canreveal').hidden = !many;
  if(!many) canReveal(false);
  const legend = $('canmodels');
  legend.textContent = '';
  canModels.forEach((m, i) => {
    const row = mk(legend, 'span', 'm m' + (i % 4));
    mk(row, 'i');
    mk(row, 'span', '', canShortModel(m)).title = m;
  });
  canPaintMarks();
}

// `★ N · ● M` across the whole folder, and — only under reveal — which model each mark came
// out of. Recomputed rather than counted up and down: one wrong increment and the number
// lies for the rest of the session.
function canPaintMarks(){
  const n = {kept: 0, good: 0};
  const by = {kept: new Map(), good: new Map()};
  for(const room of canRooms){
    for(const nid in room.nodes){
      const node = room.nodes[nid];
      const m = node.model ? canShortModel(node.model) : 'not recorded';
      for(const mark of ['kept', 'good']){
        if(!node[mark]) continue;
        n[mark]++;
        by[mark].set(m, (by[mark].get(m) || 0) + 1);
      }
    }
  }
  const box = $('cankept');
  box.querySelector('.k').textContent = '★ ' + n.kept;
  box.querySelector('.g').textContent = '● ' + n.good;
  const line = mark => [...by[mark]].map(([m, c]) => m + ' ' + c).join(' · ');
  const parts = [];
  if(by.kept.size) parts.push('★ by model: ' + line('kept'));
  if(by.good.size) parts.push('● by model: ' + line('good'));
  $('cankeptby').textContent = parts.join(' · ');
}

// ---- one card height for the whole canvas ------------------------------------------------
// Every branch is measured once at its natural height — for a stack that means every member,
// so the population is all the continuations and not the cells they collapsed into — but only
// to know which ones clip. Measured in passes over the member index (every stack is written
// for member i, then every stack is read), so it costs ~30 forced layouts for the page
// instead of one per member.
function canMeasure(){
  if(canSized) return;
  if(!canStage.clientWidth) return;   // hidden: every box would measure zero and all clip
  const maxN = canStacks.reduce((m, s) => Math.max(m, s.group.length), 0);
  const saved = canStacks.map(s => s.i);
  for(const s of canStacks) s.heights = new Array(s.group.length).fill(0);
  for(let i = 0; i < maxN; i++){
    for(const s of canStacks) if(i < s.group.length) canSetMember(s, i);
    for(const s of canStacks) if(i < s.group.length) s.heights[i] = s.card.offsetHeight;
  }
  const singles = [...canWorld.querySelectorAll('.cn-card:not(.cn-stack)')];
  for(const c of singles) c._nat = c.offsetHeight;
  canWorld.style.setProperty('--cn-card-h', CN.CARD_H + 'px');
  canWorld.classList.add('uniform');
  canSized = true;
  for(const c of singles) c.classList.toggle('clips', c._nat > CN.CARD_H);
  canStacks.forEach((s, k) => canSetMember(s, saved[k]));   // re-applies .clips per member
}

// ---- layout: x by hand, y after the browser has measured the content ---------------------
function canLayout(){
  if(!canBlocks.length) return;
  canMeasure();
  const nCols = Math.min(CN.COLUMNS, canBlocks.length);
  const totalW = nCols * CN.BLOCK_W + (nCols - 1) * CN.BLOCK_GAP;

  for(const b of canBlocks){
    b.seedEl.style.marginBottom = CN.STEM_H + 'px';
    let first = true, afterBeat = false, left = 0, right = CN.SEED_W;
    for(const row of b.el._rows){
      let w;
      if(row._beat){
        w = row.offsetWidth;
      }else{
        // As many grid columns as the frame has cards, up to five: a seed whose thirty
        // branches collapsed to one brick must not sit in a 1600px empty box.
        const cols = Math.max(1, Math.min(row._cells, CN.COLS));
        w = cols * CN.CARD_W + (cols - 1) * CN.GAP + 2 * CN.PAD;
        row.style.gridTemplateColumns = `repeat(${cols}, ${CN.CARD_W}px)`;
      }
      // The first frame sits under the seed card; every level below staircases right, so the
      // depth of a walk is visible before a word of it is read. Never past the block's edge.
      const want = Math.min((CN.BLOCK_W - CN.SEED_W) / 2, CN.BLOCK_W - w) + row._depth * CN.INDENT;
      const x = Math.max(0, Math.min(want, CN.BLOCK_W - w));
      row.style.marginLeft = x + 'px';
      // A beat and the fan under it are one thing: the beat gets the gap, and its fan sits
      // right against it, because that is where the line stands in the document.
      row.style.marginTop = (first ? 0 : afterBeat ? 12 : CN.SUB_GAP) + 'px';
      first = false;
      afterBeat = !!row._beat;
      left = Math.min(left, x);
      right = Math.max(right, x + w);
    }
    // What the block actually covers, for the fly-to camera: the seed card is centred in the
    // column and a frame may be narrower, so flying to the empty column is no use.
    b.contentX = Math.min((CN.BLOCK_W - CN.SEED_W) / 2, left);
    b.contentW = Math.max((CN.BLOCK_W + CN.SEED_W) / 2, right) - b.contentX;
  }

  const title = $('cantitle');
  title.style.left = ((totalW - title.offsetWidth) / 2) + 'px';
  title.style.top = '0px';
  const topY = title.offsetHeight + CN.TITLE_GAP;

  // Masonry, greedy: each room in its own order drops into the column that is currently
  // shortest (ties go left), so a seed that collapsed to one brick leaves no hole under it.
  // The tree comes out uneven, and that is the point: the shape is the data, not a grid.
  const bottoms = new Array(nCols).fill(topY);
  const inCol = new Array(nCols).fill(0);
  for(const b of canBlocks){
    let c = 0;
    for(let j = 1; j < nCols; j++) if(bottoms[j] < bottoms[c] - 0.5) c = j;
    b.el.style.left = (c * (CN.BLOCK_W + CN.BLOCK_GAP)) + 'px';
    b.el.style.top = bottoms[c] + 'px';
    b.col = c;
    b.colIndex = inCol[c]++;
    bottoms[c] += b.el.offsetHeight + CN.ROW_GAP;
  }
  const totalH = Math.max.apply(null, bottoms) - CN.ROW_GAP;

  // The stem: from the seed card's bottom edge down into the first frame, over its middle.
  for(const b of canBlocks){
    const sh = b.seedEl.offsetHeight;
    const frame = b.el._rows[0];
    const fx = frame ? parseFloat(frame.style.marginLeft || 0) + frame.offsetWidth / 2 : CN.BLOCK_W / 2;
    b.stem.style.left = (fx - 1) + 'px';
    b.stem.style.top = sh + 'px';
    b.stem.style.height = CN.STEM_H + 'px';
    b.farlabel.style.top = Math.max(8, (sh - 72) / 2) + 'px';
  }

  canBox = {w: totalW, h: totalH};
  canDrawWires(topY);
}

// Where an element sits inside its block. Everything in a block is in normal flow under one
// absolutely positioned box, so the offset chain is the answer and no rect has to be measured
// through the camera's transform.
function canLocal(el, block){
  let x = 0, y = 0;
  for(let n = el; n && n !== block; n = n.offsetParent){ x += n.offsetLeft; y += n.offsetTop; }
  return {x, y};
}

// The arrows: title → every seed card, and every branch that was fanned under → its own
// frame. A seed at the top of a column gets a straight-ish curve; everything under it is
// routed down the corridor on the left of its column, which is the only vertical lane nothing
// is ever drawn in. Seeds sharing a corridor are offset 16px apart so the runs read apart.
function canDrawWires(topY){
  canWires.textContent = '';
  canWires.setAttribute('width', canBox.w + 400);
  canWires.setAttribute('height', canBox.h + 200);
  canWires.style.left = '-200px';
  const OX = 200;      // the svg hangs 200px left so a corridor left of block 0 still fits
  const title = $('cantitle');
  const tx = title.offsetLeft + title.offsetWidth / 2 + OX;
  const ty = title.offsetTop + title.offsetHeight;
  const path = (d, dim) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    if(dim) p.setAttribute('class', 'dim');
    canWires.appendChild(p);
  };

  for(const b of canBlocks){
    const sx = b.el.offsetLeft + CN.BLOCK_W / 2 + OX;
    const sy = b.el.offsetTop;
    if(b.colIndex === 0){
      const dy = sy - ty;
      path(`M ${tx} ${ty} C ${tx} ${ty + dy * 0.55}, ${sx} ${sy - dy * 0.55}, ${sx} ${sy}`);
    }else{
      const cx = b.el.offsetLeft - CN.BLOCK_GAP / 2 + OX + (b.colIndex - 2) * 16;
      const y1 = topY - 120, y2 = sy - 140;
      path(`M ${tx} ${ty} C ${tx} ${ty + 90}, ${cx} ${y1 - 90}, ${cx} ${y1}`
         + ` L ${cx} ${y2} C ${cx} ${y2 + 70}, ${sx} ${sy - 90}, ${sx} ${sy}`);
    }
  }
  // A branch and the fan drawn under it. Measured, never guessed: the frame it lands on is
  // wherever the flow put it, and a line drawn on an assumption is a diagram that lies.
  for(const [block, card, target, took] of canArrows){
    const a = canLocal(card, block), t = canLocal(target, block);
    const x1 = block.offsetLeft + a.x + card.offsetWidth / 2 + OX;
    const y1 = block.offsetTop + a.y + card.offsetHeight;
    const x2 = block.offsetLeft + t.x + target.offsetWidth / 2 + OX;
    const y2 = block.offsetTop + t.y;
    const d = Math.max(40, (y2 - y1) * 0.4);
    path(`M ${x1} ${y1} C ${x1} ${y1 + d}, ${x2} ${y2 - d}, ${x2} ${y2}`, !took);
  }
}

// ---- the camera ---------------------------------------------------------------------------
function canView(){ return {w: canStage.clientWidth, h: canStage.clientHeight}; }

// The zoom at which cards stop being bars and start carrying ink. Two things decide it and the
// smaller wins: a card is worth reading from ~120 css px of width, but a narrow window never
// gets a whole block that big and a block you flew to has to be readable. Read every time, so
// a resize moves the threshold.
function canTextK(){
  const v = canView();
  const blockFit = (v.w - CN.BLOCK_PAD * 2) / CN.BLOCK_W;
  return Math.min(CN.TEXT_PX / CN.CARD_W, blockFit * 0.985);
}

// Painted on the spot, not deferred to the next frame. A pointermove already arrives at most
// once a frame, so there is nothing to coalesce that the browser does not coalesce anyway —
// and a paint that waits for a frame is a paint that never happens where no frame is ever
// produced (a headless shot, a tab nobody is looking at), which is a camera that lies about
// where it is.
function canApply(){
  canWorld.style.transform = `translate(${canCam.x}px, ${canCam.y}px) scale(${canCam.k})`;
  canWorld.classList.toggle('far', canCam.k < canTextK());
  $('canzoom').textContent = Math.round(canCam.k * 100) + '%';
}
const canClampK = k => Math.min(2, Math.max(0.05, k));

function canCamFor(bx, by, bw, bh, pad){
  const v = canView();
  const k = canClampK(Math.min((v.w - pad * 2) / bw, (v.h - pad * 2) / bh));
  return {k, x: (v.w - bw * k) / 2 - bx * k, y: (v.h - bh * k) / 2 - by * k};
}

function canGoTo(target, animate){
  if(canAnim){ cancelAnimationFrame(canAnim); canAnim = null; }
  if(!animate){ canCam = target; canApply(); canSaveCam(); return; }
  const from = Object.assign({}, canCam), t0 = performance.now(), dur = 300;
  const ease = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const step = now => {
    const u = Math.min(1, (now - t0) / dur), e = ease(u);
    canCam = {x: from.x + (target.x - from.x) * e,
              y: from.y + (target.y - from.y) * e,
              k: from.k + (target.k - from.k) * e};
    canApply();
    if(u < 1){ canAnim = requestAnimationFrame(step); }
    else { canAnim = null; canSaveCam(); }
  };
  canAnim = requestAnimationFrame(step);
}

const canFit = animate => canGoTo(canCamFor(0, 0, canBox.w, canBox.h, CN.FIT_PAD), animate);
function canFlyTo(b, animate){
  if(!b) return;
  canGoTo(canCamFor(b.el.offsetLeft + b.contentX, b.el.offsetTop, b.contentW,
                    b.el.offsetHeight, CN.BLOCK_PAD), animate !== false);
}
function canZoomAt(px, py, factor){
  const k = canClampK(canCam.k * factor);
  const f = k / canCam.k;
  canCam = {k, x: px - (px - canCam.x) * f, y: py - (py - canCam.y) * f};
  canApply();
}

// Where the camera was, per folder, for this tab only: opening a room and coming back with
// the browser's own back button has to land on the same picture, and a camera that outlived
// the tab would be a page that opens somewhere you have forgotten choosing.
const canCamKey = f => 'loom.canvas.' + f;
function canSaveCam(){
  if(!canFolder) return;
  try{ sessionStorage.setItem(canCamKey(canFolder), JSON.stringify(canCam)); }catch(e){}
}
function canRestoreCam(){
  let v = null;
  try{ v = JSON.parse(sessionStorage.getItem(canCamKey(canFolder)) || 'null'); }catch(e){}
  if(!v || typeof v.k !== 'number' || typeof v.x !== 'number' || typeof v.y !== 'number')
    return false;
  canCam = {x: v.x, y: v.y, k: canClampK(v.k)};
  canApply();
  return true;
}

// ---- pan, wheel-zoom, pinch ---------------------------------------------------------------
const canPointers = new Map();
let canPanning = false, canMoved = 0, canLast = null, canPinch = null;

canStage.addEventListener('pointerdown', ev => {
  // Reset first: a press that lands on a control must clear the last drag's distance, or the
  // swallow-the-click guard below eats that control's click.
  canMoved = 0;
  if(ev.target.closest('[data-nodrag]')) return;
  // No selection and no native drag: a pan that paints half a card blue is the browser's
  // default and it has to be refused at the source, not cleaned up after.
  ev.preventDefault();
  const sel = getSelection && getSelection();
  if(sel && !sel.isCollapsed) sel.removeAllRanges();
  canPointers.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  // Capture keeps the moves coming when the finger leaves the stage; it is not what makes
  // the pan work, and a browser that refuses it (or a synthetic pointer that was never
  // really down) must not take panning down with it.
  try{ canStage.setPointerCapture(ev.pointerId); }catch(e){}
  if(canPointers.size === 1){
    canPanning = true;
    canLast = {x: ev.clientX, y: ev.clientY};
  }else if(canPointers.size === 2){
    canPanning = false;
    const [a, b] = [...canPointers.values()];
    canPinch = {d: Math.hypot(a.x - b.x, a.y - b.y)};
  }
});

canStage.addEventListener('pointermove', ev => {
  if(!canPointers.has(ev.pointerId)) return;
  canPointers.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  const r = canStage.getBoundingClientRect();
  if(canPointers.size === 2 && canPinch){
    const [a, b] = [...canPointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if(canPinch.d > 0)
      canZoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / canPinch.d);
    canPinch.d = d;
    return;
  }
  if(!canPanning) return;
  const dx = ev.clientX - canLast.x, dy = ev.clientY - canLast.y;
  canMoved += Math.abs(dx) + Math.abs(dy);
  canLast = {x: ev.clientX, y: ev.clientY};
  canCam.x += dx;
  canCam.y += dy;
  canApply();
});

function canEndPointer(ev){
  canPointers.delete(ev.pointerId);
  if(canPointers.size < 2) canPinch = null;
  if(canPointers.size === 0){ canPanning = false; canSaveCam(); }
}
canStage.addEventListener('pointerup', canEndPointer);
canStage.addEventListener('pointercancel', canEndPointer);

// A click that came out of a real drag must not also fire the card's action.
canStage.addEventListener('click', ev => {
  if(canMoved > 6){ ev.stopPropagation(); ev.preventDefault(); }
}, true);

// Opening a clipped card, as an overlay. One listener for the whole canvas: the card under
// the click decides. A card that fits has nothing to show, so it does not open; a control
// inside a card is never the card.
const canCloseCard = () => {
  if(canOpenCard){ canOpenCard.classList.remove('open'); canOpenCard = null; }
};
canStage.addEventListener('click', ev => {
  if(ev.target.closest('[data-nodrag]')) return;
  const card = ev.target.closest('.cn-card');
  if(!card || card === canOpenCard){ canCloseCard(); return; }
  canCloseCard();
  if(card.classList.contains('clips')){ card.classList.add('open'); canOpenCard = card; }
});

canStage.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = canStage.getBoundingClientRect();
  const scale = Math.exp(-ev.deltaY * (ev.deltaMode === 1 ? 0.05 : 0.0018));
  canZoomAt(ev.clientX - r.left, ev.clientY - r.top, scale);
  canSaveCam();
}, {passive: false});

// ---- the screen ---------------------------------------------------------------------------
function showCanvas(){
  choosing = false;
  menu(false);
  $('doc').hidden = true;
  $('fanjump').hidden = true;
  $('fanpane').hidden = true;
  $('notepane').hidden = true;
  $('artpane').hidden = true;
  $('textpane').hidden = true;
  $('canvaspane').hidden = false;
}

function canReveal(on){
  $('canvaspane').classList.toggle('reveal', on);
  $('canreveal').setAttribute('aria-pressed', String(on));
}

async function openCanvas(folder){
  if(!folder) return;
  // Already drawn: this is the back button coming home, and re-reading the folder would throw
  // away the camera for nothing.
  if(canFolder === folder && canBlocks.length){
    showCanvas();
    if(!canRestoreCam()) canFit(false);
    return;
  }
  await loadCanvas(folder, false);
}

async function loadCanvas(folder, keepCam){
  let d;
  try{ d = await getJSON('/api/folder?name=' + encodeURIComponent(folder)); }
  catch(e){ sys('could not read that folder: ' + e.message, true); return; }
  if(d.error){ sys(d.error, true); return; }
  const was = keepCam ? Object.assign({}, canCam) : null;
  canBuild(d);
  showCanvas();
  canLayout();
  if(was){ canCam = was; canApply(); }
  else if(!canRestoreCam()) canFit(false);
}

// The room behind a seed card, on the ordinary dialogue screen, in this tab — and at an
// address, so that back comes home to the picture with the camera where it was.
function canOpenRoom(name){
  canSaveCam();
  setHash('#room=' + encodeURIComponent(name));
}

$('canback').addEventListener('click', showDialogue);
$('canfit').addEventListener('click', () => canFit(true));
$('canreload').addEventListener('click', () => canFolder && loadCanvas(canFolder, true));
$('cankeptonly').addEventListener('click', ev => {
  canFilter = CAN_FILTERS[(CAN_FILTERS.indexOf(canFilter) + 1) % CAN_FILTERS.length];
  for(const f of CAN_FILTERS) if(f) canWorld.classList.toggle(f, f === canFilter);
  ev.currentTarget.textContent = CAN_FILTER_LABEL[canFilter];
  // A stack that survives the filter must be showing one of the members that earned it.
  if(canFilter) for(const s of canStacks){
    if(!canPasses(s.group[s.i])){
      const j = s.group.findIndex(canPasses);
      if(j >= 0) canSetMember(s, j);
    }
  }
  canLayout();
});
$('canreveal').addEventListener('click', () =>
  canReveal(!$('canvaspane').classList.contains('reveal')));

// The arrows belong to whatever stack the pointer is resting on, and to nothing else; f and
// escape belong to the canvas, and only while it is the screen in front.
document.addEventListener('keydown', ev => {
  if(!canOn() || ev.defaultPrevented) return;
  if(ev.target && ev.target.closest && ev.target.closest('input, textarea')) return;
  if(canHoverStack && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')){
    ev.preventDefault();
    canFlip(canHoverStack, ev.key === 'ArrowRight' ? 1 : -1);
    return;
  }
  if(ev.key === 'f') canFit(true);
  // Escape closes the open card first: it is the nearer thing to back out of.
  if(ev.key === 'Escape'){ if(canOpenCard) canCloseCard(); else canFit(true); }
});
// The threshold reads the viewport, so a resize can move a card across it.
window.addEventListener('resize', () => { if(canOn()) canApply(); });

// ---- the tree ------------------------------------------------------------------------
function node(id){ return sitting.nodes[id]; }
function kids(id){
  return Object.values(sitting.nodes)
    .filter(n => n.parent === id && !n.pruned)
    .sort((a, b) => a.ts - b.ts);       // newest at the bottom, in both panes
}
function path(){
  const out = [];
  let n = node(sitting.current);
  while(n){ out.unshift(n); n = n.parent ? node(n.parent) : null; }
  return out;
}
function promptFrom(id){
  const out = [];
  let n = node(id);
  while(n){ out.unshift(n.text); n = n.parent ? node(n.parent) : null; }
  return out.join('');
}
function addNode(kind, text, parent, meta){
  const n = {id: hex(4), parent: parent, kind: kind, text: text, ts: Date.now() / 1000,
             pruned: false, posed: false, meta: meta || null};
  sitting.nodes[n.id] = n;
  return n;
}

// A pick can happen while the previous candidate is still saving. Queue snapshots so
// an older write can never overwrite the selected path, or write into a different room.
function save(){
  if(!sitting) return Promise.resolve(true);
  const owner = sitting;
  const snapshot = JSON.parse(JSON.stringify(owner));
  const job = saveQueue.then(async () => {
    try{
      const d = await postJSON('/api/sitting', snapshot);
      if(d && d.error) throw new Error(d.error);
      if(d && d.updated) owner.updated = d.updated;
      return true;
    }catch(e){
      sys('Not saved: ' + e.message, true);
      return false;
    }
  });
  saveQueue = job;
  return job;
}

// ---- rendering -----------------------------------------------------------------------
// DOM building only, never innerHTML — fim's law, and here it is not a formality: every
// model node is a string a base model wrote, and a base model continuing a chat log will
// happily produce `<img onerror=...>` because its training set is full of them.
// The strip under a model line: the one number that is not the same for every branch any
// more, and the mark that says these are not the model's words. The rest of the sampler
// stays in the file — put it all on screen and the document stops being the thing you read.
const num = x => String(Math.round(x * 1000) / 1000);
function hasProbs(n){ return !!(n.meta && n.meta.probs && n.meta.probs.length); }
function footLine(n, ops){
  const f = document.createElement('div');
  f.className = 'foot';
  const t = n.meta && n.meta.params && n.meta.params.temperature;
  if(n.kind === 'model' && typeof t === 'number'){
    const s = document.createElement('span');
    s.textContent = 'temp ' + num(t);
    f.appendChild(s);
  }
  // What this line cost to choose: log2 of the fan it came out of, quietly, beside its
  // temperature. One branch out of four is two bits of this document that are bekh's.
  const fan = n.kind === 'model' && sitting ? fanSize(n) : 0;
  if(fan > 1){
    const s = document.createElement('span');
    s.textContent = (Math.round(Math.log2(fan) * 10) / 10) + ' bits';
    s.title = 'one of ' + fan;
    f.appendChild(s);
  }
  if(n.meta && n.meta.fork){
    // Evidence, like posed: this line did not come out of the model in one run. Somebody
    // reached into it at token N and took the road not taken.
    const s = document.createElement('span');
    s.textContent = 'forked at ' + n.meta.fork.at_token;
    f.appendChild(s);
  }
  if(n.posed){
    const p = document.createElement('span');
    p.className = 'posed';
    p.textContent = 'posed';
    f.appendChild(p);
  }
  // Only in the document, never on a card: the whole card is the pick target, and a line
  // of clickable tokens inside it would be a fight over every click.
  if(ops && n.kind === 'model' && hasProbs(n)){
    const on = painted.has(n.id);
    const b = ghostBtn('tokens', () => {
      if(on) painted.delete(n.id); else painted.add(n.id);
      closeAlts();
      render();
    });
    b.classList.toggle('on', on);
    f.appendChild(b);
  }
  return f.firstChild ? f : null;
}

// ---- bits of curation ----------------------------------------------------------------
// janus's measure (generative.ink), twinned from eva.py's `curation` — how much of this
// document is the human. Picking from a fan of n and keeping m costs log2(n/m) bits; a line
// he typed, or a model line he edited, costs its whole token count, because every token of
// it came from him. Along the current path only: the document is what is on the path.
const estTokens = s => s ? Math.max(1, Math.round(s.length / 4)) : 0;
// n is what the fan produced, PRUNED ONES INCLUDED — they were written, and rejecting them
// is the choice being measured.
function fanSize(n){
  if(!n.parent) return 0;
  return Object.values(sitting.nodes)
    .filter(s => s.parent === n.parent && s.kind === 'model').length;
}
// How many model children of this node's parent say the same thing, trimmed — itself
// included, pruned ones included. 1 means it is the only one.
function twins(n){
  const same = n.text.trim();
  return Object.values(sitting.nodes)
    .filter(s => s.parent === n.parent && s.kind === 'model' && s.text.trim() === same).length;
}

function curation(){
  const all = Object.values(sitting.nodes);
  let bits = 0, picks = 0;
  for(const n of path()){
    if(n.kind !== 'model' || n.posed){
      const t = estTokens(n.text);
      if(t){ bits += t; picks++; }
      continue;
    }
    const sibs = all.filter(s => s.parent === n.parent && s.kind === 'model');
    const kept = sibs.filter(s => !s.pruned &&
      (s.id === n.id || all.some(k => k.parent === s.id)));
    // A branch that says exactly what a kept branch says cost nothing to throw away — the
    // same text was on offer twice, so the choice was between fewer things than it looks.
    const texts = new Set(kept.map(s => s.text.trim()));
    const m = sibs.filter(s => kept.includes(s) || texts.has(s.text.trim())).length;
    if(sibs.length > 1 && m > 0 && m < sibs.length){
      bits += Math.log2(sibs.length / m);
      picks++;
    }
  }
  const tokens = estTokens(path().map(n => n.text).join(''));
  return {bits, tokens, picks,
          perToken: tokens ? bits / tokens : 0,
          perPick: picks ? Math.round(tokens / picks) : 0};
}
function drawCuration(){
  const el = $('curation');
  if(!sitting){ el.textContent = ''; return; }
  const c = curation();
  el.textContent = 'curation: ' + (Math.round(c.bits * 10) / 10) + ' bits · ' +
    (Math.round(c.perToken * 1000) / 1000) + ' bits/token' +
    (c.picks ? ' · 1 pick per ' + c.perPick + ' tokens' : '');
}

// ---- how improbable was that word ----------------------------------------------------
// Which lines are showing their tokens. Page state, deliberately not in the file: it is a
// way of looking at a line, not a fact about it.
const painted = new Set();

const probOf = p => Math.exp(Number(p.logprob) || -40);
function pct(p){ return (p * 100).toFixed(p >= 0.1 ? 0 : p >= 0.01 ? 1 : 2) + '%'; }
// Whitespace has to be visible in a list of alternatives: half the choices a tokenizer
// offers are " word" against "word", and a row that showed them identically would be a
// fork you cannot aim.
function shown(tok){
  return String(tok || '').replace(/\n/g, '⏎').replace(/\t/g, '⇥').replace(/ /g, '␣');
}
// -log10 and not the probability: everything worth seeing lives between 10% and 0.1%, and
// a ramp linear in p would spend its whole range on the difference between 90% and 60%.
// 3 decades to full strength, so 10% is a visible wash and 0.1% is unmistakable.
function tint(p){
  const a = Math.min(Math.max(-Math.log10(Math.max(p, 1e-9)) / 3, 0), 1) * 42;
  return a < 1.5 ? '' : 'color-mix(in srgb, var(--hot) ' + a.toFixed(1) + '%, transparent)';
}

function paintBody(body, n){
  body.textContent = '';
  const probs = n.meta.probs;
  let at = 0;
  for(let i = 0; i < probs.length; i++){
    const tok = probs[i].token || '';
    // The probabilities are a record of ONE run; the text can have moved since (an edit, a
    // fork filled out from a different call). The moment they stop matching the line, stop
    // painting — a token drawn over the wrong word is worse than no paint at all.
    if(!tok || n.text.slice(at, at + tok.length) !== tok) break;
    const s = document.createElement('span');
    s.className = 'tok';
    s.textContent = tok;
    const p = probOf(probs[i]);
    const bg = tint(p);
    if(bg) s.style.background = bg;
    s.title = pct(p);
    const at_ = i;
    s.addEventListener('click', e => { e.stopPropagation(); showAlts(n, at_, s); });
    body.appendChild(s);
    at += tok.length;
  }
  // Whatever the probabilities don't reach goes in plain. The document is never wrong.
  if(at < n.text.length) body.appendChild(document.createTextNode(n.text.slice(at)));
}

function closeAlts(){
  const box = $('alts');
  if(box) box.remove();
}

function showAlts(n, i, anchor){
  closeAlts();
  const here = n.meta.probs[i];
  const box = document.createElement('div');
  box.id = 'alts';
  const head = document.createElement('div');
  head.className = 'head';
  head.textContent = 'instead of ' + shown(here.token) + ' — pick one to fork here';
  box.appendChild(head);
  for(const alt of (here.top_logprobs || [])){
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'altrow' + (alt.token === here.token ? ' here' : '');
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = shown(alt.token);
    const p = document.createElement('span');
    p.className = 'p';
    p.textContent = pct(probOf(alt));
    row.appendChild(t);
    row.appendChild(p);
    // The token that was actually taken is already in the document — clicking it would
    // make a fork identical to the line it came from.
    row.addEventListener('click', () => alt.token === here.token ? closeAlts() : forkAt(n, i, alt));
    box.appendChild(row);
  }
  document.body.appendChild(box);
  const r = anchor.getBoundingClientRect();
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12)) + 'px';
  // below the word, or above it when there is no room — a popup half off the bottom of a
  // phone is a control that isn't there
  box.style.top = (r.bottom + 6 + h < window.innerHeight ? r.bottom + 6 : Math.max(12, r.top - h - 6)) + 'px';
}

// A fork is an ordinary sibling: same parent, same params, walkable with ‹ n/m › like any
// branch of a fan. The only thing that makes it special is written in its meta, and the
// only thing that makes it interesting is that its first divergence was chosen, not sampled.
async function forkAt(n, i, alt){
  if(!sitting || running || stopping || saving) return;
  closeAlts();
  sys('');
  const probs = n.meta.probs;
  const head = probs.slice(0, i).map(p => p.token).join('') + (alt.token || '');
  const params = JSON.parse(JSON.stringify((n.meta && n.meta.params) || sitting.params));
  // Nothing invented: the token at the fork really does have that probability in that
  // context — it is the number the original line reported for it — and the alternatives
  // beside it are the same set.
  const headProbs = probs.slice(0, i).concat([{
    id: alt.id, token: alt.token, logprob: alt.logprob,
    top_logprobs: probs[i].top_logprobs || [],
  }]);
  const fork = addNode('model', head, n.parent, {
    params: params, probs: headProbs,
    fork: {at_token: i, chosen: alt.token, from_node: n.id},
  });
  const mine = ++generation;
  const owner = sitting;
  sitting.current = fork.id;
  painted.add(fork.id);      // he forked to watch the tokens; keep watching them
  fanFrom = null;
  running = true;
  showDialogue();
  render();
  if(!await save()){
    running = false;
    gate();
    return;
  }
  try{
    const d = await postJSON('/api/complete', {prompt: promptFrom(fork.id), params: params});
    if(mine !== generation || sitting !== owner) return;
    if(d.error){
      if(d.error !== 'cancelled') sys(d.error, true);
      return;
    }
    fork.text += d.text;
    fork.meta.probs = headProbs.concat(d.probs || []);
    fork.meta.stop_type = d.stop_type;
    fork.meta.stopping_word = d.stopping_word;
    fork.meta.tokens_predicted = d.tokens_predicted;
    fork.meta.tps = d.tps;
    await save();
  }catch(e){
    if(mine === generation) sys('The loom is not answering: ' + e.message, true);
  }finally{
    if(mine === generation){
      running = false;
      render();
    }
  }
}

// A word you can click. `stop` is not optional inside a fan card: the whole card is the
// pick target, so an edit button that let the click through would edit and then pick.
function ghostBtn(label, fn, stop){
  const b = document.createElement('button');
  b.className = 'ghostbtn';
  b.type = 'button';
  b.textContent = label;
  b.addEventListener('click', e => { if(stop) e.stopPropagation(); fn(); });
  return b;
}

// Edit in place: the block becomes a textarea, saves on blur or cmd/ctrl+enter. A model
// line that comes back changed is POSED FOREVER — the tag is the only thing standing
// between "the model said this" and "we said this and forgot", which is the one confusion
// that would make a whole sitting worthless as evidence.
function editBlock(n, body, after){
  if(saving || stopping) return;
  const ta = document.createElement('textarea');
  ta.className = 'ed';
  ta.value = n.text;
  let done = false;
  const commit = async () => {
    if(done) return;
    done = true;
    if(ta.value !== n.text){
      n.text = ta.value;
      if(n.kind === 'model') n.posed = true;
      await save();
    }
    (after || render)();
  };
  ta.addEventListener('blur', commit);
  ta.addEventListener('keydown', e => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); ta.blur(); }
    if(e.key === 'Escape'){ done = true; (after || render)(); }
  });
  body.replaceWith(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

// The fork mark. This is the only affordance for getting back into a branch he turned away
// from, and without one a pruned-nothing tree is still a tunnel. It sits on the block itself
// because that is what it is about: not "the tree has four nodes at depth 3" but "this line
// had forty alternatives". One tap opens that line's own fan on the choose screen, where the
// branches are read side by side.
//
// It used to be ‹ n/m › arrows, stepping one sibling at a time. They went because that is not
// how a fan of forty gets read: nobody walks a pile hunting for the good one, he opens the
// pile. The count stays, because "3/40" says both where he is standing and how wide the fan
// was — and the corner menu's "view alternatives" still opens the fan UNDER the current line,
// so both directions are one move and neither has to be inferred from where he stands.
// The glyph is ⌥, generative.ink's own mark for a branch point in the old loom artifacts.
function swipe(n){
  if(!n.parent) return null;
  const sibs = kids(n.parent);
  if(sibs.length < 2) return null;
  const at = sibs.findIndex(s => s.id === n.id);
  if(at < 0) return null;
  const box = document.createElement('div');
  box.className = 'swipe';
  const b = document.createElement('button');
  b.className = 'fork';
  b.type = 'button';
  b.textContent = '⌥ ' + (at + 1) + '/' + sibs.length;
  b.title = 'view this line\'s ' + sibs.length + ' branches';
  b.setAttribute('aria-label', b.title);
  // The fan of THIS line is the fan under its parent — the same screen the menu opens, so a
  // sibling of an ancestor picked there truncates the document exactly as it always has.
  b.addEventListener('click', () => showChoices(n.parent));
  box.appendChild(b);
  return box;
}

// A human node is one flat string — prefix + his line + suffix — and the band must wrap
// only his line: the `seat:` header after it is the model's turn marker, and the newline
// before it is the seam between two speakers. So the text goes in as three pieces that
// concatenate back to exactly n.text: bare newline, the band, bare suffix. Nothing added,
// nothing hidden — if the suffix doesn't match (an old node from before a rename), the
// whole thing goes in plain. Text nodes only, never innerHTML: this string can be his,
// but its neighbours came out of a model.
function fillBody(body, n){
  body.textContent = '';
  if(n.kind === 'model' && painted.has(n.id) && hasProbs(n)){
    paintBody(body, n);
    return;
  }
  const suf = (sitting.turn && sitting.turn.suffix) || '';
  // No suffix (a bare sitting) still gets the band: whose words are whose is the one piece
  // of structure a bare document keeps, and it lives in the page, never in the text.
  if(n.kind === 'human' && (!suf || (n.text.endsWith(suf) && n.text.length > suf.length))){
    const head = suf ? n.text.slice(0, -suf.length) : n.text;
    const lead = head.match(/^\n*/)[0];
    const rest = head.slice(lead.length);
    // A bare room carries its own newlines inside the text (berserk's beats end on one):
    // left in the band they draw an empty second row inside the rounded rect, so they go
    // back into the document where they belong. With a turn suffix the newline is already
    // the suffix's job and `rest` has none to give.
    const trail = suf ? '' : rest.match(/\n*$/)[0];
    const core = trail ? rest.slice(0, -trail.length) : rest;
    if(core){
      body.appendChild(document.createTextNode(lead));
      const band = document.createElement('span');
      band.className = 'core';
      band.textContent = core;
      body.appendChild(band);
      body.appendChild(document.createTextNode(trail + suf));
      return;
    }
  }
  body.textContent = n.text;
}

function renderDoc(){
  // Every token span about to be thrown away takes its popup with it, or the alternatives
  // end up floating over a line that has been rebuilt underneath them.
  closeAlts();
  blocksEl.textContent = '';
  for(const n of path()){
    const el = document.createElement('div');
    if(n.kind === 'root' && !n.text) continue;
    el.className = 'blk ' + n.kind;
    const body = document.createElement('div');
    body.className = 'body';
    fillBody(body, n);
    const gut = document.createElement('div');
    gut.className = 'gut';
    gut.appendChild(ghostBtn('Edit', () => editBlock(n, body)));
    gut.appendChild(ghostBtn('Spin off', () => spinOff(n)));
    el.appendChild(gut);
    el.appendChild(body);
    const foot = footLine(n, true);
    if(foot) el.appendChild(foot);
    const sw = swipe(n);
    if(sw) el.appendChild(sw);
    blocksEl.appendChild(el);
  }
  blocksEl.scrollTop = blocksEl.scrollHeight;
}

// The last couple of sentences of a document. A sentence ends at . ! ? … (with any closing
// quote or bracket) before a space, or at a line break. The text a fan is drawn from usually
// stops mid-sentence, and that fragment counts as one — it is the part the cards finish.
// A tail under ~80 characters takes one more sentence, or "Yes." would be the whole header.
function seedTail(text){
  const t = (text || '').replace(/\s+$/, '');
  const cuts = [0, ...[...t.matchAll(/[.!?…]["'”’)\]]*\s+|\n+/g)].map(m => m.index + m[0].length)]
    .filter(i => i < t.length);
  let k = Math.max(0, cuts.length - 2);
  while(k > 0 && t.length - cuts[k] < 80) k--;
  // A blank line between the two sentences is a paragraph break the header can show as a
  // line break: the cards under it are where every byte of whitespace is read.
  const s = t.slice(cuts[k]).replace(/\n\s*\n/g, '\n');
  return s.length > 400 ? tail(s, 400) : (cuts[k] ? '…' : '') + s;
}

function renderFan(){
  const scroll = cardsEl.scrollTop;
  const focused = document.activeElement && document.activeElement.dataset.node;
  cardsEl.textContent = '';
