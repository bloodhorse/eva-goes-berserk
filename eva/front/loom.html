<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme:dark)" content="#232323">
<meta name="theme-color" media="(prefers-color-scheme:light)" content="#faf4ed">
<!-- Added to the iPhone's home screen, eva opens as its own app: no address bar, no
     toolbar sliding in and out under your thumb as the dialogue scrolls. That is what
     these seven lines buy, and iOS reads them ONCE — when the icon is added — so an icon
     added before they existed stays a plain bookmark until it is deleted and re-added.
     `black-translucent` means the page draws under the status bar and the home indicator;
     every fixed edge below pays for that with env(safe-area-inset-*), which is 0 in a
     desktop browser, so nothing on the desk moves. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="eva">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>loom</title>
<!-- The dialogue is the home screen. A fan opens a separate reading screen when its
     first answer arrives; choosing one returns to the dialogue. The tree and prompt
     remain verbatim, and the server still stores the whole sitting after every move. -->
<style>
  /* A neutral room: near-black ground, one step lighter for anything that is a panel,
     white ink, grey for everything secondary, and exactly ONE accent — spent on the send
     button and focus rings and nothing else. Nobody's words have a colour of their own:
     speakers are told apart by the band around bekh's line, not by ink, because a page
     that colours the model's words is already saying something about the model. */
  /* The room is ours, not a template's: the warm charcoal ground and blue-white ink the
     rest of the desk uses, a lilac accent instead of the indigo every chat app ships with,
     ice for the live dot, rose for posed. A hint — the layout is still a plain page. */
  :root{
    --bg:#232323; --ink:#d4e3fe; --ghost:#7d8a9c; --line:#2e3547;
    --panel:#2a2b31; --panel-soft:#272830; --sunk:#1e1e22;
    --accent:#f5c8fe; --on-accent:#232323;
    --live:#c6f1fe;
    /* posed and errors: a state you have to be able to spot without reading */
    --hot:#eb6f92;
    --ctl:28px;

    /* The canvas's own two tokens. The far-zoom brick for a branch that said something
       nobody else said: the line colour lifted just enough off the ground to read when a
       whole experiment is in view. */
    --bar-neutral:#3a4257;
    /* The heat ramp: how contaminated a cell is, as temperature. The steps are log-ish in
       cluster size (2 · 3–4 · 5–8 · 9–15 · 16–24 · 25+) and the walk is 216°→316° — slate,
       blue-violet, violet, magenta — saturation climbing, lightness held low, so a ×30 is a
       dusky magenta brick and never a candy one. Cold the whole way: nothing on the canvas
       is allowed to be warm. They end where the accent (a pale magenta) starts, which is why
       the ramp lands on magenta and not on red. */
    --heat-1:#485870;   /* ×2        hsl(216 22% 36%) */
    --heat-2:#4c5381;   /* ×3–4      hsl(232 26% 40%) */
    --heat-3:#5c4f92;   /* ×5–8      hsl(252 30% 44%) */
    --heat-4:#784d9d;   /* ×9–15     hsl(272 34% 46%) */
    --heat-5:#9c49a2;   /* ×16–24    hsl(296 38% 46%) */
    --heat-6:#ad4391;   /* ×25+      hsl(316 44% 47%) */
  }
  /* the dawn side of the same palette: paper ground, violet ink, the accents deepened so
     they still read on white */
  @media (prefers-color-scheme: light){
    :root{
      --bg:#faf4ed; --ink:#575279; --ghost:#8f8aa3; --line:#dfdad9;
      --panel:#f2ebe3; --panel-soft:#f6f0e9; --sunk:#fffaf3;
      --accent:#907aa9; --on-accent:#faf4ed;
      --live:#56949f;
      --hot:#b4637a;
      /* the same two walks on paper: the same hues, lifted to where a filled brick reads on
         a light ground instead of turning into a black hole in the middle of the picture */
      --bar-neutral:#c9c0bb;
      --heat-1:#8999b4; --heat-2:#7e86b4; --heat-3:#8174b4;
      --heat-4:#966fb8; --heat-5:#b568bb; --heat-6:#c05da6;
    }
  }
  /* And that light block is the whole of the light room: there are no RULE overrides
     anywhere below. Every colour on this page is a var() off the tokens above — including
     the two that used to need patching by hand (the dead connection dot and the error
     line, both now mixes of --hot) — so the room swaps for free. Keep it that way: the
     moment a literal colour or a blend mode is written into a rule, Dawn needs a second
     copy of it, and a media query adds no specificity so that copy has to live at the
     bottom of the file or it silently loses. */

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* overscroll-behavior:none is for the installed app: without it a downward drag that
     starts on the canvas (or on a pane already at its top) rubber-bands the whole page and,
     in a browser tab, reloads it — losing the room mid-fan. The page never scrolls as a
     whole anyway (height:100dvh, overflow:hidden below), so this costs nothing on the desk. */
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  /* iOS inflates text in landscape unless told not to; the page sizes its own type */
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{
    background:var(--bg); color:var(--ink);
    /* the system face: this is a page for reading a saved chat log, not a terminal */
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }

  [hidden]{display:none !important;}
  button, input, textarea, select{font:inherit;}
  button{cursor:pointer;}
  button:disabled{opacity:.4; cursor:default;}
  button:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:4px;}
  .spring{margin-left:auto;}
  .ghostbtn{background:none; border:0; padding:6px 0; color:var(--ghost); font-size:14px;}
  .ghostbtn:hover{color:var(--ink);}
  .ghostbtn.hot{color:var(--hot);}
  .btn, .iconbtn{background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:8px 14px;}
  .btn:hover, .iconbtn:hover{border-color:var(--ghost);}
  .iconbtn{width:42px; height:42px; padding:0; display:inline-grid; place-items:center; flex-shrink:0;}
  .iconbtn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round;}
  input, textarea, select{background:var(--sunk); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; outline:none; min-width:0;}
  input:focus, textarea:focus{border-color:var(--accent);}
  textarea{resize:none;}
  ::placeholder{color:var(--ghost);}
  label{font-size:14px; color:var(--ghost);}
  input[type=checkbox]{accent-color:var(--accent);}

  /* One corner control; the shelf and sampler only take space when requested.
     The insets ADD to the margin rather than being maxed against it: installed, the page
     owns the status bar, so `max(16px, 59px)` would put the button's top edge exactly on the
     clock. `calc(16px + inset)` keeps the same 16px of air below whatever the phone reserves,
     and on a desktop every inset is 0 and these are the numbers they always were. */
  #menubtn{position:fixed; top:calc(16px + env(safe-area-inset-top));
    right:calc(18px + env(safe-area-inset-right)); z-index:30; background:var(--bg);}
  /* The fan, one click from the dialogue instead of two through the menu. Only on the
     dialogue screen: the other screens have their own bars, and the canvas bar reserves
     room for the menu button alone, so a second corner button there would sit on its chips. */
  #fanjump{position:fixed; top:calc(16px + env(safe-area-inset-top));
    right:calc(68px + env(safe-area-inset-right)); z-index:30; background:var(--bg);}
  #tools{position:fixed; right:calc(18px + env(safe-area-inset-right));
    top:calc(68px + env(safe-area-inset-top)); z-index:30;
    width:min(340px, calc(100vw - 36px));
    max-height:calc(100dvh - 90px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow-y:auto;
    background:var(--panel-soft); border:1px solid var(--line); border-radius:14px; padding:20px;
    box-shadow:0 12px 40px color-mix(in srgb, var(--sunk) 35%, transparent);}
  .shelfrow{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
  #curation{margin-bottom:12px;}
  #curation:empty{display:none;}
  /* The open room, named once at the top of the menu. One line, cut with an ellipsis: the
     tree below marks the same room in the accent, so this is a heading and not the picker —
     a second full-width title fighting the tree for the eye is what it must not be. */
  #here{flex:1; min-width:0; color:var(--ghost); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis;}
  #here:empty::before{content:'no room open';}
  #treebtn{flex-shrink:0; white-space:nowrap;}
  /* The shelf is a tree because a room's NAME is its path: thirty rooms from one night are
     one folder row here until somebody opens it. Folders are drawn from those paths and
     from nothing else — there is no file on disk that says a folder exists, and there must
     not be, or the shelf and the menu would be able to disagree about what is on it.
     Indentation is padding on the row and never a nested box, so a deep room can wrap its
     label instead of pushing the menu sideways. */
  #shelftree{max-height:min(46vh, 300px); overflow-y:auto; scrollbar-width:thin;
    margin-bottom:12px; border-bottom:1px solid var(--line); padding-bottom:8px;}
  #shelftree .frow, #shelftree .rrow{display:flex; align-items:baseline; gap:10px;}
  #shelftree button{padding:3px 0; font-size:14px;}
  #shelftree .fold, #shelftree .roomlink{flex:1; text-align:left; min-width:0;
    overflow-wrap:anywhere;}
  #shelftree .movef{flex-shrink:0; opacity:0; font-size:13px;}
  #shelftree .frow:hover .movef, #shelftree .frow:focus-within .movef{opacity:1;}
  #shelftree .fold{color:var(--ink);}
  /* the one mark that says which room the dialogue behind this menu is showing */
  #shelftree .rrow.here .roomlink{color:var(--accent);}
  #movebox{display:none; flex-wrap:wrap; align-items:center; gap:12px;
    border-top:1px solid var(--line); margin-top:12px; padding-top:16px;}
  #movebox.on{display:flex;}
  #movewhat, #movefolders, #movepath{width:100%;}
  #movefolders{display:flex; flex-direction:column; max-height:30vh; overflow-y:auto;
    scrollbar-width:thin;}
  #movefolders .folderpick{text-align:left; padding:4px 0;}
  #newname{width:100%; margin-top:12px;}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--live);}
  .dot.off{background:var(--hot);}
  .toolrow{display:flex; gap:20px; flex-wrap:wrap;}
  #tools > .ghostbtn{display:block; width:100%; text-align:left;}
  #renamebox, #askbox{display:none; flex-wrap:wrap; align-items:center; gap:12px;
    border-top:1px solid var(--line); margin-top:12px; padding-top:16px;}
  #renamebox.on, #askbox.on{display:flex;}
  #renamename{width:100%;}
  #askq{width:100%;}
  #sampwrap{display:none; border-top:1px solid var(--line); margin-top:12px; padding-top:16px;}
  #sampwrap.on{display:block;}
  #sampler{display:flex; flex-direction:column; gap:14px;}
  #sampler .f{display:flex; flex-direction:column; gap:4px;}
  #sampler input, #sampler textarea{width:100%;}
  /* a switch reads as a row, not as a field with a box under it */
  #sampler .sw{flex-direction:row; align-items:center; gap:10px;}
  #sampler .sw input{width:auto;}
  #sampler .note{color:var(--ghost); font-size:14px;}

  /* Storage: a list of names in the menu, a + to add, and one plain note screen that
     reads like the dialogue — same measure, same size, the text exactly as pasted. */
  #storewrap{display:none; border-top:1px solid var(--line); margin-top:12px; padding-top:8px;}
  #storewrap.on{display:block;}
  .storehead{display:flex; align-items:center;}
  #noteadd{font-size:22px; line-height:1; padding:0 4px;}
  #notelist{display:flex; flex-direction:column;}
  #notelist .notelink{text-align:left; color:var(--ink); text-decoration:underline;
    text-decoration-color:var(--line); text-underline-offset:4px; overflow-wrap:anywhere;}
  #notelist .notelink:hover{text-decoration-color:var(--accent);}
  #notebar{display:flex; align-items:center; gap:16px; padding:0 56px 20px 64px; flex-shrink:0;}
  #notebar h1{font-size:16px; font-weight:500; margin:0; overflow-wrap:anywhere;}
  #notename{flex:1;}
  #noteback{background:transparent; border-color:transparent; margin-left:-10px;}
  #noteview{flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin; font-size:16px;
    line-height:1.65; padding:2px 56px 28px 64px;}
  #notetext{flex:1; min-height:0; margin:2px 56px 28px 64px; font-size:16px; line-height:1.65;}
  @media (max-width:900px){
    #notebar{padding:0 0 16px;} #noteview{padding:2px 0 20px;} #notetext{margin:2px 0 20px;}
  }
  @media (max-width:540px){
    #notebar{padding:0 0 14px; gap:10px;} #noteview{padding:2px 0 16px;} #notetext{margin:2px 0 16px;}
  }

  /* Artifacts: a list in the menu like storage's, and a screen that can only be read — the
     walk as a tree, top down. The prompt is the card at the top; under it one row per step,
     the line taken in a solid panel with the branches he kept beside it, dimmer. Nothing in
     it is a target except the prompt's fold, because an artifact that looked pickable would
     be lying about being frozen. */
  #artwrap{display:none; border-top:1px solid var(--line); margin-top:12px; padding-top:8px;}
  #artwrap.on{display:block;}
  #artlist{display:flex; flex-direction:column;}
  #artlist .artrow{display:flex; flex-direction:column; align-items:flex-start; text-align:left;
    color:var(--ink); padding:8px 0;}
  #artlist .artrow .t{text-decoration:underline; text-decoration-color:var(--line);
    text-underline-offset:4px; overflow-wrap:anywhere;}
  #artlist .artrow:hover .t{text-decoration-color:var(--accent);}
  #artlist .artrow .n{color:var(--ghost); font-size:13px;}
  /* Narrow margins on this screen on purpose: the tree is the widest thing the page draws and
     every pixel spent on a margin is a branch cut off at the edge. */
  #artbar{display:flex; align-items:center; gap:16px; padding:0 24px 20px 24px; flex-shrink:0;}
  #artbar h1{font-size:16px; font-weight:500; margin:0; overflow-wrap:anywhere; min-width:0;}
  #artback{background:transparent; border-color:transparent; margin-left:-10px;}
  #artagain, #artgo{flex-shrink:0; white-space:nowrap;}
  #artview{flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin;
    display:flex; flex-direction:column; gap:20px; padding:2px 24px 28px 24px;}
  /* The tree pane is the ONE thing on this page allowed to scroll sideways. A step with six
     kept branches is wider than a phone, and the alternative — capping how many a step may
     show — would be the page hiding part of the walk. The inner box is what the rows centre
     in and what the svg covers, so it has to be as wide as the widest row, not as wide as
     the screen. */
  #arttree{position:relative; flex-shrink:0; overflow-x:auto; padding:2px 0 8px;}
  #arttree .inner{position:relative; width:max-content; min-width:100%; margin:0 auto;}
  #arttree svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  #arttree .lvl{display:flex; gap:18px; justify-content:center; align-items:flex-start;
    margin:0 0 46px;}
  #arttree .lvl:last-child{margin-bottom:6px;}
  /* the boxes sit over the curves, so a connector's ends disappear under them */
  #arttree .n{position:relative; z-index:1; width:400px; background:var(--panel-soft);
    border:1px solid var(--line); border-radius:11px; padding:9px 12px; font-size:13px;
    color:var(--ghost); overflow-wrap:anywhere;}
  #arttree .n.took{background:var(--panel); border-color:transparent; color:var(--ink);}
  /* The prompt is the document everything below it came out of, and the longest text on the
     screen — it gets most of the window, not a card the size of a branch. */
  #arttree .n.root{width:clamp(400px, 85vw, 1300px); max-width:100%;
    background:var(--sunk); color:var(--ink);}
  #arttree .cap{display:block; color:var(--ghost); font-size:11px; margin-top:6px;}
  #arttree .cap.posed{color:var(--hot);}
  /* A berserk walk on the same tree. The daemon leaves its record in two places — the room,
     which holds every branch of every fan, and the ledger, which holds what the reader said
     about them — and this screen is the SECOND rendering of that pair, the sheets page being
     the first. Same grammar as that page, so one record read in two places reads the same:
     nemo's words in the document style, and everything the MACHINE did — which attempt this
     was, that the fan was widened, which letter an answer resolved to — dim, small and
     monospace, never louder than the text.

     A card is capped in CHARACTERS and not pixels, because here a branch is shown WHOLE and
     there are five to fifteen of them abreast: 28ch keeps a row of five inside a laptop
     window with nothing cut, and a wider fan scrolls, which is the tree pane's standing
     rule. Measured at 1440 — at 34ch a fan of five already hung off both edges. */
  #arttree .n.fan{width:28ch;}
  #arttree .plumb{color:var(--ghost); font-size:11.5px; line-height:1.5;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  /* The lead above a fan and the attempts under it are ANCHORS, not captions: the accent
     runs branch taken → what was said about that fan → the lead the next fan was finishing →
     that fan's branches, so no connector ever crosses a block of text. Positioned for the
     same reason the boxes are — an absolutely placed svg paints over static text otherwise. */
  #arttree .head, #arttree .tries{position:relative; z-index:1;
    width:min(66ch, 100%); margin:0 auto 20px;}
  #arttree .lvl.fanrow{margin-bottom:20px;}
  #arttree .tries .say{margin:2px 0 10px;}
  #arttree .n .note{font-style:italic; margin:8px 0 0;}
  /* A beat: the line WE posed into the document before the fan was drawn. Rose, the same
     colour a posed line wears in the dialogue, because that is exactly what it is — the one
     text on this screen nemo did not write, sitting in the place the branches answer. */
  #arttree .head .beat{color:var(--hot); margin:2px 0 6px;}
  #arttree .n .letter{margin-bottom:5px;}
  #arttree summary{cursor:pointer; color:var(--ghost); font-size:11px; padding:4px 0 0;}
  #arttree details .body{padding-top:8px;}
  .artfoot{flex-shrink:0; color:var(--ghost); font-size:13px;}
  .artnums{flex-shrink:0; display:grid; grid-template-columns:max-content 1fr; gap:4px 16px;
    font-size:13px; color:var(--ghost); border-top:1px solid var(--line); padding-top:14px;}
  /* not lowercased: a model file is Q5_K_M and a turn string is text the model saw */
  .artnums .v{color:var(--ink); overflow-wrap:anywhere; min-width:0; text-transform:none;}
  /* the same two marks the canvas cards wear, glyph for glyph and hue for hue: ☆/★ keep in
     ice, ○/● good in the accent. A thumb-sized box on touch, kept out of the foot's height
     by the negative cross margin, so a fan of cards is the height it always was. */
  .foot .mark{font:15px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding:0;
    min-width:28px; height:28px; margin-block:-7px; display:inline-grid; place-items:center;}
  .foot .mark.keepm{margin-left:auto;}
  .foot .mark.keepm.on{color:var(--live);}
  .foot .mark.goodm.on{color:var(--accent);}
  @media (hover:none){
    .foot .mark{min-width:40px; height:40px; margin-block:-13px; font-size:18px;}
  }
  @media (max-width:900px){
    #artbar{padding:0 0 16px;} #artview{padding:2px 0 20px;} #artback{margin-left:0;}
  }
  @media (max-width:540px){
    #artbar{padding:0 0 14px; gap:10px;} #artview{padding:2px 0 16px; gap:16px;}
    /* the boxes keep their width: a step too wide for the phone scrolls inside the tree
       pane, which is the one place sideways scrolling is the honest answer */
    #arttree .lvl{gap:12px; margin-bottom:38px;}
  }

  /* Export: the walk as one document, on its own screen, which is where it is read now —
     a download is a file you have to go find. Monospace and pre-wrap because the punctuation
     IS the evidence: a proportional font and a collapsed run of spaces would quietly retouch
     what the model wrote, and `> > > [` is exactly the kind of thing that gets retouched. */
  #textbar{display:flex; align-items:center; gap:16px; padding:0 56px 20px 64px; flex-shrink:0;}
  #textbar h1{font-size:16px; font-weight:500; margin:0; overflow-wrap:anywhere; min-width:0;}
  #textback{background:transparent; border-color:transparent; margin-left:-10px;}
  #textview{flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin; margin:0;
    padding:2px 56px 28px 64px; color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13.5px;
    line-height:1.62; white-space:pre-wrap; overflow-wrap:anywhere;}
  @media (max-width:900px){
    #textbar{padding:0 0 16px;} #textview{padding:2px 0 20px;}
  }
  @media (max-width:540px){
    #textbar{padding:0 0 14px; gap:10px;} #textview{padding:2px 0 16px; font-size:13px;}
  }

  /* The former 55% dialogue pane, widened by about a third and centered. */
  :root{--reading: min(72vw, 1120px);}
  #panes{flex:1; display:flex; min-height:0; min-width:0;}
  /* The 64px of head room is what clears the fixed corner button; installed, the status bar
     sits above that, so the inset has to be added or the first line of every screen — the
     dialogue, a fan, a note, the tree, the export — reads under the clock. */
  #doc, #fanpane, #notepane, #artpane, #textpane{width:var(--reading); max-width:100%; margin:0 auto; min-height:0;
    display:flex; flex-direction:column;
    padding:calc(64px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
            calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));}
  /* The reading column is a rule for prose, and a tree is not prose: it is a picture that
     wants every pixel the window has, so the artifact screen alone opts out of --reading.
     It has to come AFTER the rule above: same specificity, and the last one wins — written
     before it, the pane stayed the width of a chat and every wide row was cut. */
  #artpane{width:100%; max-width:none;}
  #blocks{flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin;
    --gut:64px; --rim:56px; font-size:16px; line-height:1.65;}
  .blk{position:relative; padding:0 var(--rim) 0 var(--gut);}
  .body{white-space:pre-wrap; overflow-wrap:anywhere;}
  .blk.root{color:var(--ghost);}
  .blk.human .core{display:inline-block; max-width:100%; background:var(--panel);
    border-radius:12px; padding:10px 16px; margin:6px 0;}
  /* pointer-events with the opacity: a margin control is taller than a one-line block, so
     an invisible gutter hangs over the block below it and would eat that block's clicks. */
  .blk .gut{position:absolute; left:0; top:0; width:var(--gut); padding-right:12px;
    text-align:right; opacity:0; pointer-events:none; transition:opacity 120ms ease;}
  .blk:hover .gut, .blk:focus-within .gut{opacity:1; pointer-events:auto;}
  /* one word per row, right-aligned at the text's edge; a longer one overhangs into the
     page margin rather than wrapping into two ragged halves */
  .blk .gut .ghostbtn{display:block; width:100%; text-align:right; white-space:nowrap;
    font-size:13px; padding:3px 0;}
  .blk .swipe{position:absolute; right:0; top:0; display:flex; align-items:center; gap:4px;
    font-size:13px; color:var(--ghost); opacity:0; pointer-events:none;}
  .blk:hover .swipe, .blk:focus-within .swipe{opacity:1; pointer-events:auto;}
  .fork{background:none; border:0; padding:6px 2px; color:var(--ghost); font:inherit;
    white-space:nowrap; letter-spacing:.02em;}
  .fork:hover{color:var(--accent);}
  .foot{font-size:13px; color:var(--ghost); display:flex; gap:10px; flex-wrap:wrap;}
  .foot .ghostbtn{font-size:13px; padding:0;}
  .foot .ghostbtn.on{color:var(--accent);}
  .posed{color:var(--hot);}

  /* Tokens, painted by how improbable the model found the word it chose. A wash on the
     GROUND and never a colour on the ink: the page's oldest rule is that nobody's words
     have a colour of their own, and a model line whose letters changed hue would be the
     page saying something about the model. --hot is the same rose that marks posed, which
     is right — both mean "look here, this is not the ordinary case". */
  .tok{cursor:pointer; border-radius:2px;}
  .tok:hover{box-shadow:inset 0 -1px 0 var(--ghost);}
  #alts{position:fixed; z-index:50; width:min(280px, calc(100vw - 32px));
    max-height:min(52dvh, 360px); overflow-y:auto; scrollbar-width:thin;
    background:var(--panel-soft); border:1px solid var(--line); border-radius:12px;
    padding:8px; box-shadow:0 12px 40px color-mix(in srgb, var(--sunk) 35%, transparent);}
  #alts .head{color:var(--ghost); font-size:13px; padding:4px 10px 8px;}
  #alts .altrow{display:flex; align-items:baseline; gap:10px; width:100%; text-align:left;
    background:none; border:0; border-radius:8px; padding:8px 10px; color:var(--ink);}
  #alts .altrow:hover{background:var(--panel);}
  #alts .altrow .t{flex:1; overflow-wrap:anywhere; text-transform:none;}
  #alts .altrow .p{color:var(--ghost); font-size:13px; flex-shrink:0;}
  #alts .altrow.here{color:var(--ghost);}
  .ed{width:100%; min-height:5em; font-size:16px; line-height:1.65; background:transparent;}

  #turnwrap{flex-shrink:0; padding:24px 56px 0 64px;}
  #turnline{display:flex; align-items:flex-end; gap:10px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:10px 10px 10px 18px;}
  #turnline:focus-within{border-color:var(--accent);}
  #turnlab{flex-shrink:0; color:var(--ghost); font-size:16px; line-height:1.6; padding:8px 0;}
  #turn{flex:1; width:100%; min-height:42px; max-height:30dvh; background:transparent;
    border:0; border-radius:0; padding:8px 0; font-size:16px; line-height:1.6;}
  #send{background:var(--accent); color:var(--on-accent); border-color:var(--accent); border-radius:12px;}
  #send .stop-icon{display:none;}
  #send.busy .send-icon{display:none;}
  #send.busy .stop-icon{display:block;}
  #activity{color:var(--ghost); font-size:14px; padding:8px 2px 0;}
  #activity:empty{display:none;}

  /* Alternatives read top to bottom, with the same measure as the dialogue. */
  #fanbar{display:flex; align-items:center; gap:16px; padding:0 56px 20px 64px; flex-shrink:0;}
  #fanbar h1{font-size:16px; font-weight:500; margin:0;}
  #back{background:transparent; border-color:transparent; margin-left:-10px;}
  /* The end of the document the fan continues, so a card is read against the words it
     answers without flipping back to the dialogue. Outside #cards on purpose: it stays put
     while the answers scroll. Capped, because a pasted page with no full stops is one
     "sentence" and would push the cards off the screen — and capped from the TOP: the text sits
     at the bottom of the box (flex-end overflows the start edge) and a long sentence loses its
     beginning under a fade, never its end, which is the very words the cards continue. */
  #fanlead{flex-shrink:0; padding:0 56px 18px 64px; color:var(--ghost); font-size:15px;
    line-height:1.6; white-space:pre-wrap; max-height:9.6em; overflow:hidden;
    display:flex; flex-direction:column; justify-content:flex-end;}
  #fanlead.cut{-webkit-mask-image:linear-gradient(to bottom, transparent, #000 2.4em);
    mask-image:linear-gradient(to bottom, transparent, #000 2.4em);}
  #cards{flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin;
    display:flex; flex-direction:column; gap:20px; padding:2px 56px 28px 64px;}
  .card{flex-shrink:0; background:var(--panel); border:1px solid transparent; border-radius:14px;
    padding:20px 24px; cursor:pointer;}
  .card:hover{border-color:var(--accent);}
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:0;}
  .card .body{font-size:16px; line-height:1.65;}
  .card .foot{padding-top:8px;}
  .card.gen{cursor:default; color:var(--ghost); background:transparent; font-size:14px;}
  .card.gen:hover{border-color:transparent;}
  #notice{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:40;
    max-width:calc(100vw - 32px); background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:12px 18px; font-size:14px;}
  #notice:empty{display:none;}
  #notice.err{color:var(--hot);}
  .sys{color:var(--ghost); font-size:14px;}

  @media (max-width:900px){
    :root{--reading:100%;}
    #doc, #fanpane, #notepane, #artpane, #textpane{
      padding:calc(72px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
              calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));}
    /* No margins for controls once the screen narrows: at 36px the "edit" word and the
       ⌥ 3/40 fork mark were wider than their margin and sat on top of the text, and on a
       touch screen there is no hover to reveal them anyway. So every block becomes a
       small grid — its text, the posed tag, then one row with edit on the left and the
       fork mark on the right, in the flow, where nothing can overlap. */
    #blocks{--gut:0px; --rim:0px;}
    .blk{display:grid; grid-template-columns:1fr auto;
      grid-template-areas:"body body" "foot foot" "gut swipe"; padding:0 0 14px;}
    /* in the phone row the gutter's words sit side by side, not stacked */
    .blk .gut .ghostbtn{display:inline-block; width:auto; text-align:left;}
    .blk > .body, .blk > .ed{grid-area:body;}
    .blk > .foot{grid-area:foot;}
    .blk .gut{grid-area:gut; position:static; width:auto; padding:0; text-align:left; opacity:1;}
    .blk .swipe{grid-area:swipe; position:static; opacity:1;}
    #turnwrap{padding:20px 0 0;}
    #fanbar{padding:0 0 16px;}
    #fanlead{padding:0 0 14px;}
    #cards{padding:2px 0 20px;}
    /* the -10px that optically aligns the arrow on desktop pushed its focus ring past
       the 12px phone margin and clipped it at the screen edge */
    #back, #noteback, #textback{margin-left:0;}
    /* On a phone the bottom is the text box: a notice pinned there covered the box and
       the send button until the error cleared. Up top, under the menu button, it covers
       one line of reading at worst and never the controls. */
    #notice{top:calc(66px + env(safe-area-inset-top)); bottom:auto;
      left:calc(16px + env(safe-area-inset-left)); right:calc(16px + env(safe-area-inset-right));
      transform:none; max-width:none;}
  }
  @media (max-width:540px){
    #doc, #fanpane, #notepane, #artpane, #textpane{padding-left:12px; padding-right:12px;}
    #turnwrap{padding:16px 0 0;}
    /* the fan bar can carry more than one word beside the title; on a phone it wraps under the
       title rather than squeezing "choose an answer" onto two lines */
    #fanbar{padding:0 0 14px; gap:6px 10px; flex-wrap:wrap;}
    #fanlead{padding:0 0 12px; font-size:14px;}
    #cards{padding:2px 0 16px; gap:16px;}
    .card{padding:16px 18px;}
  }
  /* Touch screens, at any width (an iPad in landscape is wider than 900 and still can't
     hover): controls that only appear on hover must just be there, and tap targets get
     room for a thumb. Fields go to 16px because iOS Safari zooms the whole page into any
     field smaller than that on focus — the room picker, rename, note name and sampler
     fields were all 14px. */
  @media (hover:none){
    .blk .gut, .blk .swipe{opacity:1;}
    .blk .gut .ghostbtn{padding:10px 14px 10px 0;}
    .fork{padding:8px 12px; font-size:15px;}
    input, select, textarea{font-size:16px;}
    /* The tree is walked with a thumb: every row is a tap target, and a folder's move
       control has no hover to appear on. 40px is the smallest row a thumb hits reliably. */
    #shelftree button, #movefolders button{min-height:40px; padding:8px 0;}
    #shelftree .movef{opacity:1; padding-left:10px;}
  }
  /* A phone on its side: ~390px tall, and the portrait 72px top gap plus the composer
     left 214px to read in. Keep just enough top to clear the fixed menu button (58px). */
  @media (max-height:500px){
    #turnwrap{padding-top:10px;}
  }
  /* A phone's screen is all reading (2026-09-17: the choose screen spent a fifth of the
     iPhone on a row holding only the menu button and on padding over the home bar). So up
     to 900px the corner button stops owning a row: each screen's bar climbs into the
     button's row and keeps clear of it on the right (18px margin + 42px button + 8px air,
     minus the pane's own side padding), and every scroller runs to the bottom edge with the
     home bar's inset as its last padding, so text slides under it instead of stopping short.
     The dialogue has no bar: its text starts under the buttons and scrolls up behind them. */
  @media (max-width:900px){
    #doc, #fanpane, #notepane, #artpane, #textpane{
      padding-top:calc(16px + env(safe-area-inset-top)); padding-bottom:0;}
    #fanbar, #notebar, #artbar, #textbar{padding-right:calc(48px + env(safe-area-inset-right));
      padding-bottom:12px; min-height:42px;}
    #cards, #noteview, #artview, #textview{padding-bottom:calc(16px + env(safe-area-inset-bottom));}
    #notetext{margin-bottom:calc(16px + env(safe-area-inset-bottom));}
    #blocks{padding-top:50px;}
    #doc #turnwrap{padding-bottom:calc(10px + env(safe-area-inset-bottom));}
  }
  @media (max-width:540px){
    #fanbar, #notebar, #artbar, #textbar{padding-right:calc(56px + env(safe-area-inset-right));}
  }
  /* ---- the canvas -----------------------------------------------------------------------
     A whole experiment — one folder of rooms — as a picture you pan and zoom, the way a
     canvas app shows a board. Like the tree screen it opts out of the reading column and
     takes the window: thirty fans of thirty branches is not prose. Every class in here is
     prefixed `cn-` because the page already has a `.card`, a `.head` and a `.foot` of its
     own and a canvas card is none of them; `.body` is shared on purpose — it is the one
     class that exempts a string from the page's lowercase rule, and every word on a card
     is text a model wrote. Designed for the desk: the phone gets whatever falls out. */
  #canvaspane{flex:1; min-width:0; min-height:0; display:flex; flex-direction:column;}
  #canbar{
    flex-shrink:0; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    /* the right gutter is for the fixed menu button, which hangs over this bar; the top
       inset is the status bar the installed app draws under, and the button moved down by
       the same amount, so the two stay lined up */
    padding:calc(14px + env(safe-area-inset-top)) calc(68px + env(safe-area-inset-right))
            10px calc(12px + env(safe-area-inset-left));
    border-bottom:1px solid var(--line); font-size:13px;
  }
  #canbar .name{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:40vw;}
  #canbar .dim{color:var(--ghost); white-space:nowrap;}
  #canback{background:transparent; border-color:transparent; width:34px; height:34px;}
  /* scoped to the bar, like every other rule on this page: a bare `.chip` is the kind of
     generic class name two features end up fighting over */
  #canbar .chip{background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:4px 10px; white-space:nowrap; font-size:13px;}
  #canbar .chip:hover{border-color:var(--ghost);}
  #canbar .chip[aria-pressed="true"]{border-color:var(--live); color:var(--live);}
  #canzoom{color:var(--ghost); font-variant-numeric:tabular-nums; min-width:44px; text-align:right;}
  /* The only place the ramp is explained. It lives in the bar and not on the canvas because
     it is a key, not furniture: read once, then forgotten. */
  #canlegend{display:flex; align-items:flex-end; gap:6px; color:var(--ghost); font-size:10px;
    line-height:1;}
  #canlegend .step{display:flex; flex-direction:column; align-items:center; gap:4px;}
  #canlegend .sw{width:18px; height:9px; border-radius:2px;}
  #canlegend .sw.h1{background:var(--heat-1);} #canlegend .sw.h2{background:var(--heat-2);}
  #canlegend .sw.h3{background:var(--heat-3);} #canlegend .sw.h4{background:var(--heat-4);}
  #canlegend .sw.h5{background:var(--heat-5);} #canlegend .sw.h6{background:var(--heat-6);}
  /* which model wrote a card, by PATTERN and never by hue: the heat ramp already owns every
     cold hue on this page, and a fourth and fifth colour beside it would be read as more
     heat. Hidden until `reveal` is on — off by default and never remembered. */
  /* `reveal` is worn by the PANE and not by the world, because it has to reach both the cards
     inside the world and this legend up in the bar, and the two are siblings. */
  #canmodels{display:none; align-items:center; gap:10px; color:var(--ghost); font-size:11px;}
  #canvaspane.reveal #canmodels{display:flex;}
  #canmodels .m{display:flex; align-items:center; gap:5px; text-transform:none;}
  #canmodels .m i{display:block; width:20px; border-top:2px solid var(--ghost);}
  #canmodels .m.m1 i{border-top-style:dashed;} #canmodels .m.m2 i{border-top-style:dotted;}
  #canmodels .m.m3 i{border-top-style:double; border-top-width:3px;}
  #cankeptby{display:none;}
  #canvaspane.reveal #cankeptby{display:inline; color:var(--ghost);}
  /* the folder's score, one hue per mark — same two the cards wear, so the bar and the
     picture are read with the same eye */
  #cankept .k{color:var(--live);} #cankept .g{color:var(--accent);}
  #cankept .s{color:var(--ghost);}

  /* The surface is a thing you look at, not a thing you select out of — text gets copied in
     the room, not here — so nothing on it is selectable and the pointer stays an ordinary
     arrow whether it is resting or dragging. Only the real controls say "click me". */
  #canstage{
    flex:1; min-height:0; position:relative; overflow:hidden; touch-action:none;
    /* a pan is a drag here, never a scroll: without this a downward drag that the stage
       chose not to consume walks up to the viewport and rubber-bands (or reloads) the page */
    overscroll-behavior:none;
    cursor:default; user-select:none; -webkit-user-select:none;
    background:radial-gradient(circle at 1px 1px,
      color-mix(in srgb, var(--ink) 12%, var(--bg)) 1px, transparent 0) 0 0/48px 48px;
  }
  #canstage button{cursor:pointer;}
  #canworld{position:absolute; left:0; top:0; width:0; height:0;
    transform-origin:0 0; will-change:transform;}
  #canwires{position:absolute; left:0; top:0; overflow:visible; pointer-events:none;}
  /* non-scaling-stroke: a hairline that stays a hairline at 5% and at 200%, so the wires read
     as structure when the whole experiment is in view and never fatten up close. */
  #canwires path{fill:none; stroke:var(--accent); stroke-width:1.6; opacity:.32;
    vector-effect:non-scaling-stroke;}
  #canwires path.dim{stroke:var(--ghost); opacity:.3;}

  #cantitle{position:absolute; background:var(--panel-soft); border:1px solid var(--line);
    border-radius:18px; padding:26px 32px; text-align:center;}
  #cantitle h1{margin:0; font-size:56px; letter-spacing:.01em; font-weight:600;}
  #cantitle p{margin:14px 0 0; font-size:24px; color:var(--ghost);}

  /* a block: one room — its seed card, a stem, and the frames of its fans */
  .cn-block{position:absolute;}
  .cn-seed{margin:0 auto; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:18px 22px 16px;}
  .cn-seed h2{margin:0 0 10px; font-size:19px; font-weight:600; color:var(--live);
    cursor:pointer; display:inline-block;}
  .cn-seed h2:hover{color:var(--accent);}
  .cn-seed .body{font-size:14px; line-height:1.6; color:var(--ink);}
  .cn-foot{display:flex; align-items:center; gap:18px; margin-top:10px;}
  .cn-foot button{background:none; border:0; padding:2px 0; color:var(--ghost); font-size:12px;}
  .cn-foot button:hover{color:var(--ink);}
  /* `order` and the auto margin park it at the right end of the foot whatever else the foot
     holds (a berserk room adds `tree`); the size is a thumb's, since this is the one canvas
     control bekh uses from the phone. */
  .cn-foot .cn-go{order:9; margin-left:auto; width:44px; height:44px; padding:0; font-size:22px;
    line-height:1; color:var(--live); border:1px solid var(--line); border-radius:12px;
    background:var(--panel2, transparent); cursor:pointer;}
  .cn-foot .cn-go:hover{color:var(--accent); border-color:var(--accent);}
  .cn-stem{position:absolute; width:2px; background:var(--line);}
  /* max-content, not the block's width: a seed whose thirty branches collapsed to one brick
     must not sit in a 1600px empty box. js sets the column count to the cards it actually
     holds, and the frame is then exactly as wide as them. */
  .cn-frame{border:1px solid var(--line); border-radius:16px; padding:18px;
    display:grid; grid-template-columns:repeat(5, 300px); gap:18px; align-items:start;
    width:max-content; background:color-mix(in srgb, var(--sunk) 45%, transparent);}
  .cn-frame:empty{min-height:80px; min-width:300px;}
  /* The one line on the canvas nobody's model wrote: the beat posed into the document before
     a berserk fan. Rose, the same colour posed wears in the dialogue, because that is exactly
     what it is. */
  .cn-beat{background:var(--panel-soft); border:1px solid var(--line);
    border-left:4px solid var(--hot); border-radius:10px; padding:8px 14px; width:max-content;
    max-width:820px; color:var(--hot); font-size:14px;}

  /* A branch card. `.cn-card` is the grid cell and the positioning box; `.cn-face` is the one
     visible surface. A stack puts two more faces behind it, offset — that is the whole of the
     pile, and it is why the face exists as its own element: an offset sheet cannot be a
     negative-z-index pseudo of the card, it would paint over the card's own background. */
  .cn-card{position:relative;}
  .cn-face{position:relative; background:var(--panel-soft); border:1px solid var(--line);
    border-left:4px solid var(--line); border-radius:10px; padding:8px 11px 10px;}
  /* Uniform cards: how long a continuation happens to be is not information worth a page of
     ragged boxes, so every card is one size and every block is an even grid. The class goes
     on the world only AFTER the natural heights are measured — the measurement needs them. */
  #canworld.uniform .cn-card{height:var(--cn-card-h);}
  #canworld.uniform .cn-face{position:absolute; inset:0; overflow:hidden;}
  #canworld.uniform .cn-card.clips > .cn-face::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:28px; pointer-events:none;
    background:linear-gradient(to bottom, transparent, var(--panel-soft));}
  .cn-clip{position:absolute; right:9px; bottom:5px; z-index:1; pointer-events:none;
    font:10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--ghost);}
  .cn-card:not(.clips) .cn-clip{display:none;}
  /* open: the card grows downward OVER its neighbours. An absolute face with bottom:auto costs
     no layout, so nothing in the grid moves and the masonry stays put. */
  #canworld.uniform .cn-card.open{z-index:60;}
  #canworld.uniform .cn-card.open > .cn-face{bottom:auto; height:auto; overflow:visible;
    box-shadow:0 20px 44px color-mix(in srgb, var(--sunk) 60%, transparent);}
  #canworld.uniform .cn-card.open > .cn-face::after{display:none;}
  #canworld.uniform .cn-card.open .cn-clip{display:none;}
  .cn-head{display:flex; align-items:center; gap:7px; flex-wrap:wrap; row-gap:4px;
    margin-bottom:6px; font:11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color:var(--ghost);}
  /* Two marks, and the SHAPE is what tells them apart: ☆/★ keep — this one goes in an
     artifact — and ○/● good — i liked reading this and i would not keep it. `good` exists
     because keep was being spent on everything merely liked, which is how a mark that means
     everything comes to mean nothing. The hue is the second reading, and the one that has to
     survive the far zoom where the glyph is gone: kept ice, good accent, never shared.
     The box is 28 css px (40 on a touch screen) with a negative cross margin, so the hit
     area is a thumb's worth while the head stays the height it always was — a taller head
     would eat a line of the card's own body, and CARD_H is one number for the whole canvas. */
  .cn-head .cn-mark{background:none; border:0; border-radius:7px; color:var(--ghost);
    font:14px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding:0; cursor:pointer;
    min-width:28px; height:28px; margin-block:-7px; display:inline-grid; place-items:center;}
  .cn-head .cn-mark:hover{color:var(--ink);}
  .cn-head .cn-mark.spring{margin-left:auto;}
  .cn-head .cn-keep.on{color:var(--live);}
  .cn-head .cn-good.on{color:var(--accent);}
  @media (hover:none){
    .cn-head .cn-mark{min-width:40px; height:40px; margin-block:-13px; font-size:17px;}
  }
  .cn-card .body{font-size:13px; line-height:1.55;}
  .cn-card.furniture{opacity:.45;}
  /* The border says the same thing the glyph does, for a card read at a glance — and it says
     one thing, because a branch wears one mark: ice all round for a keep, accent for a good.
     No rule for the pair: the two can't be on one card. */
  .cn-card.good > .cn-face{border-color:var(--accent); border-left-color:var(--accent);}
  .cn-card.kept > .cn-face{border-color:var(--live); border-left-color:var(--live);}
  /* a branch somebody fanned under: the mark, and the arrow to its own frame below */
  .cn-sub{color:var(--live);}
  /* the model tag and its edge, both only under `reveal`. The tag is a file name, so it is
     one of the few strings on the page that must keep its capitals. */
  .cn-tag{display:none; text-transform:none; color:var(--ghost);}
  .cn-edge{display:none; position:absolute; left:0; right:0; top:0; height:0;
    border-top:2px solid var(--ghost); pointer-events:none;}
  .cn-edge.m1{border-top-style:dashed;} .cn-edge.m2{border-top-style:dotted;}
  .cn-edge.m3{border-top-style:double; border-top-width:3px;}
  #canvaspane.reveal .cn-tag{display:inline;}
  #canvaspane.reveal .cn-edge{display:block;}

  /* A stack: one card standing for a whole look-alike cluster. --cn-heat is set on the card
     in js, off the member count; every rule below just reads it. Up close the heat is an edge
     and nothing else — a filled card would eat its own text. */
  .cn-card.cn-stack > .cn-sheet{position:absolute; inset:0; background:var(--panel-soft);
    border:1px solid var(--line); border-left:4px solid var(--cn-heat); border-radius:10px;}
  .cn-card.cn-stack > .cn-sheet.s1{transform:translate(5px,5px);}
  .cn-card.cn-stack > .cn-sheet.s2{transform:translate(10px,10px);}
  .cn-card.cn-stack > .cn-face{border-left-color:var(--cn-heat);}
  /* a marked stack keeps both readings: the mark's hue all round, heat still on the left edge */
  .cn-card.cn-stack.good > .cn-face{border-color:var(--accent); border-left-color:var(--cn-heat);}
  .cn-card.cn-stack.kept > .cn-face{border-color:var(--live); border-left-color:var(--cn-heat);}
  .cn-card.cn-stack .cn-flip{background:none; border:1px solid var(--line); border-radius:6px;
    color:var(--ghost); font:inherit; padding:0 6px;}
  .cn-card.cn-stack .cn-flip:hover{border-color:var(--live); color:var(--live);}
  /* how many of the cluster's members wear each mark — the marks themselves apply to the
     member on top, so without this a stack could hide five keeps behind an unmarked face */
  /* always in the head, even with nothing to say: it is what carries the margin-left:auto
     that pushes the pair of buttons right, and a span that came and went would take the
     spring with it */
  .cn-card.cn-stack .cn-marks{margin-left:auto; font-size:10px; white-space:nowrap;}
  .cn-card.cn-stack .cn-marks .k{color:var(--live);}
  .cn-card.cn-stack .cn-marks .g{color:var(--accent); padding-left:5px;}
  .cn-card.cn-stack .cn-marks .g:empty{padding-left:0;}
  /* the shared head of a cluster, dimmed: every member says it, so it is furniture the eye
     should slide over on the way to the one thing this member said instead */
  .cn-card .cn-pre{opacity:.45;}
  .cn-card .cn-tail.empty{opacity:.45; font-style:italic;}

  /* Level of detail. The card keeps its laid-out box; only the ink goes away, so crossing the
     threshold never moves anything. */
  #canworld.far .cn-face{background:var(--bar-neutral); border-color:transparent;
    border-left-color:var(--bar-neutral);}
  /* zoomed out the brick IS its heat: contamination as temperature across the whole
     experiment, readable before a single word is */
  #canworld.far .cn-card.cn-stack > .cn-sheet{background:var(--cn-heat); border-color:transparent;
    border-left-color:var(--cn-heat);}
  #canworld.far .cn-card.cn-stack > .cn-face{background:var(--cn-heat);
    border-left-color:var(--cn-heat);}
  /* Zoomed out there is no glyph and no border to read: a brick is its fill, so each mark
     spends its own hue. Good is the fill at 45% — softer than a keep, which is what it
     means — and one card is only ever one of these two. */
  #canworld.far .cn-card.good > .cn-face{
    background:color-mix(in srgb, var(--accent) 45%, var(--bg));
    border-left-color:color-mix(in srgb, var(--accent) 45%, var(--bg));}
  #canworld.far .cn-card.kept > .cn-face{
    background:color-mix(in srgb, var(--live) 58%, var(--bg));
    border-left-color:color-mix(in srgb, var(--live) 58%, var(--bg));}
  /* a marked stack: heat fill, the mark's ring. The ring is an inset box-shadow and not a
     border, because a border would change the box and the layout would jump at the
     threshold — and 12 world px is what it takes for it to still be there at fit zoom. */
  #canworld.far .cn-card.cn-stack.good > .cn-face{background:var(--cn-heat);
    border-color:var(--accent); border-left-color:var(--accent);
    box-shadow:inset 0 0 0 12px var(--accent);}
  #canworld.far .cn-card.cn-stack.kept > .cn-face{background:var(--cn-heat);
    border-color:var(--live); border-left-color:var(--live);
    box-shadow:inset 0 0 0 12px var(--live);}
  #canworld.far .cn-face > *{visibility:hidden;}
  /* the clip fade is a pseudo, so visibility:hidden on children misses it: a panel-soft
     gradient painted over a heat brick would read as a smudge */
  #canworld.far .cn-face::after{display:none;}
  #canworld.far .cn-card.furniture{opacity:.28;}
  #canworld.far .cn-seed .body, #canworld.far .cn-seed .cn-foot,
  #canworld.far .cn-seed h2, #canworld.far .cn-beat{visibility:hidden;}
  #canworld.far .cn-frame{background:transparent;}
  /* the far-zoom seed name: absolutely positioned over a box that is already laid out, so
     making it big costs no layout — the block's height is the same on both sides of the
     threshold */
  .cn-farlabel{position:absolute; left:0; width:100%; text-align:center; pointer-events:none;
    font-size:64px; font-weight:600; color:var(--live); visibility:hidden;}
  #canworld.far .cn-farlabel{visibility:visible;}

  /* The filter, in three states: everything, then both marks, then keeps alone. A stack is
     not one branch: it earns its place if ANY member passes, and the face then flips to a
     member that does. */
  #canworld.marked .cn-card:not(.cn-stack):not(.kept):not(.good){display:none;}
  #canworld.marked .cn-card.cn-stack:not(.haskept):not(.hasgood){display:none;}
  #canworld.keptonly .cn-card:not(.cn-stack):not(.kept){display:none;}
  #canworld.keptonly .cn-card.cn-stack:not(.haskept){display:none;}

  @media (max-width:900px){
    /* same shape as the wide rule, and it has to restate the insets: this block overrides
       the whole shorthand, and dropping them here is how the bar ended up under the clock */
    #canbar{padding:calc(12px + env(safe-area-inset-top)) calc(60px + env(safe-area-inset-right))
                    8px env(safe-area-inset-left); gap:10px;}
    #canbar .name{max-width:60vw;}
    #canlegend, #canmodels{display:none;}
    #canvaspane.reveal #canmodels{display:none;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
  /* The page speaks lowercase — every label, button, hint, message and placeholder. Done here
     and not in the strings, so a new label can't forget. Buttons and selects need it said
     outright: browsers reset text-transform on form controls instead of inheriting it.
     The document is exempt, and so is anything typed: `.body` holds his lines and the model's
     words, and a capital there is part of the text the model continues — lowercasing it on
     screen would show a document the model never saw. `#textview` is the same document again,
     whole, on the export screen: it showed ST. CATHERINE as st. catherine until it was named
     here. */
  body, button, select{text-transform:lowercase;}
  .body, .body *, input, textarea, #textview{text-transform:none;}
  ::placeholder{text-transform:lowercase;}
  /* The mirror (eva/mirror/): the mac is off and the mini is serving yesterday's shelf
     read-only. Everything that writes goes away rather than greying out — a grey button
     reads as "wait", and nothing here is coming back until the mac is. The server refuses
     every POST but a mark anyway; this is only so the page doesn't offer what will be
     refused. The fork mark stays: opening a fan is reading. */
  #robar{flex-shrink:0; color:var(--ghost); font-size:14px; padding:16px 2px 0;
    padding-bottom:calc(8px + env(safe-area-inset-bottom));}
  body.ro #turnwrap, body.ro #fanbtn, body.ro #more, body.ro #stop, body.ro #samp,
  body.ro #sampwrap, body.ro .toolrow, body.ro #newname, body.ro #askbox, body.ro #noteadd,
  body.ro #noteedit, body.ro #artgo, body.ro #artagain,
  body.ro .blk .gut{display:none !important;}
  /* the marks stay: harvesting from the phone is what the mirror is for (see toggleMark) */
</style>
</head>

<script>
// ---- the shape of a sitting ----------------------------------------------------------
// The document a base model continues is not a chat: it is one text, and the tree is only
// a way of keeping several futures of that text at once. The prompt for any node is the
// concatenation of `text` along the path root→node, VERBATIM, with nothing inserted
// between blocks. Everything that looks like a turn structure — the newline, the name,
// the colon — lives inside the node texts themselves, because the model must never see a
// frame we imagined and it didn't.
// One trailing newline, not two: the turn prefix below opens with its own, and the pair
// makes exactly the one blank line a saved chat log puts between its header and the
// first message. Two here would make the model's very first document open on a gap no
// real log has.
const HEADER = 'a chat log between two friends, saved from a phone. no punctuation fixed, no capitals.\n';
// Straight off the research sheet, loop-killers on. llama's own defaults are wrong for
// this in two specific ways and both are fixed here: n_predict is -1 (infinite) out of
// the box, and dry_penalty_last_n is 64 tokens, which is useless against a loop that
// starts two thousand tokens into a transcript. It is set to the context size and NOT
// to -1: the sheet says -1 means "whole context", but llama-server 0.4.0 validates the
// field as 0..INT_MAX and answers 400 to a negative — every branch would fail before
// the model saw a token. Raise it with -c if the server ever runs a longer window.
// Measured against nemo on this box (docs/research-cyborgism-methods.md). The one number
// that matters is the sampler CHAIN ORDER: this build runs penalties, dry, top_n_sigma,
// top_k, typ_p, top_p, min_p, xtc, and TEMPERATURE LAST — so min_p truncates the model's
// untouched distribution and temperature only flattens what survived. That is why 2.5 is
// coherent here and why 1.0 is the setting where nemo copies its seed and loops. A new room
// starts hot and spread; a room already on the shelf keeps what it was written with.
const PARAMS = {
  n_predict: 220,
  stop: ['\nbekh:', '\nbekh :', '\n\nbekh'],
  temperature: 2.5, min_p: 0.08, top_k: 0, top_p: 1.0,
  top_n_sigma: -1,                    // -1 is off
  xtc_probability: 0, xtc_threshold: 0.1,
  repeat_penalty: 1.05, repeat_last_n: 512,
  dry_multiplier: 0.8, dry_base: 1.75, dry_allowed_length: 3, dry_penalty_last_n: 8192,
  ignore_eos: false,
  // How many of the top tokens llama reports for each token it wrote. 0 is off. These are
  // the model's own probabilities, NOT the post-sampling ones: `post_sampling_probs` would
  // report what the temperature left standing, which makes every branch of a spread fan
  // look equally likely. What we want painted is the model's confidence, so that a line
  // written at 1.5 visibly walks further off the road than one written at 0.5.
  n_probs: 5,
  logit_bias: [],   // [[id, bias], …] — ids, resolved from words by the drawer
  logit_bias_text: '',   // the words he typed; loom-side, never sent
  fan: 4,           // loom-side; the server strips these three before llama sees them
  spread: 1.0,
  dry_keep: 0.8,    // what the dry switch puts back when it is turned on again
};
// The floor and the formula, twinned from loom.py's spread_temps — the same numbers have
// to come out here and in eva, or the same room fans differently depending on which half
// of the tool you are sitting in.
const TEMP_FLOOR = 0.05;
function spreadTemps(temperature, spread, n){
  const t = Number(temperature);
  const s = Math.abs(Number(spread) || 0);
  n = Math.max(1, n | 0);
  if(!s || n < 2) return Array(n).fill(t);
  const step = (2 * s) / (n - 1);
  return Array.from({length: n},
    (_, i) => Math.round(Math.max(t - s + step * i, TEMP_FLOOR) * 10000) / 10000);
}
// llama EATS the stop string — it is cut out of `content` and handed back separately, so
// the document would lose the "\nbekh:" that ended the model's line. That is exactly why
// the prefix carries the newline AND the name: the human node puts back what the stop ate
// and the document stays one continuous text. Break this and every branch after the first
// runs the two speakers together on one line.
const TURN = {prefix: '\nbekh: ', suffix: '\nseat:'};
// A "bare" sitting is not a mode: it is the same four settings emptied — no header, no
// names, no stop strings — so the model sees nothing but the text and continues it. Derived
// from the settings rather than stored, so flipping the prefix in the sampler mid-sitting
// flips the behaviour with it and the file never carries a flag that can disagree.
const bare = () => !!sitting && !(sitting.turn.prefix || sitting.turn.suffix);
// Which numbers the sampler draws, in the order they matter. `stop`, the two turn strings
// and the fan get their own widgets below.
// In the order the sampler chain runs them, as far as the chain is exposed here, so the
// drawer reads top to bottom the way the tokens actually go through it. No min or max on
// any of them: temperature above 10 is a legitimate thing to try on this build.
const FIELDS = [
  ['n_predict', 1], ['temperature', 0.05], ['spread', 0.05],
  ['min_p', 0.01], ['top_k', 1], ['top_p', 0.05], ['top_n_sigma', 0.1],
  ['xtc_probability', 0.05], ['xtc_threshold', 0.01],
  ['repeat_penalty', 0.01], ['repeat_last_n', 64],
  ['dry_multiplier', 0.1], ['dry_base', 0.05], ['dry_allowed_length', 1],
  ['dry_penalty_last_n', 64], ['n_probs', 1],
];

const $ = id => document.getElementById(id);
const blocksEl = $('blocks'), cardsEl = $('cards');
const treeEl = $('shelftree'), sampEl = $('sampler'), turnEl = $('turn');

// A room's name is its path under the sittings folder. The rule is loom.py's `name_ok`,
// restated here so the page can refuse a path in words instead of posting it and reading a
// 400 back — the server is still the one that decides, as it is for every other name.
const SEG = /^[A-Za-z0-9_.-]{1,64}$/;
const pathOK = s => typeof s === 'string' && !!s && s.length <= 512 &&
  s.split('/').every(seg => !seg.startsWith('.') && SEG.test(seg));
const leafOf = s => (s || '').split('/').pop();

// ---- state ---------------------------------------------------------------------------
let sitting = null;      // the whole tree, and the only state that matters
let shelf = [];          // what /api/sittings last said
let picked = '';         // the room the tree has marked — always a full path
let moving = null;       // {path, folder} while the move sheet is open
let generation = 0;      // bumped by anything that makes a running fan stale
let running = false;
let stopping = false;
let choosing = false;
let fanFrom = null;
let cancelTask = null;
let saving = false;
let saveQueue = Promise.resolve();

// Wrapped, all three: Safari throws on localStorage outright in a private window, and a
// page that can't remember which sitting you were in must still be a page that works.
const KEY = 'loom.sitting';
function remembered(){ try{ return localStorage.getItem(KEY) || ''; }catch(e){ return ''; } }
function remember(n){ try{ localStorage.setItem(KEY, n); }catch(e){} }
// Which folders are open is this browser's business and not the shelf's: the same shelf
// read on the phone and on the desk wants different things unfolded, and a folder state
// stored on disk would be a second thing to move when a room moves.
const FKEY = 'loom.folders';
function foldersOpen(){
  try{
    const v = JSON.parse(localStorage.getItem(FKEY) || '[]');
    return new Set(Array.isArray(v) ? v.filter(s => typeof s === 'string') : []);
  }catch(e){ return new Set(); }
}
function rememberFolders(){ try{ localStorage.setItem(FKEY, JSON.stringify([...opened])); }catch(e){} }
let opened = foldersOpen();

const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)))
  .map(b => b.toString(16).padStart(2, '0')).join('');

async function getJSON(url){
  const r = await fetch(url, {cache: 'no-store'});
  return await r.json();
}
async function postJSON(url, body){
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'},
                             body: JSON.stringify(body)});
  return await r.json();
}

function sys(text, err){
  $('notice').textContent = text;
  $('notice').classList.toggle('err', !!err);
}
function menu(open){
  $('tools').hidden = !open;
  $('menubtn').setAttribute('aria-expanded', String(open));
  if(!open){
    $('renamebox').classList.remove('on');

}
function showDialogue(){

}

}
function alternativesFrom(){
  if(!sitting) return null;
  if(kids(sitting.current).some(n => n.kind === 'model')) return sitting.current;
  const n = node(sitting.current);
  return n.kind === 'model' ? n.parent : null;
}

// ---- storage -------------------------------------------------------------------------
// Findings, one plain text file each, nothing to do with the sitting that is open: none of
// this touches `sitting`, `generation` or the tree. `note` is what the note screen shows,
// or null while a new one is being written.
let note = null;

async function loadNotes(){
  const list = $('notelist');
  let d;
  try{ d = await getJSON('/api/notes'); }
  catch(e){ sys('storage is not answering: ' + e.message, true); return; }
  list.textContent = '';
  const rows = (d && d.notes) || [];
  if(!rows.length){
    const s = document.createElement('div');
    s.className = 'sys';
    s.textContent = 'Nothing stored yet.';
    list.appendChild(s);
  }
  for(const r of rows){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ghostbtn notelink';
    b.textContent = r.name;
    b.addEventListener('click', () => openNote(r.name));
    list.appendChild(b);
  }
}

function showNote(){
  choosing = false;
  menu(false);
  $('doc').hidden = true;
  $('fanjump').hidden = true;
  $('fanpane').hidden = true;
  $('notepane').hidden = false;
  $('artpane').hidden = true;
  $('textpane').hidden = true;
  $('canvaspane').hidden = true;
}

// Reading and writing are the same screen with the words swapped; the name field shows
// only for a new note, because an existing note's name is its file and edit keeps it.
function noteMode(editing){
  const fresh = editing && !note;
  $('noteview').hidden = editing;
  $('notetext').hidden = !editing;
  $('noteedit').hidden = editing;
  $('notesave').hidden = !editing;
  $('notecancel').hidden = !editing;
  $('notename').hidden = !fresh;
  $('notetitle').hidden = fresh;
}

async function openNote(name){
  let d;
  try{ d = await getJSON('/api/note?name=' + encodeURIComponent(name)); }
  catch(e){ sys('could not open the note: ' + e.message, true); return; }
  if(d.error){ sys(d.error, true); return; }
  note = {name: d.name, text: d.text};
  $('notetitle').textContent = note.name;
  $('noteview').textContent = note.text;       // textContent: pasted text is never markup
  noteMode(false);
  showNote();
}

function newNote(){
  note = null;
  $('notename').value = '';
  $('notetext').value = '';
  noteMode(true);
  showNote();
  $('notename').focus();
}

function editNote(){
  if(!note) return;
  $('notetext').value = note.text;
  noteMode(true);
  $('notetext').focus();
}

async function saveNote(){
  const text = $('notetext').value;
  const body = note ? {name: note.name, text: text, create: false}
                    : {name: $('notename').value.trim(), text: text, create: true};
  let d;
  try{ d = await postJSON('/api/note', body); }
  catch(e){ sys('not saved: ' + e.message, true); return; }
  // On a refusal (a taken name) the screen stays as it is, text and all, so nothing
  // pasted is lost to a wrong name.
  if(d.error){ sys(d.error, true); return; }
  sys('');
  await openNote(d.name);
  loadNotes();
}

function cancelNote(){
  if(note) noteMode(false);
  else showDialogue();
}

// ---- artifacts -----------------------------------------------------------------------
// A fan as its stars stand: the walk that reached it, with only the kept branches in it. A
// star IS the save — every toggle of keep asks the server to rebuild that fan's artifact
// from the room on disk, and the last star taken off puts it in artifacts/.trash. Opening
// one never changes it; Continue stands it up as a new room.
let artifact = null;     // the artifact on the tree screen, or null
let walk = null;         // a berserk room on the same screen: {name, sitting, rows, text}
let artQueue = Promise.resolve();

// Both marks on this screen too, written the way this screen writes everything: into the
// tree the page owns, then the whole sitting back to the server. `kept` is what an artifact
// is built out of; `good` is read by nobody and is there so keep can go back to meaning one
// thing — and a branch wears at most one, so setting either clears the other (markLocally
// holds that rule for both screens, the server holds it for the file).
function toggleMark(n, mark){
  if(!sitting || stopping) return;
  const want = !n[mark];
  const cleared = markLocally(n, mark, want);
  renderFan();
  if(readonly){
    // The mirror takes marks one at a time and nothing else: a whole-room save is refused
    // there, and the artifact is built on the mac when it replays the mark.
    postJSON('/api/mark', {room: sitting.name, node: n.id, mark, on: want}).then(d => {
      if(d && d.error) throw new Error(d.error);
      if(adoptMarks(n, d)) renderFan();
    }).catch(e => {
      unmarkLocally(n, mark, want, cleared);
      renderFan();
      sys('the mark did not land: ' + e.message, true);
    });
    return;
  }
  save();
  // A star is the save — and a circle that just knocked a star off is a star coming off, so
  // that fan's artifact has to be rebuilt (or trashed) on that path too.
  if(mark === 'kept' || cleared) syncArtifact(sitting.name, n.parent);
}

// In a line, behind the saves: the server reads the stars off the disk, so the room write
// that carries this star has to land first, and two quick stars must not race each other
// into two artifacts for one fan.
function syncArtifact(room, parent){
  artQueue = artQueue.then(async () => {
    await saveQueue;
    try{
      const d = await postJSON('/api/artifact', {room, parent, sync: true});
      if(d.error){ sys('the artifact did not follow the star: ' + d.error, true); return; }
      if($('artwrap').classList.contains('on')) loadArtifacts();
    }catch(e){
      sys('the artifact did not follow the star: ' + e.message, true);
    }
  });
  return artQueue;
}

function when(ts){
  const d = new Date((Number(ts) || 0) * 1000);
  return d.toLocaleDateString(undefined, {day: 'numeric', month: 'short', year: 'numeric'}) +
    ' ' + d.toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'});
}

// Split from the fetch so the screenshot rig can hand it rows it loaded synchronously.
function drawArtifacts(rows){
  const list = $('artlist');
  list.textContent = '';
  if(!rows.length){
    const s = document.createElement('div');
    s.className = 'sys';
    s.textContent = 'No artifacts yet — keep answers in a fan, then save.';
    list.appendChild(s);
  }
  for(const r of rows){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ghostbtn artrow';
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = r.title;
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = ((r.steps || 0) > 1 ? r.steps + ' steps · ' : '') +
      r.kept + ' of ' + r.fan + ' kept · ' + when(r.created);
    b.appendChild(t);
    b.appendChild(n);
    b.addEventListener('click', () => openArtifact(r.name));
    list.appendChild(b);
  }
}

async function loadArtifacts(){
  let d;
  try{ d = await getJSON('/api/artifacts'); }
  catch(e){ sys('artifacts are not answering: ' + e.message, true); return; }
  drawArtifacts((d && d.artifacts) || []);
}

// The tree screen, shared: an artifact and a berserk walk are two records of one kind of
// thing — a document walked fork by fork — so they get one pane, one set of measured
// connectors and one export. `walk` says which is on it; only where they really differ (fan
// again is an artifact's gesture, and the document lives at a different url) is it consulted.
function showTree(){
  choosing = false;
  menu(false);
  $('doc').hidden = true;
  $('fanjump').hidden = true;
  $('fanpane').hidden = true;
  $('notepane').hidden = true;
  $('artpane').hidden = false;
  $('textpane').hidden = true;
  $('canvaspane').hidden = true;
  $('artview').scrollTop = 0;
  requestAnimationFrame(() => { drawArtLinks(); centreTree(); });
}

// An artifact is a WALK: the document it started from, then one step per fork — the line he
// took, and the branches he kept beside it. One written before walks existed has no `steps`
// and is a single fan nobody had picked from yet; it is read here as a walk of one such
// step, so there is ONE renderer and not one file on the shelf has to be rewritten.
function stepsOf(a){
  if(Array.isArray(a.steps)) return a.steps;
  return [{at: (a.source || {}).node, lead: '', took: null, kept: a.kept || [],
           fan: a.fan || {size: 0, others: []}, bits: a.bits || 0}];
}

function mk(parent, tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  if(parent) parent.appendChild(e);
  return e;
}
const cut = (s, n) => (s || '').length > n ? s.slice(0, n - 1).trimEnd() + '…' : (s || '');
// The END of the prompt is what the model was standing on, so that is the part shown folded.
const tail = (s, n) => s.length > n ? '…' + s.slice(s.length - n + 1) : s;

// Connectors are MEASURED after layout and drawn as curves into an svg under the boxes.
// Nothing here may guess at geometry: a box wraps onto a second line at one width and not at
// another, and a line drawn on the assumption it didn't is a diagram that lies.
let artPairs = [], artSvg = null, artInner = null, artRO = null;
function drawArtLinks(){
  if(!artSvg || !artInner || !artInner.isConnected) return;
  artSvg.textContent = '';
  const R = artInner.getBoundingClientRect();
  for(const [from, to, took] of artPairs){
    const A = from.getBoundingClientRect(), B = to.getBoundingClientRect();
    const x1 = A.left + A.width / 2 - R.left, y1 = A.bottom - R.top;
    const x2 = B.left + B.width / 2 - R.left, y2 = B.top - R.top;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M${x1},${y1} C${x1},${y1 + 22} ${x2},${y2 - 22} ${x2},${y2}`);
    p.setAttribute('fill', 'none');
    // Palette tokens and never a literal colour — that is the whole of why the light room
    // costs nothing here.
    p.setAttribute('stroke', took ? 'var(--accent)' : 'var(--line)');
    p.setAttribute('stroke-width', took ? '1.6' : '1.2');
    if(!took) p.setAttribute('stroke-dasharray', '3 4');
    artSvg.appendChild(p);
  }
}

// A step too wide for the screen scrolls inside the tree pane, and the part of it worth
// opening on is the spine, which is what the middle of every row is. Only while it still
// stands where it was drawn, and never on a resize: nothing here may yank a pane he is
// reading sideways.
function centreTree(){
  const host = artInner && artInner.parentNode;
  // A pane with no width has not been laid out yet — measuring it would centre the tree on
  // a screen that doesn't exist, and the guard above would then refuse to fix it.
  if(!host || host.scrollLeft || !host.clientWidth) return;
  host.scrollLeft = Math.max(0, (host.scrollWidth - host.clientWidth) / 2);
}

// The document a tree stands on — an artifact's prompt, a walked room's seed. Folded, with
// its END showing: that is the part the model was standing on when the first fan was drawn.
function promptCard(text, label, empty){
  const box = mk(null, 'div', 'n root');
  text = text || '';
  const pre = mk(box, 'div', 'body', text ? tail(text, 260) : empty);
  const det = mk(box, 'details');
  mk(det, 'summary', '', label + ' · ' + text.length + ' characters');
  mk(det, 'div', 'body', text);
  // Opening the fold moves every row under it, and the connectors were measured against
  // where those rows used to be.
  det.addEventListener('toggle', () => { pre.hidden = det.open; drawArtLinks(); });
  return box;
}

function stepBox(k, took, size){
  const box = mk(null, 'div', 'n' + (took ? ' took' : ''));
  // A branch is a few lines, not a book: show it whole. The cut is only a guard against one
  // monster continuation making a row a mile tall — the file keeps the text either way.
  mk(box, 'div', 'body', cut(k.text, 700) || '(empty continuation)');
  const cap = took ? ['⌥ ' + k.at + ' of ' + size] : ['kept'];
  if(took && typeof k.temperature === 'number') cap.push('temp ' + num(k.temperature));
  if(k.posed) cap.push('posed');
  mk(box, 'span', 'cap' + (k.posed ? ' posed' : ''), cap.join(' · '));
  return box;
}

// The walk, drawn top down: the prompt, then one row per step. Every string from the file
// goes in as text — the prompt and the branches are model output and his own lines, and the
// file is in a public repo besides.
// The box the rows and the svg live in. One per drawing, and the globals point at the one
// that is on the screen — both trees are measured the same way afterwards.
function treeHost(){
  const host = mk(null, 'div');
  host.id = 'arttree';
  artInner = mk(host, 'div', 'inner');
  artSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  artInner.appendChild(artSvg);
  artPairs = [];
  return host;
}

function drawTree(a, steps){
  const host = treeHost();
  let prev = promptCard(a.prompt, 'the prompt',
                        '(empty — the model began the document itself)');
  mk(artInner, 'div', 'lvl').appendChild(prev);
  for(const st of steps){
    const row = mk(artInner, 'div', 'lvl');
    const size = (st.fan && st.fan.size) || 0;
    const kept = (st.kept || []).map(k => stepBox(k, false, size));
    const took = st.took ? stepBox(st.took, true, size) : null;
    // The line taken stands in the middle of its step and the kept ones flank it,
    // alternating outwards, so a step of six is still centred on the walk.
    for(const b of kept.filter((_, i) => i % 2 === 0).reverse()) row.appendChild(b);
    if(took) row.appendChild(took);
    for(const b of kept.filter((_, i) => i % 2 === 1)) row.appendChild(b);
    if(took) artPairs.push([prev, took, true]);
    for(const b of kept) artPairs.push([prev, b, false]);
    // A step with nothing taken is the fan he was still looking at when he saved: the next
    // step, if there were one, would still hang off the last line he actually took.
    if(took) prev = took;
  }
  return host;
}

// One line under the tree for everything that is a number about the whole walk. What it
// counts as kept is what the file NAMES — the lines taken and the branches kept beside them
// — out of everything the fans offered.
function artFoot(a, steps){
  const temps = [];
  let named = 0, size = 0;
  for(const st of steps){
    const fan = st.fan || {};
    size += fan.size || 0;
    named += (st.kept || []).length + (st.took ? 1 : 0);
    for(const k of (st.kept || []).concat(st.took ? [st.took] : [], fan.others || []))
      if(typeof k.temperature === 'number') temps.push(k.temperature);
  }
  const out = [steps.length + (steps.length === 1 ? ' step' : ' steps'),
               named + ' of ' + size + ' kept',
               (Math.round((a.bits || 0) * 10) / 10) + ' bits'];
  const m = a.model;
  if(m && m.file) out.push(m.file);
  if(temps.length){
    const lo = Math.min.apply(null, temps), hi = Math.max.apply(null, temps);
    out.push('temp ' + num(lo) + (hi > lo ? '–' + num(hi) : ''));
  }
  return out.join(' · ');
}

// Export is a SCREEN, not a download: the point of the walk is to be read, and a file in
// Downloads is a thing you have to go find, open in something, and trust not to render the
// brackets away. The file is still one button from here for when it should leave the mac.
//
// The text itself is the SERVER's — `/api/artifact/text`, built by loom.py from the file on
// disk. The page had its own copy of that concatenation for a day and that is exactly how
// two answers to "what does an artifact read like" start to drift; now there is one, it is
// tested, and it has a url that can be sent.
// Two records, two routes, the same rule: the concatenation lives on the server or it lives
// in two places that will disagree.
const textURL = () => walk
  ? '/api/berserk/text?name=' + encodeURIComponent(walk.name)
  : '/api/artifact/text?name=' + encodeURIComponent(artifact.name);
const shownTitle = () => walk
  ? (walk.sitting.title || walk.name)
  : (artifact ? (artifact.title || artifact.name) : '');

async function exportDocument(){
  if(!artifact && !walk) return;
  let text;
  try{
    const r = await fetch(textURL(), {cache: 'no-store'});
    text = await r.text();
    if(!r.ok) throw new Error(text.trim() || r.status);
  }catch(e){ sys('could not read the document: ' + e.message, true); return; }
  $('texttitle').textContent = shownTitle();
  $('textview').textContent = text;
  showText();
}

function showText(){
  choosing = false;
  menu(false);
  $('doc').hidden = true;
