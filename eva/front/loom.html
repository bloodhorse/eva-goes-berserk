  const lead = sitting && fanFrom ? seedTail(promptFrom(fanFrom)) : '';
  $('fanleadtext').textContent = lead;
  $('fanlead').hidden = !lead;
  $('fanlead').classList.toggle('cut', !!lead && $('fanleadtext').offsetHeight > $('fanlead').clientHeight);
  if(!sitting || !fanFrom) return;
  const list = kids(fanFrom).filter(n => n.kind === 'model');
  if(!list.length && !running){
    const d = document.createElement('div');
    d.className = 'sys';
    d.textContent = 'No answers yet.';
    cardsEl.appendChild(d);
  }
  for(const [i, n] of list.entries()){
    const el = document.createElement('div');
    el.className = 'card';
    el.tabIndex = 0;
    el.dataset.node = n.id;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', 'Choose answer ' + (i + 1));
    const body = document.createElement('div');
    body.className = 'body';
    body.id = 'answer-' + n.id;
    body.textContent = n.text || '(empty continuation)';
    el.setAttribute('aria-describedby', body.id);
    el.appendChild(body);
    let foot = footLine(n);
    const same = twins(n);
    if(same > 1){
      if(!foot){
        foot = document.createElement('div');
        foot.className = 'foot';
      }
      const s = document.createElement('span');
      s.textContent = '×' + same;
      s.title = 'the model wrote this ' + same + ' times in this fan';
      foot.appendChild(s);
    }
    // The two marks on the node, saved with the room: ★ keep says "this one goes in the
    // artifact", ● good only says he liked reading it. Neither is a pick — `stop` on the
    // button, or marking would also choose the card. Glyphs and not words, the same pair
    // the canvas wears, so one gesture reads the same on both screens.
    if(!foot){
      foot = document.createElement('div');
      foot.className = 'foot';
    }
    for(const mark of ['kept', 'good']){
      const on = !!n[mark];
      const b = ghostBtn(MARK_GLYPH[mark][on ? 1 : 0], () => toggleMark(n, mark), true);
      b.classList.add('mark', mark === 'kept' ? 'keepm' : 'goodm');
      b.classList.toggle('on', on);
      b.title = mark === 'kept' ? 'keep' : 'good';
      b.setAttribute('aria-label', b.title);
      b.setAttribute('aria-pressed', String(on));
      foot.appendChild(b);
    }
    el.appendChild(foot);
    el.addEventListener('click', () => {
      // Selecting a passage to copy it is not choosing the answer.
      if(window.getSelection().toString()) return;
      pickNode(n.id);
    });
    el.addEventListener('keydown', e => {
      // Only the card's own keys: return on the keep button bubbles up here, and without
      // this it would keep the answer and then pick it.
      if(e.target !== el) return;
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pickNode(n.id); }
    });
    cardsEl.appendChild(el);
    if(focused === n.id) el.focus({preventScroll:true});
  }
  if(running && !stopping) pending();
  cardsEl.scrollTop = scroll;
}

function gate(){
  const on = !!sitting;
  turnEl.disabled = !on || saving;
  $('send').disabled = !on || stopping || saving || (!running && !turnEl.value.length);
  $('send').classList.toggle('busy', running || stopping);
  $('send').setAttribute('aria-label', stopping ? 'Stopping' : running ? 'Stop generating' : 'Send');
  $('send').title = $('send').getAttribute('aria-label').toLowerCase();
  $('fanbtn').disabled = $('more').disabled = !on || running || stopping || saving;
  for(const id of ['newbtn', 'newbarebtn', 'clearbtn', 'delbtn', 'renameok', 'renameno',
                   'moveok', 'moveno']) $(id).disabled = stopping || saving;
  for(const b of treeEl.querySelectorAll('button')) b.disabled = stopping || saving;
  $('clearbtn').disabled ||= !on;
  $('delbtn').disabled ||= !on;
  $('renamebtn').disabled = !on || running || stopping || saving;
  $('movebtn').disabled = !on || running || stopping || saving;
  $('renamename').disabled = saving;
  $('movepath').disabled = saving;
  $('choicesbtn').disabled = $('fanjump').disabled = !on || !alternativesFrom();
  $('stop').hidden = !running && !stopping;
  $('more').hidden = running || stopping;
  $('stop').disabled = stopping;
  $('artagain').disabled = $('artgo').disabled = stopping || saving;
  turnEl.placeholder = !on ? 'Open the menu to start a sitting' : bare() ? 'Text to continue' : 'Your line';
  $('activity').textContent = stopping ? 'Stopping…' : running ? 'Writing alternatives…' : '';
}

function render(){
  gate();
  drawCuration();
  if(!sitting) return;
  turnLabel();
  renderDoc();
  if(choosing) renderFan();
}

// The ghost in front of the turn box is the real prefix, trimmed — so renaming the speaker
// in the sampler shows up where he is about to type, not only in the next saved node.
function turnLabel(){
  if(!sitting) return;
  $('turnlab').textContent = (sitting.turn.prefix || '').trim() || '…';
}

// ---- moves ---------------------------------------------------------------------------
async function pickNode(id){
  // On the mirror a pick would move `current` in a room nobody can save: reading only.
  if(!sitting || stopping || saving || readonly) return;
  const cancelled = stopAll();
  sitting.current = id;
  fanFrom = null;
  showDialogue();
  render();
  await save();
  await cancelled;
}

function pending(){
  const el = document.createElement('div');
  el.className = 'card gen';
  el.setAttribute('role', 'status');
  el.textContent = 'Writing another answer…';
  cardsEl.appendChild(el);
}

// Sequential requests share llama's prompt cache. Open the picker on the first answer,
// then append without scrolling away from the answer currently being read.
async function runFan(n, from = sitting && sitting.current){
  if(!sitting || !from || running || stopping || saving) return;
  sys('');
  const mine = ++generation;
  const owner = sitting;
  const params = JSON.parse(JSON.stringify(sitting.params));
  const prompt = promptFrom(from);
  fanFrom = from;
  running = true;
  menu(false);
  gate();
  if(choosing) renderFan();
  // One temperature per branch. With spread 0 they are all the sitting's temperature and
  // this is the fan it always was; with spread they step from t-spread to t+spread, and
  // each node keeps the temperature that actually made it.
  const temps = spreadTemps(params.temperature, params.spread, n);
  try{
    for(let i = 0; i < n; i++){
      if(mine !== generation || sitting !== owner) return;
      const branch = Object.assign({}, params, {temperature: temps[i]});
      const d = await postJSON('/api/complete', {prompt, params: branch});
      if(mine !== generation || sitting !== owner) return;
      if(d.error){
        if(d.error !== 'cancelled') sys(d.error, true);
        return;
      }
      const made = addNode('model', d.text, from, {
        stop_type: d.stop_type, stopping_word: d.stopping_word,
        tokens_predicted: d.tokens_predicted, tps: d.tps,
        probs: d.probs || null,
        params: JSON.parse(JSON.stringify(branch)),
      });
      // A fan that wrote the same thing twice is a fan of three. The copy is kept — it is
      // evidence about the model, and at temperature 0.2 it is the whole finding — but it
      // is pruned on arrival, so it takes no card, no slot in the ‹ n/m › walk, and no bit
      // of curation. The card that stands keeps the count as ×2.
      if(twins(made) > 1) made.pruned = true;
      showChoices(from);
      if(!await save()) return;
      if(mine !== generation || sitting !== owner) return;
      gate();
    }
  }catch(e){
    if(mine === generation) sys('The loom is not answering: ' + e.message, true);
  }finally{
    // An old cancelled loop must not unlock controls belonging to a later request.
    if(mine === generation){
      running = false;
      gate();
      if(choosing) renderFan();
    }
  }
}

async function sendLine(){
  if(!sitting || running || stopping || saving) return;
  const typed = bare() ? turnEl.value : turnEl.value.trim();
  if(!typed) return;
  sys('');
  saving = true;
  turnEl.value = '';
  grow();
  generation++;
  const n = addNode('human', sitting.turn.prefix + typed + sitting.turn.suffix, sitting.current);
  sitting.current = n.id;
  render();
  const saved = await save();
  saving = false;
  gate();
  if(saved) runFan(sitting.params.fan || 4);
}

function stopAll(){
  if(cancelTask) return cancelTask;
  generation++;
  if(!running) return Promise.resolve();
  stopping = true;
  gate();
  cancelTask = (async () => {
    try{ await postJSON('/api/cancel', {}); }
    catch(e){ sys('Could not confirm the stop: ' + e.message, true); }
    finally{
      running = false;
      stopping = false;
      cancelTask = null;
      gate();
      if(choosing) renderFan();
    }
  })();
  return cancelTask;
}

// ---- the sampler ---------------------------------------------------------------------
// Escaped both ways, because every string in here has newlines in it and a textarea that
// showed them as real line breaks could not tell one stop string from two.
function esc(s){ return String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\t/g, '\\t'); }
function unesc(s){
  let out = '';
  for(let i = 0; i < s.length; i++){
    if(s[i] !== '\\'){ out += s[i]; continue; }
    const c = s[++i];
    out += c === 'n' ? '\n' : c === 't' ? '\t' : c === undefined ? '\\' : c;
  }
  return out;
}

function field(label, value, onchange, opts){
  const wrap = document.createElement('div');
  wrap.className = 'f' + ((opts && opts.wide) ? ' wide' : '');
  const l = document.createElement('label');
  l.textContent = label;
  const inp = document.createElement(opts && opts.rows ? 'textarea' : 'input');
  if(opts && opts.rows) inp.rows = opts.rows;
  if(opts && opts.step !== undefined){ inp.type = 'number'; inp.step = opts.step; }
  inp.id = 'setting-' + label.replace(/[^a-z0-9]+/gi, '-');
  l.htmlFor = inp.id;
  inp.value = value;
  // `change` and not `input`: every keystroke would be a POST, and a half-typed 0.0 is
  // not a temperature anybody meant.
  inp.addEventListener('change', async () => {
    // A handler that returns a string is saying "this is what I understood you to mean" —
    // the box is rewritten with it, so a line that did not parse is visibly gone rather
    // than sitting there looking like a setting.
    const back = onchange(inp.value);
    if(typeof back === 'string') inp.value = back;
    await save();
  });
  wrap.appendChild(l); wrap.appendChild(inp);
  return wrap;
}

function toggle(label, on, onchange){
  const wrap = document.createElement('div');
  wrap.className = 'f sw';
  const inp = document.createElement('input');
  inp.type = 'checkbox';
  inp.checked = !!on;
  inp.id = 'setting-' + label.replace(/[^a-z0-9]+/gi, '-');
  const l = document.createElement('label');
  l.textContent = label;
  l.htmlFor = inp.id;
  inp.addEventListener('change', async () => { onchange(inp.checked); await save(); });
  wrap.appendChild(inp); wrap.appendChild(l);
  return wrap;
}

// logit_bias, as llama takes it: an array of [token, bias] pairs, where a token is either
// an id or a STRING — llama tokenizes the string and biases every token in it (verified in
// tools/server/server-schema.cpp on master; the OpenAI object form is accepted too, and we
// do not use it). `false` as the bias bans the token outright.
// The drawer's text is one pair per line, `word  bias`, because that is what a hand types.
// A quoted "token" keeps its spaces — and that matters more than it looks: to a tokenizer
// " the" and "the" are two different tokens, and the leading space is the common one.
function parseBias(text){
  const out = [];
  for(const raw of String(text).split('\n')){
    const line = raw.trim();
    const at = Math.max(line.lastIndexOf(' '), line.lastIndexOf('\t'));
    if(at < 1) continue;
    const head = line.slice(0, at).trim();
    const tail = line.slice(at + 1).trim();
    let bias;
    if(tail === 'false' || tail === 'never' || tail === 'ban') bias = false;
    else { bias = Number(tail); if(!isFinite(bias) || tail === '') continue; }
    // `literal` = leave this exactly as written. A quoted "…" is him naming one spelling,
    // an id is already an id; a bare word is a request to find the right spelling.
    if(/^-?\d+$/.test(head)){ out.push({tok: Number(head), bias, literal: true}); continue; }
    if(head.length > 1 && head[0] === '"' && head.endsWith('"')){
      try{ out.push({tok: JSON.parse(head), bias, literal: true}); }catch(e){}
      continue;
    }
    if(head) out.push({tok: head, bias, literal: false});
  }
  return out;
}
function formatBias(list){
  return (list || []).map(pair => {
    const tok = pair[0], bias = pair[1];
    const t = typeof tok === 'number' ? String(tok)
      : (/^-?\d+$/.test(tok) || /\s|"/.test(tok)) ? JSON.stringify(tok) : tok;
    return t + '  ' + (bias === false ? 'false' : bias);
  }).join('\n');
}

// A bare word goes in as all four spellings a tokenizer is likely to have for it: to a
// tokenizer "the" and " the" are two different tokens, and the one that actually appears
// mid-sentence is the one with the space. Biasing only what was typed is why llama's own
// string form looked like it did nothing.
function spellings(word){
  const cap = word[0].toUpperCase() + word.slice(1);
  return [...new Set([word, ' ' + word, cap, ' ' + cap])];
}
// -100 or lower is not a bias, it is a ban, and llama has a real one: `false` sets the
// logit to -inf. A number that large is a way of asking for it.
const asBan = b => (b === false || b <= -100) ? false : b;

async function resolveBias(text){
  const want = parseBias(text);
  const asks = [];
  for(const w of want){
    if(typeof w.tok === 'string') w.try = w.literal ? [w.tok] : spellings(w.tok);
    for(const s of (w.try || [])) asks.push(s);
  }
  let tokens = [];
  if(asks.length){
    const d = await postJSON('/api/tokenize', {contents: asks});
    if(d.error) return {pairs: null, says: d.error};
    tokens = d.tokens || [];
  }
  const at = new Map();
  asks.forEach((s, i) => at.set(s, tokens[i] || []));
  const pairs = [], got = [], lost = [];
  for(const w of want){
    if(typeof w.tok === 'number'){ pairs.push([w.tok, asBan(w.bias)]); got.push(String(w.tok)); continue; }
    // Never a bias on whitespace or punctuation: those ids are the joints of every line the
    // model writes, and pushing on them breaks the text rather than steering it.
    if(!/[\p{L}\p{N}]/u.test(w.tok)){ lost.push(w.tok + ' (not a word)'); continue; }
    const ids = [];
    for(const s of w.try){
      const t = at.get(s) || [];
      if(t.length === 1) ids.push(t[0]); else lost.push(s.trim() + ' (' + t.length + ' tokens)');
    }
    if(!ids.length) continue;
    for(const id of new Set(ids)) pairs.push([id, asBan(w.bias)]);
    got.push(w.tok + ' → ' + [...new Set(ids)].join(', '));
  }
  let says = got.length ? 'sending ' + got.join(' · ') : 'nothing to send';
  if(lost.length) says += ' · dropped ' + lost.join(', ');
  return {pairs, says};
}

// Built by hand and not with field(), because this one has to go to the server and come
// back before it knows what it is sending, and say so underneath.
function biasField(p){
  const wrap = document.createElement('div');
  wrap.className = 'f wide';
  const l = document.createElement('label');
  l.textContent = 'logit bias (word or id, then a number, or ban)';
  const ta = document.createElement('textarea');
  ta.rows = 3;
  ta.id = 'setting-logit-bias';
  l.htmlFor = ta.id;
  ta.value = p.logit_bias_text || formatBias(p.logit_bias);
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = p.logit_bias && p.logit_bias.length
    ? 'sending ' + formatBias(p.logit_bias).split('\n').join(' · ') : '';
  ta.addEventListener('change', async () => {
    note.textContent = 'resolving…';
    const r = await resolveBias(ta.value);
    if(!r.pairs){ note.textContent = r.says; return; }
    p.logit_bias = r.pairs;
    // The source text rides along, so the box still shows the words he typed and eva can
    // send the ids without a tokenizer of its own.
    p.logit_bias_text = ta.value;
    note.textContent = r.says;
    await save();
  });
  wrap.appendChild(l); wrap.appendChild(ta); wrap.appendChild(note);
  return wrap;
}

function buildSampler(){
  sampEl.textContent = '';
  if(!sitting) return;
  const p = sitting.params;
  // Every room on the shelf was written before spread, n_probs and logit_bias existed, and
  // a drawer built straight off the file would show `undefined` in those boxes and send it
  // to llama. Missing keys only — a value in the file is his, including a zero.
  for(const k in PARAMS) if(p[k] === undefined) p[k] = JSON.parse(JSON.stringify(PARAMS[k]));
  for(const [key, step] of FIELDS){
    // The dry switch sits on top of its own numbers: janus's finding is that a frequency
    // penalty is a band-aid over looping and that heat and context are the real cure, so
    // letting a loop THROUGH has to be one click, not a dive into the drawer to remember
    // what 0.8 was and type it back afterwards. dry_keep is where 0.8 waits.
    if(key === 'dry_multiplier'){
      sampEl.appendChild(toggle('dry', p.dry_multiplier > 0, on => {
        if(on){
          p.dry_multiplier = p.dry_keep || PARAMS.dry_multiplier;
        }else{
          if(p.dry_multiplier > 0) p.dry_keep = p.dry_multiplier;
          p.dry_multiplier = 0;
        }
        const box = $('setting-dry-multiplier');
        if(box) box.value = p.dry_multiplier;
      }));
    }
    sampEl.appendChild(field(key, p[key], v => { p[key] = Number(v); }, {step}));
  }
  // Let the model run past its own end-of-text instead of stopping there — on a base model
  // that is the difference between one document and a document that keeps going.
  sampEl.appendChild(toggle('ignore_eos', !!p.ignore_eos, on => { p.ignore_eos = on; }));
  sampEl.appendChild(field('fan', p.fan, v => { p.fan = Math.max(1, Math.min(12, Number(v) || 1)); },
                           {step: 1}));
  sampEl.appendChild(field('turn prefix', esc(sitting.turn.prefix),
                           v => { sitting.turn.prefix = unesc(v); turnLabel(); }));
  sampEl.appendChild(field('turn suffix', esc(sitting.turn.suffix),
                           v => { sitting.turn.suffix = unesc(v); }));
  sampEl.appendChild(field('stop (one per line)', p.stop.map(esc).join('\n'),
    v => { p.stop = v.split('\n').filter(s => s.length).map(unesc); },
    {rows: 4, wide: true}));
  sampEl.appendChild(biasField(p));
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = 'Changes apply to the next branch.';
  sampEl.appendChild(note);
}

// ---- the shelf -----------------------------------------------------------------------
// The label on a row: the title if the room has one, and otherwise its own last segment —
// the server fills `title` with the name when there is none, and the path is already
// spelled out by the folders the row sits under.
const shelfLabel = r => (r.title && r.title !== r.name) ? r.title : leafOf(r.name);

// The paths, folded into folders. Nothing on disk says a folder exists — it exists because
// a room is in it — so this is built from `shelf` and from nothing else, and a folder that
// loses its last room simply stops being drawn.
function shelfTree(rows){
  const root = {folders: new Map(), rooms: [], born: 0};
  for(const r of rows){
    const segs = r.name.split('/');
    let at = root;
    for(const seg of segs.slice(0, -1)){
      if(!at.folders.has(seg)) at.folders.set(seg, {folders: new Map(), rooms: [], born: 0});
      at = at.folders.get(seg);
      // A folder is as new as the newest room anywhere under it. `created`, not `updated`:
      // opening last week's room and saving it must not reshuffle the menu under the hand.
      at.born = Math.max(at.born, r.created || 0);
    }
    at.rooms.push(r);
  }
  return root;
}

// Every folder on the shelf, deepest path spelled whole — the choices the move sheet lists.
function folderPaths(){
  const out = new Set();
  for(const r of shelf){
    const segs = r.name.split('/');
    let at = '';
    for(const seg of segs.slice(0, -1)){ at = at ? at + '/' + seg : seg; out.add(at); }
  }
  return [...out].sort((a, b) => a.localeCompare(b));
}

function ancestors(name){
  const out = [];
  for(const seg of (name || '').split('/').slice(0, -1))
    out.push(out.length ? out[out.length - 1] + '/' + seg : seg);
  return out;
}

// Folders first, newest first — last night's experiment is the one being looked for, and an
// alphabetical list buries it under every older one. Rooms inside a folder stay alphabetical:
// a census numbers its seeds 01…28 and that order is the experiment's own. Depth is a left
// padding on a flat list rather than nested boxes: a closed folder is redrawn without its
// children, so there is nothing to hide.
function drawBranch(at, depth, prefix){
  const newest = (a, b) => (at.folders.get(b).born - at.folders.get(a).born) || a.localeCompare(b);
  for(const seg of [...at.folders.keys()].sort(newest)){
    const here = prefix ? prefix + '/' + seg : seg;
    const on = opened.has(here);
    const row = mk(treeEl, 'div', 'frow');
    row.style.paddingLeft = (depth * 14) + 'px';
    const fold = mk(row, 'button', 'ghostbtn fold', (on ? '▾ ' : '▸ ') + seg);
    fold.type = 'button';
    fold.setAttribute('aria-expanded', String(on));
    fold.addEventListener('click', () => {
      if(on) opened.delete(here); else opened.add(here);
      rememberFolders();
      drawShelf();
    });
    // The way into the canvas: a folder is the unit an experiment is read in, and this is the
    // row that already names one. It goes through the hash rather than straight to
    // openCanvas, so the address is right and the back button has somewhere to return to.
    const cv = mk(row, 'button', 'ghostbtn movef', 'canvas');
    cv.type = 'button';
    cv.title = 'this folder as one picture';
    cv.addEventListener('click', () => setHash('#canvas=' + encodeURIComponent(here)));
    const mv = mk(row, 'button', 'ghostbtn movef', 'move');
    mv.type = 'button';
    mv.title = 'move this folder';
    mv.addEventListener('click', () => openMove(here, true));
    if(on) drawBranch(at.folders.get(seg), depth + 1, here);
  }
  for(const r of at.rooms.slice().sort((a, b) => shelfLabel(a).localeCompare(shelfLabel(b)))){
    const row = mk(treeEl, 'div', 'rrow' + (r.name === picked ? ' here' : ''));
    row.style.paddingLeft = (depth * 14) + 'px';
    const b = mk(row, 'button', 'ghostbtn roomlink', shelfLabel(r));
    b.type = 'button';
    b.title = r.name;
    if(r.name === picked) b.setAttribute('aria-current', 'true');
    b.addEventListener('click', () => { if(!saving && !stopping) openSitting(r.name); });
  }
}

let unfoldedFor = null;   // the room whose folders drawShelf last opened
function drawShelf(){
  treeEl.textContent = '';
  // The folders on the way to the open room are opened for it, once, when that room becomes
  // the open one: a mark on the current room behind three folds is a mark nobody can see. Not
  // on every draw — that re-opened a folder the moment he folded it (2026-09-18, the phone).
  if(picked !== unfoldedFor){
    for(const f of ancestors(picked)) opened.add(f);
    unfoldedFor = picked;
  }
  drawBranch(shelfTree(shelf), 0, '');
  const row = shelf.find(s => s.name === picked);
  $('here').textContent = row ? shelfLabel(row) : (sitting ? (sitting.title || leafOf(sitting.name)) : '');
  $('here').title = picked || '';
  gateTree();
}

async function loadShelf(){
  const d = await getJSON('/api/sittings');
  shelf = d.sittings || [];
  drawShelf();
}

// A room's name is its path, so filing it somewhere else is a move on disk and a reload
// here — the open room is re-read from its new path rather than patched in memory, because
// the name inside the file is what the next save posts back.
function openMove(path, isFolder){
  if(!path) return;
  moving = {path: path, folder: !!isFolder};
  $('renamebox').classList.remove('on');
  $('askbox').classList.remove('on');
  $('movewhat').textContent = (isFolder ? 'move the folder ' : 'move ') + path + ' to:';
  const list = $('movefolders');
  list.textContent = '';
  // A folder can't be offered itself or anything inside it: that move is a folder eating
  // its own tail, and the server refuses it anyway.
  const inside = f => isFolder && (f === path || f.startsWith(path + '/'));
  for(const f of ['', ...folderPaths().filter(f => !inside(f))]){
    const b = mk(list, 'button', 'ghostbtn folderpick', f ? f + '/' : 'the top of the shelf');
    b.type = 'button';
    b.addEventListener('click', () => {
      $('movepath').value = (f ? f + '/' : '') + leafOf(path);
      $('movepath').focus();
    });
  }
  $('movepath').value = path;
  $('movebox').classList.add('on');
  $('movepath').focus();
  $('movepath').select();
}

async function doMove(){
  if(!moving || saving || stopping) return;
  const from = moving.path;
  const to = $('movepath').value.trim().replace(/^\/+|\/+$/g, '');
  if(!to || to === from){ $('movebox').classList.remove('on'); moving = null; return; }
  if(!pathOK(to)){
    sys('a path is letters, digits, _ . - and slashes, no part starting with a dot', true);
    return;
  }
  // The open room may be the thing moving, or may be inside the folder that is moving.
  const open = sitting ? sitting.name : '';
  const carried = open && (open === from || open.startsWith(from + '/'))
    ? to + open.slice(from.length) : '';
  await stopAll();
  await saveQueue;            // a queued write would rebuild the file where it used to be
  let d;
  try{ d = await postJSON('/api/move', {from: from, to: to}); }
  catch(e){ sys('move failed: ' + e.message, true); return; }
  if(d && d.error){ sys('move failed: ' + d.error, true); return; }
  // a folder that was open stays open where it landed
  if(opened.has(from)){ opened.delete(from); opened.add(to); rememberFolders(); }
  moving = null;
  $('movebox').classList.remove('on');
  await loadShelf();
  if(carried) await openSitting(carried);
  sys('moved to ' + to);
}

// `got`, when given, is that room's fetch already under way — the boot starts it beside the
// shelf's instead of after it.
async function openSitting(name, got){
  await stopAll();
  await saveQueue;
  const d = await (got || getJSON('/api/sitting?name=' + encodeURIComponent(name)));
  if(d.error){ sys(d.error, true); return; }
  generation++;
  sitting = d;
  fanFrom = null;
  turnEl.value = '';
  grow();
  showDialogue();
  menu(false);
  remember(name);
  picked = name;
  drawShelf();
  buildSampler();
  render();
}

// A random file ID is permanent; the optional title can change without moving a tree.
// `opts` is how a room gets made out of something other than nothing: rootText for a
// document handed to it (spin off), params to carry the sampler it was made at, `path`
// for where it goes — only Basic and Bare pass that, off the field under them, so a spin
// off or a fan again is never filed somewhere by a path left lying in a box.
async function newSitting(isBare = false, opts = {}){
  if(saving || stopping) return;
  saving = true;
  gate();
  try{
    await stopAll();
    await saveQueue;
    await loadShelf();
    // Blank = a random name at the top of the shelf. Ending in a slash = a random name in
    // that folder. Anything else is the room's whole path, and a taken one is refused here
    // rather than by the server, which would say the same thing in worse words.
    const want = (opts.path || '').trim().replace(/^\/+/, '');
    const folder = want.endsWith('/') ? want.replace(/\/+$/, '') : '';
    let name;
    if(want && !want.endsWith('/')){
      if(!pathOK(want)) throw new Error('a path is letters, digits, _ . - and slashes, '
                                        + 'no part starting with a dot');
      if(shelf.some(s => s.name === want)) throw new Error('“' + want + '” is taken');
      name = want;
    }else{
      if(folder && !pathOK(folder)) throw new Error('“' + folder + '” is not a folder name');
      do { name = (folder ? folder + '/' : '') + hex(6); } while(shelf.some(s => s.name === name));
    }
    const text = opts.rootText !== undefined && opts.rootText !== null ? opts.rootText
                                                                      : (isBare ? '' : HEADER);
    const root = {id: hex(4), parent: null, kind: 'root', text: text,
                  ts: Date.now() / 1000, pruned: false, posed: false, meta: null};
    const fresh = {
      name, created: Date.now() / 1000, updated: 0,
      params: JSON.parse(JSON.stringify(opts.params || PARAMS)),
      turn: JSON.parse(JSON.stringify(opts.turn || (isBare ? {prefix: '', suffix: ''} : TURN))),
      root: root.id, current: root.id, nodes: {[root.id]: root},
    };
    // A whole tree handed over (continue): its root is the node with no parent.
    if(opts.tree){
      fresh.nodes = opts.tree.nodes;
      fresh.root = Object.values(opts.tree.nodes).find(n => n.parent === null).id;
      fresh.current = opts.tree.current;
    }
    if(opts.title) fresh.title = opts.title;
    // A room handed its turn (fan again) is a rebuild of one that existed: its stop strings
    // are whatever that room ran with, even if its turn was empty, so they are left alone.
    if(isBare && !opts.turn) fresh.params.stop = [];
    const d = await postJSON('/api/sitting', fresh);
    if(d.error) throw new Error(d.error);
    fresh.updated = d.updated || 0;
    // Keep the previous room and draft until the new file has actually been written.
    sitting = fresh;
    fanFrom = null;
    turnEl.value = '';
    grow();
    remember(name);
    picked = name;
    shelf.unshift({name, title: fresh.title, updated: fresh.updated});
    $('newname').value = '';
    drawShelf();
    buildSampler();
    $('movebox').classList.remove('on');
    $('renamebox').classList.remove('on');
    $('askbox').classList.remove('on');
    sys('');
    menu(false);
    showDialogue();
  }catch(e){
    sys('Could not create the room: ' + e.message, true);
  }finally{
    saving = false;
    render();
    if($('tools').hidden) turnEl.focus();
  }
}

// Spin off: the document down to this line becomes the root of a new BARE room, and that
// room opens. Nothing is stripped — header, names, colons and all — because what goes in is
// exactly the string the model was reading when it wrote that line, and the point of the
// new room is to keep reading it. Bare, because a document that already carries two
// speakers' names does not want a turn structure wrapped round it a second time; the
// sampler comes along, so the continuation happens at the heat it was found at.
async function spinOff(n){
  if(!sitting || running || stopping || saving) return;
  const from = sitting.title || sitting.name;
  await newSitting(true, {
    rootText: promptFrom(n.id),
    title: ('spun off from ' + from).slice(0, 120),
    params: sitting.params,
  });
}

async function renameSitting(){
  if(!sitting || running || stopping || saving) return;
  const title = $('renamename').value.trim();
  if(!title || title.length > 120){
    sys('Use a name between 1 and 120 characters.', true);
    return;
  }
  saving = true;
  gate();
  const owner = sitting;
  const previous = owner.title;
  try{
    await saveQueue;
    owner.title = title;
    if(!await save()){
      if(previous === undefined) delete owner.title;
      else owner.title = previous;
      return;
    }
    const row = shelf.find(s => s.name === owner.name);
    if(row) row.title = title;
    drawShelf();
    $('renamebox').classList.remove('on');
    sys('');
    menu(false);
  }finally{
    saving = false;
    gate();
    if($('tools').hidden && !choosing) turnEl.focus();
  }
}

// Delete is for sittings made by mistake. The server moves the file to sittings/.trash,
// it never unlinks. `sitting` goes null BEFORE the request, so a fan still finishing a
// branch can't save() the tree back onto the shelf a second after it left.
async function deleteSitting(){
  if(!sitting) return;
  const name = sitting.name;
  await stopAll();
  await saveQueue;
  fanFrom = null;
  showDialogue();
  sitting = null;
  const d = await postJSON('/api/delete', {name: name});
  if(d && d.error){
    // failed = the file is still on the shelf: go back to it, and say so AFTER the
    // reopen, or the render wipes the red line before he ever sees it
    await openSitting(name);
    sys('delete failed: ' + d.error, true);
    return;
  }
  picked = '';
  await loadShelf();
  if(shelf.length){ await openSitting(shelf[0].name); return; }
  blocksEl.textContent = ''; cardsEl.textContent = ''; sampEl.textContent = '';
  render();
  menu(true);
}

// Clear = the same room, run again. Name, header line, turn strings and sampler stay; the
// tree goes back to its root alone. The server copies the whole run into sittings/.trash
// FIRST, and if that copy fails nothing is reset — a clear that loses the old run is a
// delete with a friendlier label. The root node itself is kept, not rebuilt, so a header
// he edited by hand survives the clear.
async function clearSitting(){
  if(!sitting) return;
  await stopAll();
  await saveQueue;
  fanFrom = null;
  showDialogue();
  const d = await postJSON('/api/clear', {name: sitting.name});
  if(d && d.error){ sys('clear failed, nothing was reset: ' + d.error, true); return; }
  const root = node(sitting.root);
  sitting.nodes = {[root.id]: root};
  sitting.current = root.id;
  await save();
  render();
  turnEl.focus();
}

// Desktop page, so one level of the enter net is enough — fim states the rule at three
// levels because iOS's return key is not reliably a keydown, and none of that applies to
// a browser with a real keyboard in front of it.
// On a phone the return key is the only way to type a line break, and in a bare room a
// line break is text. So on a touch screen return inserts a newline and the send button
// sends; with a real keyboard return sends and shift+return breaks the line.
const TOUCH = window.matchMedia('(hover: none) and (pointer: coarse)');
turnEl.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || e.shiftKey || e.isComposing || TOUCH.matches) return;
  e.preventDefault();
  sendLine();
});

  turnEl.style.height = 'auto';
  turnEl.style.height = Math.min(turnEl.scrollHeight, window.innerHeight * 0.3) + 'px';
}

// null until the first answer. Caddy on the mini sends the page to the mac while the mac
// answers and to the mirror while it doesn't, so this can flip under an open page: to
// read-only, the writing controls go; back to the mac, the page reloads, because what it holds
// is the mirror's copy and the mac's shelf may be newer.
let readonly = null;
async function health(){
  try{
    const d = await getJSON('/api/health');
    $('dot').classList.toggle('off', !d.ok);
    $('dot').setAttribute('aria-label', d.ok ? 'Model available' : 'Model unavailable');
    const ro = !!d.readonly;
    if(readonly === true && !ro){ location.reload(); return; }
    readonly = ro;
    document.body.classList.toggle('ro', ro);
    $('robar').hidden = !ro;
    if(ro){
      const t = d.synced ? new Date(d.synced * 1000) : null;
      $('robar').textContent = 'the mac is off: reading and marks only — marks reach the mac ' +
        'when it is back. the mini\'s copy' +
        (t ? ', synced ' + t.toLocaleString([], {day: 'numeric', month: 'short',
                                                  hour: '2-digit', minute: '2-digit'}) : '') + '.';
    }
  }catch(e){ $('dot').classList.add('off'); $('dot').setAttribute('aria-label', 'Model unavailable'); }
}

(async function start(){
  health();   // not awaited: read-only has to show before the slow room lands, not after
  try{
  // A #tree= or #room= link names the room too, so the dialogue behind whatever screen the
  // address asks for is that room rather than whatever was last open.
  const asked = hashBits();
  const want = (asked.kind === 'tree' || asked.kind === 'room') ? asked.value : remembered();
  // The room and the shelf in parallel: they are the two slow calls of a reload. The early
  // fetch is a guess at the exact path; when it misses (a room deleted or filed away since,
  // a bare name off a link) it is thrown away, and the shelf decides and fetches again.
  const early = want ? getJSON('/api/sitting?name=' + encodeURIComponent(want)).catch(e => ({error: e.message}))
                     : null;
  await loadShelf();
  const name = onShelf(want) || (shelf[0] && shelf[0].name);
  if(name){
    const d = early && await early;
    await openSitting(name, d && !d.error && d.name === name ? Promise.resolve(d) : null);
  }
  else { gate(); menu(true); }   // Create a room only when Basic or Bare is pressed.
  if(asked.kind === 'tree') await openWalk(asked.value);
  else if(asked.kind === 'canvas') await openCanvas(asked.value);
  health();
  setInterval(health, 5000);
  }catch(e){ gate(); sys('Could not open the sitting: ' + e.message, true); }
})();
</script>
