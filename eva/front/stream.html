<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme:dark)" content="#232323">
<meta name="theme-color" media="(prefers-color-scheme:light)" content="#faf4ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="stream">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>stream</title>
<!-- One continuous scroll, newest at the top, older as you go down. This is the phone screen
     the whole machine is for: bekh picks it up at a random moment and reads DOWN into the
     night, marking as he goes. It was a pager for a day (one passage, older/newer buttons)
     and that was wrong — a pager makes him ask for each passage, and the point is that the
     machine is already dreaming and he is looking in.

     Phone FIRST, unlike loom.html: the root CLAUDE.md's "the page is a desktop page" law is
     about the loom. This one is held in one hand.

     The look is a PLACEHOLDER — the loom's palette, a thin rule between passages, nothing
     else — and gets its own job later. Keep it cheap here.

     Three voices on one page: the sleeper dreaming (the passages), the sleeper remembering
     (the account at the top, and a finished dream where it ended), and the reader at the
     bedside (the note beside each passage).

     ?all=1 shows the passages the filter flagged. ?raw=1 shows the shelf's own text instead
     of the interpreter's copy — untrimmed and uncoloured, for checking. -->
<style>
  :root{
    --bg:#232323; --ink:#d4e3fe; --ghost:#7d8a9c; --line:#2e3547;
    --panel:#2a2b31; --sunk:#1e1e22;
    --accent:#f5c8fe; --live:#c6f1fe; --hot:#eb6f92;
    /* The two inks the interpreter's words are written in — gentle, but read as colour and
       not as decoration. Which one a phrase gets is chance, held steady per phrase. */
    --lit-a:#f29bea; --lit-b:#7fe3f5;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#faf4ed; --ink:#575279; --ghost:#8f8aa3; --line:#dfdad9;
      --panel:#f2ebe3; --sunk:#fffaf3;
      --accent:#907aa9; --live:#56949f; --hot:#b4637a;
      --lit-a:#a8329a; --lit-b:#1f7f8f;
    }
  }
  /* As in the loom: every colour below is a var() off those two blocks and nothing else, so
     the light room costs no second copy of any rule. */

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  [hidden]{display:none !important;}
  button{font:inherit; cursor:pointer; background:none; border:0; color:inherit;}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px;}

  /* The one line of chrome, pinned. It answers "is it dreaming" and gets out of the way. */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
            10px calc(16px + env(safe-area-inset-left));
    color:var(--ghost); font-size:13px; border-bottom:1px solid var(--line);
    background:var(--bg);
  }
  #dot{width:8px; height:8px; border-radius:50%; background:var(--ghost); flex:0 0 auto;}
  #dot.on{background:var(--live);}
  #state{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* The quiet hint. New passages are held back while he is scrolled down — text must never
     move under a reader's eyes — and this is the only thing that appears. */
  #fresh{margin-left:auto; color:var(--accent); font-size:13px; padding:4px 0;}
  main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  /* Where a sticky story comes to rest. A SMALL gap and not the header's height: the sticky
     runs inside `main`, whose scrollport already begins below the pinned header, so borrowing
     the header's height here rests the story a header lower than it should be (measured
     2026-09-21 — stuck at 82px instead of 53px). */
  :root{--head:12px;}
  #feed{
    /* A reading measure, centred. 34em at 17px is ~62 characters, comfortable on a phone
       and on a desk both. */
    max-width:34em; margin:0 auto;
    padding:0 calc(18px + env(safe-area-inset-right)) 0 calc(18px + env(safe-area-inset-left));
    font-size:17px; line-height:1.65;
  }
  .pass{padding:22px 0 6px;}

  /* The painting sits BEHIND the dream's words (bekh's picture, 2026-09-20) — not beside them,
     not under them, behind them, dimmed so it does not fight the text. The block is seed +
     dream + its foot; the reader's note and a finished account are siblings and stay clear of
     it.

     Two layers: a wash over the plate. The alphas are measured, not guessed — body ink
     #d4e3fe on a 0.92 wash of #232323 reads 9.9:1 over these plates and 7.6:1 over the
     brightest cell in one, against 12.1:1 on the bare page. The light room cannot do as well
     and does not pretend to: its own ink on its own ground is only 6.66:1, and a 0.93 wash
     holds 6.2:1, which is the page's ceiling and not a compromise made here. */
  .block{border-radius:12px;}
  /* **The dream decides the box and the picture fills it** (bekh, 2026-09-20): `cover`,
     centred, the ratio never touched — a short dream shows a cropped band of its painting and
     a long one a zoomed, side-cropped one. A plate must never make a passage taller or move a
     word, so there is no min-height and the 16/18px the wash needs for legibility is taken
     back by an equal negative margin: the block's margin box is exactly its unplated box, and
     the picture reaches 18px past the text into the gutter instead of pushing the text in.
     Same padding on every plated passage. */
  /* **The picture is the band of the WHOLE dream** (bekh, 2026-09-21: "pic should stay on the
     whole space pertaining to the dream — left to right — trickle, dream, summary"). So it is
     the ARTICLE's background at every width — the account's column, the dream and the note at
     three columns; dream and note at two; the dream and its note inset on a phone — and never
     the inner block's, or a wash would be laid twice over the middle.

     The box is still the dream's: the vertical padding is the passage's own, so a plate adds
     no height and moves no word, and the 18px the wash needs sideways is given straight back
     by a negative margin, which also lets the band bleed into the gutters. */
  .pass.plated{padding:22px 18px 6px; margin:0 -18px; border-radius:12px;
    background-repeat:no-repeat, no-repeat;
    background-size:cover, cover; background-position:center, center;
    transition:box-shadow .35s ease;}
  .pass.plated .seed{color:var(--seed-plated);}   /* the seed lifts a little off a picture */
  .pass.plated.peek{box-shadow:0 0 0 1px var(--line);}

  /* The second voice (eva/stream/interpreter.py): a few sentences about a stretch of two
     passages, hung off the newest of them. Quieter and smaller than the dream, with an accent
     rule down its side so it is never mistaken for the seed, which is also grey. */
  /* The third voice: the sleeper remembering. A panel, not a margin note — it is not about
     one passage, it is what the whole dream has been so far, and it has to be told apart at a
     glance from both the dream text and the reader's note. */
  .account{background:var(--panel); border-radius:10px; padding:14px 16px;
    font-size:16px; line-height:1.7; color:var(--ink); white-space:pre-wrap;
    overflow-wrap:anywhere;}
  .account .turn{display:block; margin-top:10px; font-size:12px; color:var(--ghost);}

  /* **A story belongs to a pack of dreams** (bekh, 2026-09-21). Four dreams share one story;
     the newest pack may not be full yet, and that is the only difference between a "current"
     and a "finished" one — the split was the model's idea and he dissolved it. So: consecutive
     passages with the same story id are one `.pack`, and the story stands beside them and
     rolls with them, leaving when the pack does.

     On a phone the same story is an inset at the head of its pack, in the account style. */
  .story{margin:22px 0 0;}
  .story .account{transition:opacity .4s ease;}
  .story.fading .account{opacity:0;}

  .reading{margin:0 0 18px; padding:2px 0 2px 14px; border-left:2px solid var(--line);
    color:var(--ghost); font-size:14.5px; line-height:1.55; white-space:pre-wrap;
    overflow-wrap:anywhere;}
  .reading .rwhen{display:block; margin-top:8px; font-size:12px; opacity:.75;}

  /* What the interpreter found valuable is simply WRITTEN IN COLOUR (bekh, 2026-09-19): no
     background, no underline, no box — the words themselves, in one of two gentle inks. An
     underline and a tint were tried first and both read as decoration laid over the text
     rather than as part of it. */
  /* Half way to the body ink, not the full colour (bekh, 2026-09-21): he wants the two marks as
     ghostly tints in the text, not as highlighter. Mixed toward --ink and not toward white so it
     holds in the light theme too, where "closer to the text" means darker. --lit-mix is the one
     number to turn: 100% is the full colour, 0% is no mark at all. */
  :root{--lit-mix:30%;}
  .lit-a{color:color-mix(in srgb, var(--lit-a) var(--lit-mix), var(--ink));}
  .lit-b{color:color-mix(in srgb, var(--lit-b) var(--lit-mix), var(--ink));}

  /* The peek: the wash lifts and the painting is itself for as long as it is held. Hover on a
     desk, press-and-hold on a phone. The gradient is two stops of one colour rather than a
     flat film, so the top of a block is a shade heavier where the seed sits. */
  :root{
    /* Eased on 2026-09-20 after the first look: at .955/.90 the contrast number was superb and
       the picture was GONE — bekh's word for the plate is dimmed, not erased. .74/.62 keeps the
       painting legible as a painting behind the words; measured contrast drops with it, and the
       peek is still there for seeing it properly. If text ever gets hard to read over a bright
       plate, raise these, don't add a text shadow. */
    --wash-a:rgba(35,35,35,.74); --wash-b:rgba(35,35,35,.62);
    --peek-a:rgba(35,35,35,.36); --peek-b:rgba(35,35,35,.24);
    --seed-plated:#9fb0c6;
  }
  @media (prefers-color-scheme: light){
    :root{
      --wash-a:rgba(250,244,237,.80); --wash-b:rgba(250,244,237,.70);
      --peek-a:rgba(250,244,237,.42); --peek-b:rgba(250,244,237,.30);
      --seed-plated:#6f6a8c;
    }
  }
  .pass.plated{background-image:linear-gradient(var(--wash-a), var(--wash-b)), var(--plate);}
  .pass.plated.peek{background-image:linear-gradient(var(--peek-a), var(--peek-b)), var(--plate);}
  /* **The names are a menu** (bekh, 2026-09-22): the page has very little separation between
     dreams and he does not read them all, so every dream is headed by its name and its psalm
     number — `12:3 · a monster of the sea in the flat`. The number is in the ghost tone and
     the name in the body ink at a small size: the name is what is chosen from, the number is
     how it is found again. No name and there is only the number; neither, and nothing is
     drawn and the block reads exactly as it did before any of this. */
  .title{margin:0 0 8px; font-size:14px; line-height:1.4; color:var(--ink);
    overflow-wrap:anywhere;}
  .title .verse{color:var(--ghost); font-variant-numeric:tabular-nums;}
  /* The story's name is a size bigger than a dream's (his words: the block header is a bit
     bigger) — it heads a pack of four, and a header that reads smaller than what it heads is
     the wrong way round. */
  .story .title{font-size:16px; margin-bottom:10px;}

  /* pre-wrap on both: a base model's document carries its own line breaks, `> > >` and stray
     indents, and reflowing them would be editing the evidence. */
  .seed, .body{white-space:pre-wrap; overflow-wrap:anywhere; margin:0;}
  /* The seed is quieter because it is not the dream — it is what the dream stood on. Colour
     alone, not size: the model's first word simply brightens. */
  .seed{color:var(--ghost);}
  .flag{margin:14px 0 0; color:var(--hot); font-size:13px;}
  .foot{display:flex; align-items:center; gap:2px; margin-top:10px; color:var(--ghost);}
  /* Small, as asked, but still a thumb: 34px of height with the padding. */
  .stroke{min-width:34px; height:34px; display:inline-grid; place-items:center; font-size:16px;
    color:var(--ghost);}
  .stroke:hover{color:var(--ink);}
  .stroke.keep.on{color:var(--live);}
  .stroke.good.on{color:var(--accent);}
  .when{margin-left:auto; font-size:12px;}
  .sep{border:0; border-top:1px solid var(--line); margin:0;}
  /* The way back. The feed runs forward now — oldest at the top, newest at the bottom, the
     viewer put at the honest bottom on load — so the past is not something you fall into by
     scrolling; it is asked for, once, at the top. */
  #earlier{display:block; width:100%; color:var(--ghost); font-size:13px; text-align:center;
    padding:22px 0 8px;}
  #earlier:hover{color:var(--ink);}
  /* The wash tuner (?tune=1). A tool for choosing four numbers by eye and reading them out —
     not part of the look. What it picks gets baked into the stylesheet above by hand, and this
     can then stay as a hidden tool. */
  #tuner{position:fixed; z-index:30; right:12px;
    bottom:calc(12px + env(safe-area-inset-bottom));
    width:210px; padding:10px 12px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--panel); color:var(--ghost); font-size:12px; line-height:1.45;
    touch-action:none; -webkit-user-select:none; user-select:none;}
  #tuner label{display:block; font-size:11px; margin:6px 0 0;}
  #tuner input[type=range]{width:100%; margin:2px 0 0; accent-color:var(--accent);}
  #tuner .nums{margin-top:8px; font-variant-numeric:tabular-nums; color:var(--ink);}
  #tuner .cost{color:var(--ghost);}
  #tuner button{margin-top:8px; font-size:11px; padding:3px 8px; color:var(--ghost);
    border:1px solid var(--line); border-radius:7px;}
  #tuner button:hover{color:var(--ink);}

  #notice{position:fixed; left:0; right:0; top:0; z-index:20; text-align:center;
    padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
    background:var(--panel); color:var(--hot); font-size:13px;}

  /* On a desk the reading moves out of the text and stands beside it, top-aligned with the
     head of its block. Same DOM either way — the passage is a grid and the reading is simply
     put in the second column — so the phone keeps it as an inset above the passage and nothing
     is rendered twice. */
  /* Three voices, three columns, on every desktop width (bekh's picture): the dreams down the
     centre, the sleeper's story so far on the LEFT, the reader's notes on the right.

     From 900px, fluid, and ONE desktop layout. There used to be a second one between 900 and
     1180px that put the story in a box ON TOP of the feed; bekh's window at his zoom is about
     1000px wide, so that box was all he ever saw, and zoomed out the story was gone altogether
     (2026-09-21: "it's gotta go on the left"). The story on top is the PHONE's answer and
     nothing else's. The left track is 105px — he asked for it 30% narrower than the 150 it
     had — with type small enough that it stays a trickle at 900.

     The FEED is the grid, because a plated dream's band has to cross all three tracks. The
     story is laid OVER the left track, out of the grid's flow: as a grid item it collided with
     a plated dream, whose band spans that track too — a grid never lets two auto-placed items
     share a cell — and the newest dream was pushed down to start BELOW the story instead of
     beside it. Absolutely placed it starts at the top beside the newest dream, runs its own
     length over whatever bands pass behind it, adds no height and scrolls with the page.

     Pixels and not `em` for the tracks: `main` is 14px and `#feed` is 17px, so one `em` means
     two widths and a track sized in one cannot hold a grid sized in the other. */
  @media (min-width: 900px){
    /* The DREAM is the centre of the page, exactly (bekh, 2026-09-21: centre it, a bit
       narrower, more comfortable to read): every passage is the same three tracks — a side
       track, a dream column capped at 600px, a side track of the same width — so the dream
       sits on the page's axis whatever the window is, and a plate, being the passage's own
       background, crosses all three without any help. The sides never go under 200px (a note
       needs that much), so in a small window it is the dream column that gives way. */
    #feed{display:block; max-width:1240px; margin:0 auto; padding-left:22px; padding-right:22px;
      position:relative; --side:max(200px, calc((100% - 44px - 56px - 600px) / 2));}
    .pass{display:grid; column-gap:28px; align-items:start;
      grid-template-columns:minmax(200px, 1fr) minmax(0, 600px) minmax(200px, 1fr);}
    .pass > *{grid-column:2;}
    .pass > .reading{grid-column:3; grid-row:1 / -1; align-self:start; margin:0; max-width:290px;}
    /* **The story rolls with its pack.** A pack is ONE grid cell with two things placed into
       it — the story and the passages — so they overlap: explicit `grid-area: 1 / 1` on both is
       what lets grid items share a cell. The story is `position: sticky` under the pinned
       header, so the browser keeps it near the top of the screen while the pack is on screen
       and takes it away with the pack. No scroll listener anywhere: the pack's own box is the
       track the sticky runs in, and that is the whole mechanic.

       It adds no height (it is in the same cell as the passages, `align-self:start`), and it
       sits above a plated band (`z-index`), which spans all three tracks. A pack shorter than
       its story grows to the story — rare and acceptable.

       `--side` is the side track's width, restated from the grid because a box that is not a
       grid item of `.pass` cannot ask that grid where a track ends. */
    .pack{display:grid; grid-template-columns:1fr;}
    .pack > *{grid-area:1 / 1;}
    .pack > .story{align-self:start; position:sticky; top:var(--head); z-index:2;
      width:130px; margin:0 0 0 calc((var(--side) - 130px) / 2);}
    .story .account{background:none; padding:0; font-size:13px; line-height:1.55;
      color:var(--ghost);}
    .story .account .turn{color:var(--ghost); opacity:.7;}
    /* Hover is the desk's peek; a phone has none and uses the hold below. */
    @media (hover: hover){ .pass.plated:hover{
      background-image:linear-gradient(var(--peek-a), var(--peek-b)), var(--plate); } }
  }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <span id="state">…</span>
  <button id="fresh" hidden>new</button>
</header>

<main id="scroll">
  <button id="earlier" hidden>earlier</button>
  <div id="feed"></div>
</main>

<div id="notice" hidden></div>

<div id="tuner" hidden>
  <label>wash <span id="t-wash"></span></label>
  <input id="s-wash" type="range" min="0" max="100" step="1">
  <label>fade <span id="t-fade"></span></label>
  <input id="s-fade" type="range" min="0" max="30" step="1">
  <label>peek <span id="t-peek"></span></label>
  <input id="s-peek" type="range" min="0" max="60" step="1">
  <div class="nums" id="t-nums"></div>
  <div class="cost" id="t-cost"></div>
  <button id="t-reset">reset</button>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const el = {dot: $('dot'), state: $('state'), fresh: $('fresh'), scroll: $('scroll'),
            feed: $('feed'), earlier: $('earlier'), notice: $('notice'),
            };

const Q = new URLSearchParams(location.search);
// Flagged passages, off by default: the flagged pile is for auditing the filter against his
// marks later, not for reading in bed.
const ALL = Q.get('all') === '1';
// The shelf's own text: the raw dream, untrimmed and uncoloured, for checking what the
// interpreter was handed. Everything else on this page is his copy of it.
const RAW = Q.get('raw') === '1';
const POLL_MS = 60000;

let rooms = new Set();     // every passage rendered, so a poll never doubles one
let oldest = '';           // the TOP of the feed now, for ?before=
let more = true;           // is there anything older than what is rendered
let busy = false;
let waiting = 0;           // dreams appended below him while he was reading further up
let status = null;

function api(q){
  return fetch('/api/stream?' + q + (ALL ? '&all=1' : ''), {cache: 'no-store'})
    .then(r => r.json());
}

function say(msg){
  el.notice.textContent = msg;
  el.notice.hidden = false;
  setTimeout(() => { el.notice.hidden = true; }, 3000);
}

// ---- the ragged end ---------------------------------------------------------------------
// A passage stops at 170 tokens, which lands mid-sentence nine times in ten. The RAW text is
// what the shelf keeps — it is the evidence of what nemo wrote — and this only trims the
// DISPLAY back to the last sentence end. Done here and not in the api for exactly that
// reason: ?raw=1 is the same request showing the untrimmed text.
const SENT_END = /[.!?…]["'”’»)\]]*/g;
const KEEP_AT_LEAST = 0.6;   // trimming away more than ~40% says there was no sentence to end

// Where to cut, not what to cut: the same point serves the raw text and the interpreter's
// segments, which are trimmed on the concatenation of everything he did not drop.
function trimAt(text){
  if (RAW) return text.length;
  let last = null, m;
  SENT_END.lastIndex = 0;
  while ((m = SENT_END.exec(text)) !== null) last = m;
  if (!last) return text.length;                // no sentence end at all: show it whole
  const cut = last.index + last[0].length;
  return cut < text.length * KEEP_AT_LEAST ? text.length : cut;
}

// ---- the clock ---------------------------------------------------------------------------
function ago(sec){
  if (sec < 90) return 'just now';
  if (sec < 5400) return Math.round(sec / 60) + ' min ago';
  if (sec < 172800) return Math.round(sec / 3600) + ' h ago';
  return Math.round(sec / 86400) + ' days ago';
}

const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

function hhmm(d){
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function when(ts){
  const d = new Date(ts * 1000), now = new Date();
  const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) -
                           new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  if (days <= 0) return hhmm(d);
  if (days === 1) return 'yesterday ' + hhmm(d);
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + hhmm(d);
}

// ---- the dream so far -------------------------------------------------------------------
// The sleeper's account is not a passage: it is rewritten whole every few minutes, so
// replacing the text under a reader's eyes is fine — but only when he is at the top looking at
// it. Further down it waits, because a block silently rewriting itself off-screen is one
// thing and a paragraph changing while it is being read is another.
// The name of a dream or of a story, with its number: `12:3 · a monster of the sea in the
// flat`, or the number alone when nothing named it. Null when there is neither, and then the
// caller appends nothing at all. textContent throughout, like everything else on this page.
function titleLine(name, number){
  if (!name && !number) return null;
  const h = document.createElement('p');
  h.className = 'title';
  if (number){
    const n = document.createElement('span');
    n.className = 'verse';
    n.textContent = name ? number + ' · ' : number;
    h.appendChild(n);
  }
  if (name) h.appendChild(document.createTextNode(name));
  return h;
}

function account(story){
  const box = document.createElement('div');
  box.className = 'account';
  // The `|` marks are the sleeper's seams — where each later scene comes in, so the front can
  // cut the telling into parts (dreamshit). They are a cut and not a glyph: hidden here, kept
  // on the shelf. This page shows the whole account, so it simply drops them.
  box.appendChild(document.createTextNode((story.text || '').replace(/\|/g, '')));
  // A count only while the pack is live and not yet full. A complete pack, or one the gap
  // ended, is simply a story — there is nothing left to count up to.
  if (story.live && (story.turn || 0) < (story.of || 0)){
    const t = document.createElement('span');
    t.className = 'turn';
    t.textContent = `${story.turn} / ${story.of}`;
    box.appendChild(t);
  }
  return box;
}

// ---- packs -----------------------------------------------------------------------------------
// A story belongs to a pack of dreams (bekh, 2026-09-21): consecutive passages sharing a story
// id are one <section class="pack">, the story is one element inside it, and the browser's own
// sticky keeps it near the top while the pack is on screen and takes it away with the pack.
// Passages from before the sleeper existed have no story and are not wrapped.

function newPack(story){
  const sec = document.createElement('section');
  sec.className = 'pack';
  sec.dataset.dream = story.dream;
  const box = document.createElement('div');
  box.className = 'story';
  sec.appendChild(box);
  const passes = document.createElement('div');
  passes.className = 'passes';
  sec.appendChild(passes);
  putStory(box, story);
  return sec;
}

function putStory(box, story){
  while (box.firstChild) box.removeChild(box.firstChild);
  box.dataset.text = story.text || '';
  box.dataset.title = story.title || '';
  // The story's own name above its account, a size bigger than a dream's, with the chapter —
  // `12` for the twelfth story, the number its scenes carry as `12:1…12:4`.
  const head = titleLine(story.title, story.chapter ? String(story.chapter) : '');
  if (head) box.appendChild(head);
  box.appendChild(account(story));
}

function packFor(id){
  return id ? el.feed.querySelector(`.pack[data-dream="${CSS.escape(id)}"]`) : null;
}

// A rewrite is a swap and not an arrival: the words change under a soft fade, with nothing
// moving and nothing scrolling.
function updateStory(story){
  const pack = packFor(story && story.dream);
  if (!pack) return;
  const box = pack.querySelector('.story');
  // A rewrite that only renamed the dream is still a rewrite: the title is part of what is
  // compared, or a new name would sit unwritten above the old account until the next scene.
  if (!box || (box.dataset.text === (story.text || '')
               && box.dataset.title === (story.title || ''))) return;
  box.classList.add('fading');
  setTimeout(() => {
    putStory(box, story);
    box.classList.remove('fading');
  }, 400);
}

function syncStories(pages){
  for (const p of pages) if (p.story) updateStory(p.story);
}

function drawStatus(s){
  if (s) status = s;
  s = status;
  if (!s) return;
  const dreaming = s.state === 'dreaming';
  el.dot.classList.toggle('on', dreaming);
  if (dreaming) el.state.textContent = 'dreaming · ' + ago(Date.now() / 1000 - s.since);
  else if (s.since) el.state.textContent = 'asleep since ' + when(s.since);
  else el.state.textContent = 'asleep';
}

// ---- one passage --------------------------------------------------------------------------
function build(p){
  const art = document.createElement('article');
  art.className = 'pass';
  art.dataset.room = p.room;

  // The dream's own block: seed, text, flag, foot. It exists so the plate has something to be
  // behind — the reader's note and a finished account are siblings of it and stay off the
  // picture. Without a plate it is a plain div and the page reads exactly as it did.
  const block = document.createElement('div');
  block.className = 'block';
  art.appendChild(block);

  // The name at the very top of the block, above the grey seed: it is the first thing read and
  // the thing a dream is chosen by.
  const head = titleLine(p.name, p.verse);
  if (head) block.appendChild(head);

  const seed = document.createElement('p');
  seed.className = 'seed';
  seed.textContent = p.seed;                    // whole, and quiet: bekh's call for now
  block.appendChild(seed);

  const body = document.createElement('p');
  body.className = 'body';
  block.appendChild(body);
  if (p.plate){ art.dataset.plate = p.plate; plates.observe(art); }

  if (p.reading){
    const r = document.createElement('aside');
    r.className = 'reading';
    // textContent, like everything else here: what comes back from the cli is text, and a
    // reading that could inject markup would be a reading that could rewrite the page.
    r.appendChild(document.createTextNode(p.reading.text));
    const rw = document.createElement('span');
    rw.className = 'rwhen';
    rw.textContent = when(p.reading.ts);
    r.appendChild(rw);
    // First child, so the phone reads it as an inset above the passage; the desktop grid
    // moves the same node into the second column.
    art.insertBefore(r, art.firstChild);
  }

  if (p.flag){
    const f = document.createElement('p');
    f.className = 'flag';
    f.textContent = 'filtered: ' + p.flag;
    block.appendChild(f);
  }

  const foot = document.createElement('div');
  foot.className = 'foot';
  const good = stroke('good', p), keep = stroke('keep', p);
  foot.appendChild(good);
  foot.appendChild(keep);
  const t = document.createElement('span');
  t.className = 'when';
  t.textContent = when(p.ts);
  foot.appendChild(t);
  block.appendChild(foot);

  // Each passage repaints only itself, off the answer to its own mark.
  art.repaint = () => {
    good.textContent = p.good ? '●' : '○';
    keep.textContent = p.kept ? '★' : '☆';
    good.classList.toggle('on', !!p.good);
    keep.classList.toggle('on', !!p.kept);
  };
  art.render = () => drawBody(body, p);
  art.repaint();
  art.render();
  return art;
}

// ---- the plate ---------------------------------------------------------------------------
// A quarter of a megabyte per dream, and most of the feed is below the fold, so a plate is
// only fetched when its block comes near the viewport. It is loaded through an Image() first so
// nothing is ever painted half-arrived. Nothing about the picture touches the layout: the box
// is the dream's and `cover` crops the painting into it.
const plates = new IntersectionObserver(es => {
  for (const e of es){
    if (!e.isIntersecting) continue;
    const band = e.target;
    plates.unobserve(band);
    const url = band.dataset.plate;
    const img = new Image();
    img.onload = () => {
      band.style.setProperty('--plate', `url("${url}")`);
      band.classList.add('plated');
    };
    img.src = url;
  }
}, {root: el.scroll, rootMargin: '800px'});

// Some older copies carry the prompt's own `[seed] … [dream]` labels, because the reader typed the
// material back whole. His slips are kept by decision, but our plumbing leaking into a dream is
// not a slip of his: keep only what follows the last `[dream]` label. interpreter.py does the
// same at parse time now; this is for the reading files already on the shelf.
function afterDreamLabel(segs){
  const LABEL = '[dream]';
  for (let i = segs.length - 1; i >= 0; i--){
    const at = (segs[i].t || '').lastIndexOf(LABEL);
    if (at < 0) continue;
    const rest = segs[i].t.slice(at + LABEL.length).replace(/^[ \t]/, '');
    return [Object.assign({}, segs[i], {t: rest})].concat(segs.slice(i + 1)).filter(x => x.t);
  }
  return segs;
}

// Press and hold lifts the wash on a phone; a desk gets it on hover, in CSS. The hold starts
// only for a touch and dies on the first real move, so it never fights a text selection, and a
// press that begins on a mark button is not a peek at all.
let holding = null;
function peekOff(){
  if (!holding) return;
  clearTimeout(holding.timer);
  holding.block.classList.remove('peek');
  holding = null;
}
addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' || tuning) return;
  const band = e.target.closest && e.target.closest('.pass.plated');
  if (!band || (e.target.closest && e.target.closest('.stroke'))) return;
  peekOff();
  holding = {block: band, x: e.clientX, y: e.clientY,
             timer: setTimeout(() => band.classList.add('peek'), 350)};
}, {passive: true});
addEventListener('pointermove', e => {
  if (holding && Math.hypot(e.clientX - holding.x, e.clientY - holding.y) > 10) peekOff();
}, {passive: true});
for (const ev of ['pointerup', 'pointercancel', 'scroll']) {
  addEventListener(ev, peekOff, {passive: true, capture: true});
}

// The dream, or the interpreter's copy of it. Segment by segment and always through
// textContent — his copy is text that came back from a cli, and the only markup honoured in it
// was read by the interpreter when it made these segments. Anything else he typed, `<script>`
// included, arrives here as characters and leaves as characters.
function drawBody(body, p){
  while (body.firstChild) body.removeChild(body.firstChild);
  // Reading files written before 2026-09-19 carry a `kind` per segment from the retype check
  // that is gone: `gone` was text the machine wrote and he did not, and there is nothing to
  // show it against any more, so it is simply left out.
  const segs = (!RAW && Array.isArray(p.segments) && p.segments.length)
    ? twoMarks(afterDreamLabel(p.segments.filter(s => s.kind !== 'gone'))) : null;
  if (!segs || !segs.length){
    const t = p.text || '';
    body.appendChild(document.createTextNode(RAW ? t : t.slice(0, trimAt(t))));
    return;
  }
  const plain = segs.map(s => s.t).join('');
  const cut = trimAt(plain);
  let at = 0;
  for (let i = 0; i < segs.length; i++){
    const s = segs[i];
    let t = s.t || '';
    if (at >= cut) break;
    if (at + t.length > cut) t = t.slice(0, cut - at);
    at += (s.t || '').length;
    if (!t) continue;
    if (!s.mark){
      body.appendChild(document.createTextNode(t));
      continue;
    }
    const span = document.createElement('span');
    span.className = s.mark === 'strange' ? 'lit-b' : 'lit-a';
    span.textContent = t;
    body.appendChild(span);
  }
}

// **Two marks, and the colours mean them** (bekh, 2026-09-21): magenta is what touched the
// reader most, cyan what felt most mysterious and meaningful — the two things his own prompt
// asks for. A colour is a reading now, not a coin toss.
//
// Readings written before that carry `mark: true` and no kind, and often more than two runs.
// They are brought under the same rule here rather than rewritten on the shelf: the first
// marked run becomes the magenta one, the second the cyan one, and the rest are plain text —
// so the whole feed follows the two-only rule however old the reading is.
function twoMarks(segs){
  if (!segs.some(s => s.mark === true)) return segs;      // already the new shape
  let seen = 0;
  return segs.map(s => {
    if (s.mark !== true) return s;
    seen += 1;
    if (seen === 1) return Object.assign({}, s, {mark: 'touched'});
    if (seen === 2) return Object.assign({}, s, {mark: 'strange'});
    return Object.assign({}, s, {mark: false});
  });
}

function stroke(which, p){
  const b = document.createElement('button');
  b.className = 'stroke ' + which;
  b.title = which === 'keep' ? 'keep' : 'good';
  b.addEventListener('click', () => mark(p, which === 'keep' ? 'kept' : 'good'));
  return b;
}

function mark(p, which){
  const on = !(which === 'kept' ? p.kept : p.good);
  fetch('/api/mark', {method: 'POST', headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify({room: p.room, node: p.node, mark: which, on: on})})
    .then(r => r.json().then(d => ({ok: r.ok, d: d})))
    .then(r => {
      if (!r.ok){ say(r.d.error || 'the mark did not land'); return; }
      // Repaint from the ANSWER and never from what was asked: a branch wears at most one
      // mark, so the star pops the circle, and the server is where that rule lives.
      p.kept = !!r.d.kept;
      p.good = !!r.d.good;
      const art = el.feed.querySelector('[data-room="' + CSS.escape(p.room) + '"]');
      if (art && art.repaint) art.repaint();
    })
    .catch(() => say('the mark did not land'));
}

function rule(){
  const hr = document.createElement('hr');
  hr.className = 'sep';
  return hr;
}

function passesOf(pack){ return pack.querySelector('.passes'); }

// **The feed runs in the normal direction** (bekh, 2026-09-21): oldest at the top, newest at
// the bottom, and the viewer put at the honest bottom when the page loads. It ran backwards for
// two days because a bare feed of dreams reads fine that way — the stories changed the answer:
// a pack's scenes came out last-to-first, so the story beside them told the night in the
// opposite order, and a sticky story would have ridden the screen while scrolling INTO the
// past. Turned round, 1→4 reads downward, the account beside it reads the same way, and
// sticking to the top while reading DOWN is what sticky is for.
//
// The api still answers newest-first; the page reverses each batch. One place, one reversal.

function addBottom(p){
  const art = build(p);
  const id = p.story ? p.story.dream : null;
  const last = el.feed.lastElementChild;
  if (id && last && last.classList.contains('pack') && last.dataset.dream === id){
    const box = passesOf(last);
    if (box.firstChild) box.appendChild(rule());
    box.appendChild(art);
  } else {
    if (el.feed.firstChild) el.feed.appendChild(rule());
    if (id){
      const pack = newPack(p.story);
      passesOf(pack).appendChild(art);
      el.feed.appendChild(pack);
    } else {
      el.feed.appendChild(art);
    }
  }
}

// Each call puts its passage above everything, so a batch walked newest→oldest lands in order.
// A pack continued across the `earlier` boundary merges into the one already on top instead of
// opening a second section with the same id — two stories for one pack is the bug this round
// exists to avoid.
function addTop(p){
  const art = build(p);
  const id = p.story ? p.story.dream : null;
  const first = el.feed.firstElementChild;
  if (id && first && first.classList.contains('pack') && first.dataset.dream === id){
    const box = passesOf(first);
    if (box.firstChild) box.insertBefore(rule(), box.firstChild);
    box.insertBefore(art, box.firstChild);
    return;
  }
  if (first) el.feed.insertBefore(rule(), first);
  if (id){
    const pack = newPack(p.story);
    passesOf(pack).appendChild(art);
    el.feed.insertBefore(pack, el.feed.firstChild);
  } else {
    el.feed.insertBefore(art, el.feed.firstChild);
  }
}

// `pages` is newest-first, as the api hands it over.
function render(pages, where){
  const taken = pages.filter(p => !rooms.has(p.room));
  for (const p of taken) rooms.add(p.room);
  if (where === 'bottom') for (const p of taken.slice().reverse()) addBottom(p);
  else for (const p of taken) addTop(p);
  const first = el.feed.querySelector('.pass');
  if (first) oldest = first.dataset.room;
  return taken.length;
}

// A day's worth in one go (bekh: "load the page honestly and just put the viewer onto the
// honest bottom"). 300 covers a full day at a passage every five minutes. There is no sentinel
// and no scroll-triggered slice any more: nothing arrives while he is reading but a new dream.
const DAY = 300;

function toBottom(){ el.scroll.scrollTop = el.scroll.scrollHeight; }

function load(){
  busy = true;
  return api('n=' + DAY)
    .then(d => {
      render(d.pages || [], 'bottom');
      more = !!d.more;
      el.earlier.hidden = !more;
      drawStatus(d.status);
      syncStories(d.pages || []);
      toBottom();
      // Once more when the fonts have landed: a late reflow moves the bottom under him, and
      // the bottom is where he is meant to be standing. Plates are backgrounds and add no
      // height, so nothing else can shift it.
      addEventListener('load', toBottom, {once: true});
    })
    .catch(() => { more = false; say("can't reach the shelf"); })
    .then(() => { busy = false; });
}

// The past, by request only, and it must not move what he is looking at. Safari has no
// dependable scroll anchoring, so the topmost rendered element's offset is measured before and
// put back after, by hand — which is the only way this holds.
function earlier(){
  if (busy || !more || !oldest) return;
  busy = true;
  el.earlier.textContent = 'earlier…';
  const anchor = el.feed.firstElementChild;
  const before = anchor ? anchor.getBoundingClientRect().top : 0;
  api('n=' + DAY + '&before=' + encodeURIComponent(oldest))
    .then(d => {
      const n = render(d.pages || [], 'top');
      more = !!d.more;
      el.earlier.hidden = !more;
      if (anchor && n) el.scroll.scrollTop += (anchor.getBoundingClientRect().top - before);
    })
    .catch(() => say("can't reach the shelf"))
    .then(() => { busy = false; el.earlier.textContent = 'earlier'; });
}

el.earlier.addEventListener('click', earlier);

// ---- new passages, without moving the text ------------------------------------------------
function atBottom(){
  const m = el.scroll;
  return m.scrollHeight - m.scrollTop - m.clientHeight < 8;
}

function showWaiting(){
  waiting = 0;
  el.fresh.hidden = true;
  toBottom();
}

// Mirrored, now that the feed runs forward: a new dream is appended BELOW. Standing at the
// bottom, the page follows it down; anywhere else it lands silently and only the quiet hint
// appears, because the one thing this page must never do is move the words he is reading.
function poll(){
  api('n=5').then(d => {
    drawStatus(d.status);
    syncStories(d.pages || []);
    const fresh = (d.pages || []).filter(p => !rooms.has(p.room));
    if (!fresh.length) return;
    const wasAtBottom = atBottom();
    render(fresh, 'bottom');
    if (wasAtBottom){ toBottom(); return; }
    waiting += fresh.length;
    el.fresh.textContent = waiting === 1 ? 'new' : waiting + ' new';
    el.fresh.hidden = false;
  }).catch(() => {});
}

el.fresh.addEventListener('click', showWaiting);

// ---- the wash tuner -----------------------------------------------------------------------
// Four numbers chosen by eye (?tune=1). It writes the same custom properties the stylesheet
// uses, on :root, so nothing about how a plate is painted has a second implementation — and
// what it lands on is copied into the stylesheet by hand afterwards.
const DARK = {rgb: '35,35,35', wash: .68, fade: .12, peek: .30, ink: [0xd4, 0xe3, 0xfe]};
const LIGHT = {rgb: '250,244,237', wash: .75, fade: .10, peek: .36, ink: [0x57, 0x52, 0x79]};
const lightRoom = matchMedia('(prefers-color-scheme: light)');

function room(){ return lightRoom.matches ? LIGHT : DARK; }
function washKey(){ return 'stream.wash.' + (lightRoom.matches ? 'light' : 'dark'); }

function storedWash(){
  try {
    const raw = localStorage.getItem(washKey());
    if (raw) return JSON.parse(raw);
  } catch (e) { /* no memory here, and the defaults are fine */ }
  return null;
}

function clamp01(x){ return Math.max(0, Math.min(1, x)); }

function applyWash(v){
  const r = room().rgb;
  const set = (n, a) => document.documentElement.style.setProperty(n, `rgba(${r},${a})`);
  const a = clamp01(v.wash + v.fade / 2), b = clamp01(v.wash - v.fade / 2);
  set('--wash-a', a.toFixed(3));
  set('--wash-b', b.toFixed(3));
  set('--peek-a', clamp01(v.peek + v.fade / 2).toFixed(3));
  set('--peek-b', clamp01(v.peek - v.fade / 2).toFixed(3));
  return [a, b];
}

// WCAG, so a number he picks comes with its cost visible: the body ink against this wash laid
// over pure black and over pure white — the two worst plates there could ever be.
function lin(c){ c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function lum(rgb){ return 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2]); }
function ratio(a, b){ return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05); }

function washCost(alpha){
  const r = room(), ground = lum(r.rgb.split(',').map(Number)), ink = lum(r.ink);
  const over = p => ratio(ink, alpha * ground + (1 - alpha) * p);
  return [over(0), over(1)];
}

function drawTuner(v, alphas){
  $('t-wash').textContent = v.wash.toFixed(2);
  $('t-fade').textContent = v.fade.toFixed(2);
  $('t-peek').textContent = v.peek.toFixed(2);
  $('t-nums').textContent =
    `wash ${v.wash.toFixed(2)} · ${alphas[0].toFixed(2)} → ${alphas[1].toFixed(2)}`;
  // The weaker of the two stops is the one the text has to survive.
  const c = washCost(Math.min(alphas[0], alphas[1]));
  $('t-cost').textContent = `over black ${c[0].toFixed(1)}:1 · over white ${c[1].toFixed(1)}:1`;
}

let tuning = false;     // a drag on the panel must never become a press-and-hold peek

function tuner(){
  const d = room();
  const v = Object.assign({wash: d.wash, fade: d.fade, peek: d.peek}, storedWash() || {});
  const alphas = applyWash(v);
  const panel = $('tuner');
  if (new URLSearchParams(location.search).get('tune') !== '1'){ panel.hidden = true; return; }

  panel.hidden = false;
  const s = {wash: $('s-wash'), fade: $('s-fade'), peek: $('s-peek')};
  const put = () => {
    s.wash.value = Math.round(v.wash * 100);
    s.fade.value = Math.round(v.fade * 100);
    s.peek.value = Math.round(v.peek * 100);
  };
  put();
  drawTuner(v, alphas);
  if (panel.dataset.wired) return;          // a theme flip re-reads the numbers, not the wiring
  panel.dataset.wired = '1';

  const save = () => {
    try { localStorage.setItem(washKey(), JSON.stringify(v)); } catch (e) { /* no memory */ }
  };
  for (const name of ['wash', 'fade', 'peek']){
    s[name].addEventListener('input', () => {
      v[name] = Number(s[name].value) / 100;
      drawTuner(v, applyWash(v));
      save();
    });
  }
  // The panel is a tool, not the page: a touch on it never scrolls the feed, never selects a
  // word, and never counts as the hold that lifts a plate.
  panel.addEventListener('pointerdown', e => { tuning = true; e.stopPropagation(); });
  for (const ev of ['pointerup', 'pointercancel'])
    addEventListener(ev, () => { tuning = false; }, {passive: true});

  $('t-reset').addEventListener('click', () => {
    try { localStorage.removeItem(washKey()); } catch (e) { /* no memory */ }
    const back = room();
    v.wash = back.wash; v.fade = back.fade; v.peek = back.peek;
    put();
    drawTuner(v, applyWash(v));
  });
}

// The stored wash applies whether or not the tuner is on screen, and follows a theme flip.
lightRoom.addEventListener('change', tuner);
tuner();

load();
setInterval(poll, POLL_MS);
// "3 min ago" goes stale on a phone left on a table; re-render it off the numbers already
// held, with no request behind it.
setInterval(() => drawStatus(null), 30000);
</script>
</body>
</html>
