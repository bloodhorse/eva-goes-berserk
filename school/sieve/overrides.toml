# Hand judgments the plan obeys. Every entry says why.
#
#   [[override]]
#   path   = "apex/Some-Title--0123abcd.txt"   source/path under dedupe/out, shell wildcards allowed (* ? [])
#   title  = "^Words for Thought"              or a regular expression on the title (case ignored); `source` narrows it
#   source = "apex"
#   kind   = "fiction"                         forces the kind: fiction, nonfiction, verse, stub, mixed, unsure
#   cut    = { from = "first words of the first paragraph to cut", to = "first words of the last one" }
#   keep   = { from = "...", to = "..." }      no automatic cut may touch these paragraphs
#   as     = "summation"                       the reason a forced cut is recorded under (default "override")
#   reason = "why"
#
# `to` may be left out (one paragraph) or be "$" (to the end of the file). Spans are found by their opening words, so
# they survive a dedupe run that renumbers paragraphs; one that no longer finds its words is listed in the report.
# Later entries win over earlier ones. `sieve.py overrides` lists what each entry matched.

