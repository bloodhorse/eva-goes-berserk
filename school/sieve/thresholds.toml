# a label printed on the page that means fiction (a bare "fiction" is not trusted: one site tags its essays with it)
label_fiction = ['^\s*short stor(y|ies)\s*$', '^\s*flash( fiction)?\s*$', '^\s*novel(ette|la)\s*$']
# a metadata class that means fiction
class_fiction = ['^category-fiction$', '^article_type-fiction$', '^tag-(short-story|novelette|novella)$', '^category-(short-stories|flash-fiction)$']
# a metadata class that means non-fiction
class_nonfiction = ['^category-(non-?fiction|interviews?|reviews?|editorials?|essays?)$', '^article_type-(essay|interview|editorial|nonfiction)$']
# a metadata class that means verse
class_verse = ['^category-poe(try|ms?)$', '^article_type-poe(try|m)$', '^tag-poe(try|m)$']
# words about writing and publishing
meta_words = [
  'stor(y|ies)', 'fiction', 'authors?', 'writers?', 'writing', 'readers?', 'novels?', 'novellas?', 'books?', 'genres?', 'publish\w*',
  'antholog\w+', 'magazines?', 'editors?', 'edit(ed|ing)', 'issues?', 'interviews?', 'reviews?', 'characters?', 'narrat\w+',
  'poems?', 'poetry', 'fantasy', 'horror', 'sci-?fi', 'essays?', 'protagonists?', 'plots?', 'prose', 'drafts?', 'manuscripts?',
  'worldbuilding', 'tropes?', 'themes?', 'podcasts?', 'episodes?', 'sequels?', 'trilog\w+', 'collections?',
