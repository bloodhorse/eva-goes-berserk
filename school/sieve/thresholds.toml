# a title that is a notice from the publisher or the author, not a work
title_notice = [
  '\bhiatus\b', '\bschedule\b', '\bon pause\b', '\bback on\b', '\bno chapter\b', '\bupdate\b', '\bannouncement\b',
  '\beligibility\b', '\bfan ?art\b', '\bthank you\b', '\bpatreon\b', '\bmetacast\b', '\bnew websites?\b',
  '\bsubmissions? (are )?(open|closed)\b', '\breader.s choice\b', '\bcontest\b', '\bpromo\b', '\bcoming soon\b', '^\s*episode\s*#?\s*\d+\b',
  '\bdrabble contest\b', '\bstaff changes?\b', '\bfeedback\b', '\bflash fiction contest\b', '\bnow available\b',
]
# an address that says the page is not a story
url_nonfiction = [
  '/(interview|interviews|editorial|editorials|non-?fiction|review|reviews|essay|essays|column|columns|news|blog-post|announcements?)(/|-)',
  '/for-writers-', '/book-review-', '/words-for-thought', '/musings-from', '/author-interview', '/artist-interview',
  '/cover-artist', '/apex-magazine-(issue|podcast|award)', '/category/(non-?fiction|interviews?|reviews?|editorials?)/',
]
# a label printed on the page that means verse
label_verse = ['^\s*poetry\s*$', '^\s*poems?\s*$', '--poetry\b', '^\s*verse\s*$']
# a label printed on the page that means non-fiction
label_nonfiction = [
  '^\s*non-?fiction\s*$', '^\s*editorials?\s*$', '^\s*for[- ]writers\s*$', '^\s*interviews?\s*$', '^\s*(book[- ])?reviews?\s*$',
  '^\s*short fiction review\s*$', '^\s*announcements?\s*$', '^\s*apex-magazine-blog\s*$', '^\s*essays?\s*$', '--nonfiction\b',
  'award[- ]eligib', '^\s*podcast\s*$', '^\s*author interview\s*$', '^\s*artist interview\s*$', '^\s*blog\s*$',
