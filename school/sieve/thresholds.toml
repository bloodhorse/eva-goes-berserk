speaker_label = ['(?-i:^\s*(?:[A-Z][\w.’&-]*\.?\s+){0,4}[A-Z][\w.’&-]*\s*:\s+\S)', '^\s*(q|a|question|answer)\s*[:.]\s+\S']
# navigation between pages (never a line with a quotation mark in it)
nav = [
