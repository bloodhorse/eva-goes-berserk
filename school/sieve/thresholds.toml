# Every number and every pattern the sieve decides by. One line of meaning above each.
# Rates are "per thousand words". Patterns are regular expressions, matched without regard to case.

[shape]
# a line of at most this many words is a short line (verse is made of them)
verse_line_max_words = 12
# rates are not trusted, and count for nothing, in a text shorter than this many words
min_words_for_rates = 120
# a speaker label ("AM:", "Apex Magazine:") is at most this many words before its colon
label_max_words = 5
# an anthology is read through a sliding window of this many paragraphs when a narrative stretch is looked for
window_paragraphs = 12

[stub]
# a file with fewer words than this is a stub whatever it says (an extraction that failed)
tiny_words = 60
# a podcast page with fewer words than this is a stub: show notes, credits, or the first paragraph or two of a story whose text the site does not carry
podcast_words = 300
# a file the deduper left at most this share of ...
remnant_share = 0.25
# ... and at most this many words is a remnant, a stub
remnant_words = 450
# a file under this many words that ends by pointing elsewhere ("continues", "read the rest") is a teaser, a stub
teaser_words = 600
# a file under this many words whose title is a notice (hiatus, schedule, eligibility list) is a stub
notice_words = 400

[verse]
# a text is verse when at least this share of its words stands in stanzas (paragraphs of two or more short lines)
stanza_share_min = 0.6
# ... or when at least this share of all its lines are short and unpunctuated at the end, one line a paragraph
short_line_share_min = 0.55
# ... and its lines average at most this many words
max_line_words_mean = 9.5
# ... and it has at least this many lines
min_lines = 6
# a text that is not verse by the rules above is listed as unsure when its stanza share is at least this ...
unsure_stanza_share = 0.5
# ... its lines average at most this many words ...
unsure_line_words_mean = 12.5
# ... and it has at most this many words (a long text with broken lines is a story set as chat, letters or lists)
unsure_max_words = 1500

[nonfiction]
# the non-fiction score minus the fiction score must reach this for a file to be called non-fiction
decide_min = 3.5
# ... and a difference of at least this, short of the line above, puts the file in the unsure band
unsure_min = 1.5
# words about writing and publishing per thousand: at or above this the text talks about fiction instead of being it
meta_high = 22.0
# ... a weaker version of the same signal
meta_mid = 10.0
# years, prizes, "edited by" and the like per thousand: at or above this the text is bibliography
biblio_high = 14.0
# a question-and-answer text has at least this share of its paragraphs opening with a speaker label
qa_share_min = 0.2
# ... and at least this many such paragraphs
qa_min_turns = 6
# said, he, she, was, had and the like per thousand: under this a text is not telling a story
narrative_low = 30.0
# ... at or above this it is
narrative_high = 60.0
# share of paragraphs opening with a quotation mark at or above which a text has spoken dialogue, a mark of fiction
speech_share_high = 0.15
# words about writing per thousand: under this the text hardly mentions its own trade, a mark of fiction
meta_low = 3.0
# "this issue", "our readers", "subscribe" and the like per thousand: at or above this an editor is talking
address_high = 5.0
# a file of at least this many words is long for an article, a small mark of fiction
long_fiction_words = 6000

[weights]
# title says so outright ("Interview with", "Book Review:", "Editorial")
title_strong = 4.0
# title hints ("... : An Interview", "Notes on", "Introduction")
title_weak = 1.5
# the page itself carries a non-fiction label
label = 8.0
# the address says so (/interview-, /editorial/, /non-fiction/)
url = 2.0
# question-and-answer structure
qa = 2.0
# talk about writing at the high rate
meta_high = 3.0
# talk about writing at the middle rate
meta_mid = 1.5
# bibliography rate
biblio_high = 1.5
# an editor addressing readers
address = 1.5
# the byline belongs to someone who mostly writes columns in this source
columnist = 1.0
# fiction: the collector took this source from a fiction-only index
fiction_index = 2.5
# fiction: the page's own classes say fiction (the site filed it so: a title alone must not outvote that)
fiction_class = 5.0
# fiction: narrative rate at the high mark
narrative_high = 1.5
# fiction: spoken dialogue
speech = 1.5
# not telling a story: narrative rate under the low mark
narrative_low = 1.5
# fiction: never mentions its own trade
meta_low = 1.5
# fiction: long for an article
long_fiction = 0.5
# fiction: a ledger calls it a story or a novel
ledger_story = 2.5

[edges]
# how many paragraphs from the head and from the tail of a file are looked at for wrappers
zone_paragraphs = 14
# a head cut is never longer than this many words
head_max_words = 600
# a tail cut by walking back from the end is at most this share of the file
tail_max_share = 0.35
# ... and at most this many words (comment threads are exempt: they are cut from their marker to the end)
tail_max_words = 2500
# an author's note cut from its marker to the end is at most this many words; a longer one is left and flagged
note_max_words = 1500
# unrecognised paragraphs caught between a wrapper paragraph and the edge go with it when each is at most this many words
sandwich_words = 14
# an author biography paragraph is at most this many words
bio_max_words = 220
# ... and scores at least this (name at the start, a biography verb, bibliography words, the author's name)
bio_min_score = 3
# a marker line ("About the Author", "Comments") is at most this many words
marker_max_words = 8
# a comment thread is only cut when it holds at least this many words
comments_min_words = 20
# a serial chapter's closing note, from its marker to the end, is at most this share of the chapter
serial_note_max_share = 0.3
# no edge cut may leave a body shorter than this many words; the file is left whole and flagged instead
min_body_words = 150
# a marker line counts only in the last part of the file: after this share of its words
tail_marker_zone_share = 0.5

[books]
# a ledger's section start is compared over at most this many characters
start_probe_chars = 60
# ... and is ignored when shorter than this (a bare "II" matches anywhere)
start_min_chars = 6
# an editor's headnote is at most this many words
headnote_max_words = 900
# ... in at most this many paragraphs
headnote_max_paragraphs = 8
# a paragraph under a story heading is headnote when its score reaches this without the author's name (two points a presenting phrase, one for bibliography words, one for talk about writing; never when it opens with speech)
headnote_min_score = 4
# ... or this when it names the heading's author, capital letter and all
headnote_named_score = 1
# a section after the book's first story is judged editorial by its rates only at this talk-about-writing plus bibliography rate
editorial_inner_meta_min = 22.0
# a section is judged editorial by its rates only when it has at least this many words
editorial_min_words = 120
# ... or, down to this many words, when its talk-about-writing plus bibliography rate reaches the line after this one and nobody speaks in it
editorial_short_words = 40
editorial_short_meta_min = 25.0
# ... its talk-about-writing plus bibliography rate is at least this
editorial_meta_min = 10.0
# ... and its narrative rate is under this (and it has no spoken dialogue: speech_share_high)
editorial_narrative_max = 55.0
# a stretch reads as narrative when its narrative rate is high, its talk about writing under the line above, and this share of its paragraphs open with speech
narrative_speech_min = 0.1
# a titled apparatus section (a Summation) ends early where this many paragraphs in a row ...
apparatus_window_paragraphs = 12
# ... of at least this many words read as narrative
apparatus_window_words = 400
# a section with at least this many words left after its headnote counts as a story in the report
story_min_words = 300
# at most this many heading lines in a row are a story's heading; more is a contents page
heading_run_max = 5
# a section is a list (honorable mentions, permissions, contents) when this share of its paragraphs are list lines
list_line_share_min = 0.6
# untitled matter before a book's first story heading is front matter and judged as one section up to this many words
front_matter_max_words = 3000
# in a book that keeps its essays, an editorial section of at least this many words is reported as an essay
essay_min_words = 800
# a byline is at most this many words
name_max_tokens = 6
# headings and a headnote left without a story (the deduper took it) are cut when the leftover is at most this many words
orphan_max_words = 60

[review]
# how many decisions of each kind are sampled per source
sample_per_stratum = 6
# words shown from the head of a file
head_words = 80
# words shown from its tail
tail_words = 40
# words shown from each end of a cut
cut_edge_words = 30
# words shown of the paragraph on each side of a cut
context_words = 40
# the sample is drawn with this seed, so the same plan gives the same review
seed = 7
# how many cuts of each reason are sampled per source
cut_samples_per_reason = 4

[report]
# tokens per word, measured on the shelves already tokenised
tokens_per_word = 1.39
# how many files of the unsure band the report lists
unsure_rows = 400
# how many overrides the report lists
override_rows = 2000

[patterns]
# a title that says the page is not a story
title_nonfiction_strong = [
  '^\s*(an?\s+)?(author|artist|cover artist|editor|apex|short|mini)?[\s-]*interview\b',
  '\binterview with\b', '^\s*interview\s*:', '\bauthor spotlight\b', '\bartist (spotlight|showcase)\b',
  '^\s*(book|film|movie|game|short fiction|tv|comic)s?\s+reviews?\b', '^\s*reviews?\s*[:—–-]', '\breview\s*:',
  '^\s*editorial\b', '\beditorial\s*$', '\beditorial[,:]', '^\s*(words )?from the editors?\b', '\beditor.s (note|desk|letter)\b',
  '^\s*words for thought\b', '^\s*musings from\b', '\bletters? from the editor', '\baward[s]? eligib', '\beligibility\b',
  '\bcall for submissions\b', '\bsubmission (call|guidelines)\b', '\bguidelines\b', '\bannounc(es?|ing|ement)s?\b', '\btable of contents\b',
  '\byear in review\b', '\brecommended read', '\breader.s choice\b', '\bmetacast\b', '\bkickstarter\b',
  '\bnonfiction\b', '\bnon-fiction\b', '\bessay\s*:', '^\s*essay\b', '\bcolumn\s*:', '\bpodcast (update|news|feed)\b',
  '^\s*clavis aurea\b', '^\s*page advice\b', '\bpress release\b', '\bcover reveal\b', '^\s*apex (magazine )?in \w+( \d{4})?\s*$',
  '\bannual report\b', '^\s*ask an? necroman', '\b(story|cover|artist|poem) of the year\b',
  '^\s*about (the )?(author|editor|artist)s?\b', '\bsubscription drive\b', '\bsubscriber\b', '\bnewsletter\b',
  '^\s*between the lines\b', '^\s*the apex (book )?blog\b', '\bblog tour\b', '\bgiveaway\b',
]
# a title that only hints at it
title_nonfiction_weak = [
  '\binterview\b', '\breview\b', '\bintroduction\b', '\bforeword\b', '\bpreface\b', '\bafterword\b', '\bnotes? on\b',
  '\bconversation with\b', '\bin conversation\b', '\bq\s*&\s*a\b', '\broundtable\b', '\bwriting\b', '\bwriters?\b',
  '\bhow to\b', '\bfor writers\b', '\bissue \d+\b', '\bupdate\b', '\bnews\b', '\bin memoriam\b', '\bobituary\b',
