  'thank you for (reading|listening|your support)', 'submissions?', 'patreon', 'kickstarter', 'newsletter', 'donat\w+', 'award season',
  'table of contents', 'our (next|new|latest) issue', 'we are (pleased|proud|excited|thrilled)', 'slush', 'eligib\w+', 'in this issue',
]
