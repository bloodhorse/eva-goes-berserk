]
# the navigation line that closes a serial chapter: what follows it is the author's note, what stands before it at the head is an announcement
chapter_nav = ['^\W*(previous|last) chapter\b', '^\W*next chapter\W*$']
# words of someone talking to an audience; a pitch paragraph must hold one beside its pitch words
pitch_address = ['\byou(r|.ll|.re)?\b', '\bplease\b', '\b(my|our) (patreon|newsletter|store|site|website|discord|podcast|story|stories|book|books|work)\b', '\bthanks?\b', '\b(link|here)\b']
