# The text roots the deduper reads. Paths are relative to this file.
#
#   name      the folder the root gets under out/, and its label everywhere
#   path      the root directory
#   glob      which files under it, relative to path; * stays inside one folder, **/ crosses folders
#   kind      read      she has already read this shelf and held-out splits exist: it always wins
#             incoming  not yet read
#             reference indexed for lookup and reported, never cut, never the cause of a cut, not written to out/
#   priority  higher wins among roots of the same kind
#   container true for a shelf of anthologies: there, an editor's introduction standing between a story's
#             heading and a story that is cut goes with the cut (thresholds.toml, [remnants]); elsewhere only
#             the heading goes
#   metadata  a folder of <file stem>.json with title, authors (titles in the report only)
#   ledger    a ledger.jsonl (or a glob of them) with slug or file, title, author (titles in the report only)
#   format    txt (default) or jsonl: one document per line, text_field and id_field name the keys
#
# Thresholds live in thresholds.toml beside this file.

[[source]]
name = "library"
path = "../inbox/clean"
glob = "*.txt"
kind = "read"
priority = 90
ledger = "../inbox/clean/ledger.jsonl"

