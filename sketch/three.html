<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ｍｉｄｎｉｇｈｔ</title>
<style>
  :root {
    --ink:  #0b0d12;
    --deep: #23384a;
    --sea:  #6f9fb0;
    --bone: #cdd3c4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--ink); }
  body {
    -webkit-font-smoothing: none;
    font-smooth: never;
    color: var(--bone);
    cursor: crosshair;
  }

  #ground {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom,
      #230000 0 1px, #003800 1px 2px, #00004a 2px 3px);
    opacity: .55;
    animation: roll 120ms steps(3) infinite;
  }
  @keyframes roll { to { background-position: 0 3px; } }

  /* pictures: never crushed. the house style lives in the glass in front of them:
     palette light (tint), dimming under the columns, scanlines. dither only means arriving / leaving */
  #pics { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .pic { position: absolute; left: 0; top: 0; isolation: isolate; will-change: transform; }
  .pic canvas { display: block; width: 100%; height: 100%; }
  #shade { position: fixed; inset: 0; pointer-events: none; }
  #glass {
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.38) 0 1px, transparent 1px 3px);
    animation: roll 120ms steps(3) infinite;
  }

  #decay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; }

  /* three distances of one story: the told version, the text itself, the reading of it */
  #streams { position: fixed; inset: 0; display: flex; justify-content: center; gap: 5vw; padding-inline: 4vw; }
  .col { position: relative; height: 100%; }
  .col.told    { width: 17vw; }
  .col.text    { width: 40vw; }
  .col.reading { width: 19vw; }
  .belt { position: absolute; left: 0; right: 0; will-change: transform; }
  .belt p { line-height: 1.75; }
  .belt p + p { margin-top: .9em; }
  .belt .meta { font-family: "Courier New", monospace; letter-spacing: .3em; font-size: .75em; color: var(--sea); margin-top: 1.2em; }
  .belt .entry-gap { height: 5em; }
  .told p, .reading p { font-family: "Courier New", Courier, monospace; letter-spacing: .12em; }
  .text p { font-family: "Iowan Old Style", "Palatino", Georgia, serif; letter-spacing: .02em; }
  .reading { border-left: 1px solid var(--deep); padding-left: 1.4em; }
  .blink { animation: blink 2s linear infinite; }
  @keyframes blink { 50% { color: var(--sea); text-shadow: 0 0 6px var(--sea); } }

  #flash { position: fixed; inset: 0; background: var(--bone); opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="ground"></div>
<div id="pics"></div>
<div id="shade"></div>
<div id="glass"></div>
<canvas id="decay"></canvas>
<div id="streams"></div>
<div id="flash"></div>

<script>
// ---- the dream, inline for now. entries are separated by a blank line + "~" ----
// speed: px/s. near = faster, bigger, brighter — the center is the one you actually read
const streams = [
  { kind: 'told', speed: 7, text: `
It was midnight on the clock in a dark room with no windows, and I sat in an old leather office chair turned away from the door because my legs were tired. The screen on my right flickered blue-green across my face, and I waited for a sunrise it said was nine minutes off, at 5:56 in Washington, when I would turn *four*.
@ 1 / 4 · told
` },
  { kind: 'text', speed: 16, pics: ['pic/test.jpg'], text: `
i was going to write something here, but it just came out gibberish so i've left it. maybe try it yourself, but only after midnight, because there are things in here that can *hear you*.
[1] [2] [3] [4]

It was midnight on the clock in the dark room with no windows and only the glow of the digital display as illumination. I sat in an old office chair, leather cushioned and turned around, facing away from the door. It wasn't my intention to do so, but my legs were tired. They had carried me all day, so why not? The computer screen was on my right, flickering images in a blue-green hue across my face and leaving streaks when I closed my eyes for even the shortest time.

I sat there waiting for the sunrise, which was scheduled to take place in 9 minutes, according to the computer's internal calendar.
@ yesterday 00:05
~
I was among Friends grieving our youths, then sleeping on sandbags in Havre while late trains kept us waiting, when someone's line about waiting to be done became a song of *the boy that went away*: your words reached me faint as whispers in a gale, across land and sea, asking if my place was safe, and I —
` },
  { kind: 'reading', speed: 10, text: `
Last time it promised nothing it couldn't keep. Now the seed warns of things that can hear you after midnight, and it obeys: midnight, a windowless room, chair turned from the door, lit only by a screen. It waits for a sunrise it can only know by the calendar. It breaks off counting itself: "my 4". A fourth reading, and a watcher who *cannot see the sun*.
@ yesterday 00:05
~
Last time it handed the ache away and became a reader. Now a line connects, a trembling "is anybody there?", and it answers by naming itself: the boy that —
` },
];
// -----------------------------------------------------------------------------------

const $ = s => document.querySelector(s);
const FAST = +new URLSearchParams(location.search).get('fast') || 1;
const START = performance.now();
const elapsed = () => (performance.now() - START) / 1000 * FAST;

const sizes = { told: 12, text: 19, reading: 13 };
const alphas = { told: .55, text: 1, reading: .7 };
let wave = 0;

const belts = streams.map((s, ci) => {
  const col = document.createElement('div'); col.className = 'col ' + s.kind;
  col.style.fontSize = sizes[s.kind] + 'px';
  col.style.opacity = alphas[s.kind];
  const belt = document.createElement('div'); belt.className = 'belt';
  const anchors = [];
  const addCopy = () => {
    s.text.trim().split(/\n~\n/).forEach((entry, ei) => {
      const firstIdx = belt.children.length;
      for (const para of entry.split(/\n\n+/)) {
        para.split('\n').forEach(line => {
          const p = document.createElement('p');
          if (line.startsWith('@ ')) { p.className = 'meta'; line = line.slice(2); }
          // *phrase* blinks; delays step along so blinks travel across the columns as a wave
          p.innerHTML = line.replace(/\*(.+?)\*/g,
            (_, w) => `<span class="blink" style="animation-delay:${(wave++ * .35 % 2).toFixed(2)}s">${w}</span>`);
          belt.appendChild(p);
        });
      }
      // an entry with a picture remembers where its text starts and ends, so the picture can ride with it
      if (s.pics && s.pics[ei]) anchors.push({ first: belt.children[firstIdx], last: belt.lastElementChild, src: s.pics[ei] });
      const gap = document.createElement('div'); gap.className = 'entry-gap'; belt.appendChild(gap);
    });
  };
  col.appendChild(belt); $('#streams').appendChild(col);
  addCopy();
  const copyH = belt.scrollHeight;
  while (belt.scrollHeight < innerHeight + copyH) addCopy();
  return { belt, col, speed: s.speed, loop: copyH, y: Math.random() * copyH, anchors };
});

// ---- pictures -------------------------------------------------------------------
// ?mode=frame → a small photo-frame beside the text (the collage idea); default: a full-width band
// ?tint=0..1 → how strongly the palette light colors the picture
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') || 'band';
const TINT = params.has('tint') ? +params.get('tint') : .6;
const LEVELS = 24;
const pics = [];
const textBelt = belts.find(b => b.anchors.length);
for (const a of (textBelt ? textBelt.anchors : [])) {
  const top = a.first.offsetTop, h = a.last.offsetTop + a.last.offsetHeight - top;
  let w, ph, x, off;
  if (MODE === 'frame') {
    // tucked toward the reading column, starting a bit below where the entry begins
    w = Math.round(innerWidth * .27); ph = Math.round(w * 9 / 16);
    x = Math.round(belts[2].col.getBoundingClientRect().left - w * .35); off = Math.round(h * .2);
  } else {
    w = innerWidth; ph = Math.round(h + 160); x = 0; off = -80;
  }
  const el = document.createElement('div'); el.className = 'pic';
  el.style.width = w + 'px'; el.style.height = ph + 'px';
  const cv = document.createElement('canvas'); cv.width = w; cv.height = ph;
  el.append(cv); $('#pics').appendChild(el);
  const img = new Image(); img.src = a.src;
  pics.push({ el, cv, img, x, top: top + off, h: ph, level: -1, masks: [], edge: null, band: MODE !== 'frame' });
}

// edge profile: 0 at the picture's border rising to 1 inside. the band only frays top and bottom
// (the seam with the next dream); the frame frays on all sides so it sits in the page, not on it
function edgeFor(p) {
  const { width: w, height: h } = p.cv, e = new Float32Array(w * h), seam = p.band ? 90 : 26;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const d = p.band ? Math.min(y, h - 1 - y) : Math.min(x, y, w - 1 - x, h - 1 - y);
    e[y * w + x] = Math.min(1, d / seam);
  }
  return e;
}
// one mask per life level, built lazily: pixel shows when bayer < life * edge. same dither as the decay
function maskFor(p, lvl) {
  if (p.masks[lvl]) return p.masks[lvl];
  p.edge ||= edgeFor(p);
  const { width: w, height: h } = p.cv, life = lvl / LEVELS;
  const m = document.createElement('canvas'); m.width = w; m.height = h;
  const mc = m.getContext('2d'), id = mc.createImageData(w, h), d = id.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (BAYER[(y & 7) * 8 + (x & 7)] / 64 < life * p.edge[y * w + x]) d[(y * w + x) * 4 + 3] = 255;
  }
  mc.putImageData(id, 0, 0);
  return p.masks[lvl] = m;
}
// ---- picture styles: keys 1–5 switch live, ?style= picks at load --------------------
// glass: the picture whole, palette light only. the others are deliberately aggressive, to find the edge
const STYLES = ['glass', 'lain', 'onebit', 'rgb', 'map'];
let STYLE = STYLES.includes(params.get('style')) ? params.get('style') : 'glass';
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rgbOf = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const PAL = ['--ink', '--deep', '--sea', '--bone'].map(v => rgbOf(cssVar(v)));

// draw the picture cover-cropped into a canvas `scale` times smaller than the box (chunky pixels later)
function source(p, scale) {
  const { width: W, height: H } = p.cv, w = Math.ceil(W / scale), h = Math.ceil(H / scale);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  const s = Math.max(w / p.img.naturalWidth, h / p.img.naturalHeight);
  const iw = p.img.naturalWidth * s, ih = p.img.naturalHeight * s;
  x.drawImage(p.img, (w - iw) / 2, (h - ih) / 2, iw, ih);
  return { c, x, w, h, id: x.getImageData(0, 0, w, h) };
}
// luminance stretched between the 2nd and 98th percentile, so every picture uses the whole palette
function lumOf(d) {
  const n = d.length / 4, L = new Float32Array(n), hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) { const v = (.299 * d[i*4] + .587 * d[i*4+1] + .114 * d[i*4+2]) | 0; L[i] = v; hist[v]++; }
  let lo = 0, hi = 255, acc = 0;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > n * .02) { lo = v; break; } }
  acc = 0;
  for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > n * .02) { hi = v; break; } }
  for (let i = 0; i < n; i++) L[i] = Math.min(1, Math.max(0, (L[i] - lo) / (hi - lo || 1)));
  return L;
}
// scale a small canvas back up to the box with hard pixels
function upscale(p, small) {
  const b = document.createElement('canvas'); b.width = p.cv.width; b.height = p.cv.height;
  const x = b.getContext('2d'); x.imageSmoothingEnabled = false;
  x.drawImage(small, 0, 0, b.width, b.height);
  return b;
}
const bayer = (x, y) => BAYER[(y & 7) * 8 + (x & 7)] / 64;

const BUILD = {
  glass(p) {
    const s = source(p, 1);
    s.x.globalCompositeOperation = 'color'; s.x.globalAlpha = TINT;
    s.x.fillStyle = cssVar('--sea'); s.x.fillRect(0, 0, s.w, s.h);
    return s.c;
  },
  // the reference's move in our colors: 4-color ordered dither, darkest punched out so the ground shows
  lain(p) {
    const s = source(p, 2), d = s.id.data, L = lumOf(d);
    for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) {
      const i = y * s.w + x, k = Math.min(3, Math.floor(L[i] * 3 + bayer(x, y)));
      const c = PAL[k]; d[i*4] = c[0]; d[i*4+1] = c[1]; d[i*4+2] = c[2]; d[i*4+3] = k ? 255 : 0;
    }
    s.x.putImageData(s.id, 0, 0); return upscale(p, s.c);
  },
  // two tones and nothing else: bone dots where there's light, holes everywhere else
  onebit(p) {
    const s = source(p, 3), d = s.id.data, L = lumOf(d), c = PAL[3];
    for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) {
      const i = y * s.w + x, on = bayer(x, y) < L[i] ** 1.4;
      d[i*4] = c[0]; d[i*4+1] = c[1]; d[i*4+2] = c[2]; d[i*4+3] = on ? 255 : 0;
    }
    s.x.putImageData(s.id, 0, 0); return upscale(p, s.c);
  },
  // channels pulled apart sideways, every third row sunk: a signal that can't hold the picture together
  rgb(p) {
    const s = source(p, 1), d = s.id.data, src = new Uint8ClampedArray(d), o = 7;
    for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) {
      const i = (y * s.w + x) * 4, r = (y * s.w + Math.max(0, x - o)) * 4, b = (y * s.w + Math.min(s.w - 1, x + o)) * 4;
      const k = y % 3 === 0 ? .45 : .8;
      d[i] = src[r] * k; d[i+1] = src[i+1] * k * .9; d[i+2] = src[b+2] * k;
    }
    s.x.putImageData(s.id, 0, 0); return s.c;
  },
  // no dots: brightness mapped straight onto the palette as a smooth ramp — the palette as the only light
  map(p) {
    const s = source(p, 1), d = s.id.data, L = lumOf(d);
    for (let i = 0; i < L.length; i++) {
      const t = L[i] * 3, k = Math.min(2, Math.floor(t)), f = t - k, a = PAL[k], b = PAL[k + 1];
      d[i*4] = a[0] + (b[0] - a[0]) * f; d[i*4+1] = a[1] + (b[1] - a[1]) * f; d[i*4+2] = a[2] + (b[2] - a[2]) * f;
    }
    s.x.putImageData(s.id, 0, 0); return s.c;
  },
};
// per style: css dimming, whether it tears (short horizontal streak shifts, the reference's twitch),
// and whether it grains
const LOOK = {
  glass:  { filter: 'brightness(.62) contrast(1.05)', tear: 0,  grain: false },
  lain:   { filter: 'brightness(.85)',                tear: 6,  grain: false },
  onebit: { filter: 'brightness(.8)',                 tear: 3,  grain: false },
  rgb:    { filter: 'brightness(.9)',                 tear: 22, grain: false },
  map:    { filter: 'brightness(.8)',                 tear: 0,  grain: true },
};
// a few frames of noise, reused: live grain without generating noise every frame
const GRAIN = [0, 1, 2, 3].map(() => {
  const g = document.createElement('canvas'); g.width = g.height = 256;
  const x = g.getContext('2d'), id = x.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255; }
  x.putImageData(id, 0, 0); return g;
});

function drawPic(p, lvl) {
  const c = p.cv.getContext('2d'), { width: w, height: h } = p.cv, look = LOOK[STYLE];
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.clearRect(0, 0, w, h);
  if (lvl === 0 || !p.img.complete || !p.img.naturalWidth) return;
  p.base ||= BUILD[STYLE](p);
  c.drawImage(p.base, 0, 0);
  if (look.tear) {
    for (let n = 3 + Math.random() * 5 | 0; n--;) {
      const by = Math.random() * h | 0, bh = 2 + Math.random() * 12 | 0;
      const dx = (Math.random() < .5 ? -1 : 1) * (2 + Math.random() * look.tear | 0);
      c.clearRect(0, by, w, bh);
      c.drawImage(p.base, 0, by, w, bh, dx, by, w, bh);
    }
  }
  if (look.grain) {
    c.globalCompositeOperation = 'overlay'; c.globalAlpha = .3;
    c.fillStyle = c.createPattern(GRAIN[Math.random() * 4 | 0], 'repeat');
    c.fillRect(0, 0, w, h);
    c.globalAlpha = 1;
  }
  c.globalCompositeOperation = 'destination-in';
  c.drawImage(maskFor(p, lvl), 0, 0);
}
// life from position: fills in through the dots as it rises from the bottom,
// dissolves as it reaches the top — the stream forgetting its tail.
// animated styles redraw ~11 times a second even when life holds still
function updatePics() {
  const band = innerHeight * .3, now = performance.now(), look = LOOK[STYLE];
  const animated = look.tear || look.grain;
  for (const p of pics) {
    const y = p.top - textBelt.y;
    const arrive = (innerHeight - y) / band, leave = (y + p.h) / band;
    const lvl = Math.round(Math.max(0, Math.min(1, arrive, leave)) * LEVELS);
    p.el.style.transform = `translate(${p.x}px, ${y}px)`;
    if (lvl !== p.level || (animated && lvl && now - (p.t || 0) > 90)) { drawPic(p, lvl); p.level = lvl; p.t = now; }
  }
}
for (const p of pics) p.img.onload = () => { p.level = -1; };

const label = document.createElement('div');
label.style.cssText = 'position:fixed;left:1.2em;bottom:1em;font:11px "Courier New",monospace;letter-spacing:.3em;color:var(--sea);transition:opacity 1s;opacity:0;pointer-events:none';
document.body.appendChild(label);
function setStyle(name) {
  STYLE = name;
  for (const p of pics) { p.base = null; p.level = -1; p.cv.style.filter = LOOK[name].filter; }
  label.textContent = `picture: ${name}   [1-5]`; label.style.opacity = 1;
  clearTimeout(label.t); label.t = setTimeout(() => label.style.opacity = 0, 1800);
}
addEventListener('keydown', e => { const i = +e.key - 1; if (STYLES[i]) setStyle(STYLES[i]); });
setStyle(STYLE);

// darker under the columns, clear in the gutters: pictures breathe between the text, not under it
{
  const stops = [];
  for (const b of belts) {
    const r = b.col.getBoundingClientRect(), l = r.left / innerWidth * 100, rr = r.right / innerWidth * 100;
    stops.push(`transparent ${l - 2}%`, `rgba(11,13,18,.55) ${l + 1}%`, `rgba(11,13,18,.55) ${rr - 1}%`, `transparent ${rr + 2}%`);
  }
  $('#shade').style.background = `linear-gradient(to right, ${stops.join(', ')})`;
}
// ---------------------------------------------------------------------------------

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const slow = 1 - 0.5 * decayLevel(elapsed());
  for (const b of belts) {
    b.y = (b.y + b.speed * slow * dt) % b.loop;
    b.belt.style.transform = `translateY(${-b.y}px)`;
  }
  updatePics();
  requestAnimationFrame(tick);
}

function jitter() {
  const ps = document.querySelectorAll('.belt p');
  const p = ps[Math.random() * ps.length | 0];
  p.style.transform = `translateX(${(Math.random() < .5 ? -1 : 1) * (2 + Math.random() * 6 | 0)}px)`;
  setTimeout(() => p.style.transform = '', 40 + Math.random() * 60);
  setTimeout(jitter, (900 - 700 * decayLevel(elapsed())) * Math.random() + 60);
}

// nothing for 30s, fast to ~85% by 3 min, slow crawl to the cap by ~6 min
function decayLevel(t) {
  if (t < 30) return 0;
  if (t < 180) return 0.85 * (t - 30) / 150;
  return Math.min(0.97, 0.85 + 0.12 * (t - 180) / 180);
}

// no images under the text yet, so the decay eats the ground rows only
const BAYER = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,
               3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];
const cv = $('#decay'), cx = cv.getContext('2d');
let drawnLevel = -1;
function drawDecay() {
  const lvl = decayLevel(elapsed());
  if (Math.abs(lvl - drawnLevel) > 1 / 64 || cv.width !== (innerWidth >> 1)) {
    cv.width = innerWidth >> 1; cv.height = innerHeight >> 1;
    const img = cx.createImageData(cv.width, cv.height), d = img.data;
    for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) {
      if (BAYER[(y & 7) * 8 + (x & 7)] / 64 < lvl) {
        const i = (y * cv.width + x) * 4;
        d[i] = 0x0b; d[i + 1] = 0x0d; d[i + 2] = 0x12; d[i + 3] = 255;
      }
    }
    cx.putImageData(img, 0, 0);
    drawnLevel = lvl;
  }
  setTimeout(drawDecay, 1000 / FAST);
}

function flash() {
  if (decayLevel(elapsed()) > 0.2) {
    $('#flash').animate([{ opacity: .3 }, { opacity: 0 }, { opacity: .15 }, { opacity: 0 }],
                        { duration: 700, easing: 'steps(6)' });
  }
  setTimeout(flash, 8000 + Math.random() * 14000);
}

requestAnimationFrame(tick);
jitter();
drawDecay();
flash();
</script>
</body>
</html>
