<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ｓｔｒｅａｍ</title>
<style>
  /* bekh's house palette, taken from the live stream page: violet ground, pink and cyan light */
  :root {
    --bg: #232323; --ink: #d4e3fe; --ghost: #7d8a9c; --line: #2e3547;
    --accent: #f5c8fe; --live: #c6f1fe; --lit-a: #f29bea; --lit-b: #7fe3f5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); }
  body { color: var(--ink); background: var(--bg); cursor: crosshair; }

  /* scanlines over the pictures, under the words — glass in front of the paintings */
  #glass {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
    animation: roll 120ms steps(3) infinite;
  }
  @keyframes roll { to { background-position: 0 3px; } }

  #feed { padding: 30vh 0 60vh; }
  .row {
    position: relative; display: grid; column-gap: 28px; align-items: start;
    grid-template-columns: minmax(180px, 1fr) minmax(0, 600px) minmax(180px, 1fr);
    padding: 56px 32px;
  }
  .row > .told, .row > .text, .row > .reading { position: relative; z-index: 2; }
  .told { font: 12px/1.7 "Courier New", monospace; letter-spacing: .1em; color: var(--ghost); max-width: 280px; justify-self: end; }
  .text { font: 18px/1.7 "Iowan Old Style", Palatino, Georgia, serif; }
  .text p + p { margin-top: .9em; }
  .reading { font: 13px/1.7 "Courier New", monospace; letter-spacing: .06em; color: var(--ghost);
             border-left: 1px solid var(--line); padding-left: 1.2em; max-width: 290px; }
  .when { display: block; margin-top: 1em; font: 11px "Courier New", monospace; letter-spacing: .3em; color: var(--lit-b); opacity: .7; }

  /* the painting: behind the whole row, words over it */
  .plate { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .plate img, .plate canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* fill, not cover: the murk canvases are deliberately the wrong shape (wide short bars), stretched */
  .plate canvas { image-rendering: pixelated; object-fit: fill; }
  /* the wash keeps the words readable. unfocused rows wash lighter: a murky picture doesn't fight
     the text, so it can show its colour; the focused row is sharp, so it's dimmed behind the words */
  .plate .wash { position: absolute; inset: 0; transition: background .8s; background: linear-gradient(rgba(35,35,35,.5), rgba(35,35,35,.42)); }
  .row.focus .plate .wash { background: linear-gradient(rgba(35,35,35,.72), rgba(35,35,35,.6)); }
  .plate .grain { position: absolute; inset: 0; mix-blend-mode: overlay; opacity: 0; transition: opacity .8s; pointer-events: none; }

  /* frost, dirty: heavy blur with grain pushed through it — a fogged window, not a glass pane */
  body.m-frost .plate img { filter: blur(26px) saturate(1.15) brightness(.85); transform: scale(1.12); transition: filter .9s ease, transform .9s ease; }
  body.m-frost .row.focus .plate img { filter: blur(0) saturate(1) brightness(1); transform: scale(1); }
  body.m-frost .plate .grain { opacity: .55; animation: grain .5s steps(4) infinite; }
  body.m-frost .row.focus .plate .grain { opacity: .12; }
  @keyframes grain { 25% { background-position: 37px 91px; } 50% { background-position: 170px 13px; } 75% { background-position: 88px 200px; } }
  /* signal and dots draw the murk on the canvas; the sharp picture waits underneath */
  body.m-frost .plate canvas { display: none; }
  /* bloom: the dots glow and smear into each other a little, like phosphor on an old tube */
  body.m-bloom .plate canvas { filter: blur(1.6px) saturate(1.25) brightness(1.1); }
  /* glass: the bloomed dots behind a clean pane — a light blur (tunable with [ ]) and a sheen:
     brighter at the top edge, a crisp light line along it, a dark line at the bottom. no grain */
  body { --gb: 8px; }
  body.m-glass .plate canvas { filter: blur(var(--gb)) saturate(1.35) brightness(1.12); }
  .plate .sheen { position: absolute; inset: 0; display: none; pointer-events: none; transition: opacity .8s;
    background: linear-gradient(180deg, rgba(255,255,255,.09) 0, rgba(255,255,255,.02) 22%, rgba(255,255,255,0) 60%, rgba(0,0,0,.12) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.45); }
  body.m-glass .plate .sheen { display: block; }
  body.m-glass .row.focus .plate .sheen { opacity: 0; }

  #label { position: fixed; left: 1.2em; bottom: 1em; z-index: 3; font: 11px "Courier New", monospace; letter-spacing: .3em;
           color: var(--lit-b); transition: opacity 1s; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="glass"></div>
<div id="feed"></div>
<div id="label"></div>

<!-- the snapshot as a script, not a fetch: it loads with the page, so nothing renders half-arrived -->
<script src="data/stream.js"></script>
<script>
// a snapshot of the real stream (sketch/data/stream.js, git-ignored). newest first there;
// we read down, oldest first
const $ = s => document.querySelector(s);
const MATS = ['signal', 'dots', 'frost', 'fogdots', 'bloom', 'quiet', 'glass'];
const params = new URLSearchParams(location.search);
let MAT = MATS.includes(params.get('mat')) ? params.get('mat') : 'glass';

const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const when = ts => new Date(ts * 1000).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).toLowerCase();

// grain tile shared by every plate
const grainURL = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), id = x.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255 | 0; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255; }
  x.putImageData(id, 0, 0); return c.toDataURL();
})();

const rows = [];
Promise.resolve(window.STREAM).then(d => {
  // ?skip=N starts the feed N passages in, with no auto-scroll — for screenshots, which fight scrolling
  const SKIP = +params.get('skip') || 0;
  const pages = d.pages.slice().reverse().slice(SKIP);
  if (SKIP) $('#feed').style.paddingTop = '0';
  let lastDream = null;
  for (const p of pages) {
    const row = document.createElement('section'); row.className = 'row';
    const dream = p.story && p.story.dream;
    // the told column speaks once per dream, at its first passage on screen
    const told = document.createElement('div'); told.className = 'told';
    if (dream && dream !== lastDream) told.textContent = p.story.text;
    lastDream = dream;
    const text = document.createElement('div'); text.className = 'text';
    text.innerHTML = p.text.trim().split(/\n\s*\n/).map(t => `<p>${esc(t).replace(/\n/g, '<br>')}</p>`).join('')
      + `<span class="when">${when(p.ts)}</span>`;
    const reading = document.createElement('div'); reading.className = 'reading';
    if (p.reading) reading.innerHTML = esc(p.reading.text) + `<span class="when">${when(p.reading.ts)}</span>`;
    row.append(told, text, reading);
    const r = { row, plate: null };
    if (p.plate_local) {
      const plate = document.createElement('div'); plate.className = 'plate';
      const img = new Image(); img.src = p.plate_local;
      const cv = document.createElement('canvas');
      const grain = document.createElement('div'); grain.className = 'grain'; grain.style.backgroundImage = `url(${grainURL})`;
      const wash = document.createElement('div'); wash.className = 'wash';
      const sheen = document.createElement('div'); sheen.className = 'sheen';
      plate.append(img, cv, grain, sheen, wash); row.prepend(plate);
      Object.assign(r, { plate, img, cv, step: 0, target: 0 });
      img.onload = () => { r.dither = null; paint(r); };
    }
    rows.push(r); $('#feed').appendChild(row);
  }
  // start on the first painted dream
  const first = rows.find(r => r.plate);
  if (first && !SKIP) scrollTo(0, first.row.offsetTop - innerHeight * .3);
  setMat(MAT);
  requestAnimationFrame(loop);
});

// ---- focus follows reading: the row under the middle of the screen is the one you're in ----
function focusRow() {
  const mid = innerHeight / 2;
  let best = null, bestD = Infinity;
  for (const r of rows) {
    const b = r.row.getBoundingClientRect();
    const d = b.top <= mid && b.bottom >= mid ? 0 : Math.min(Math.abs(b.top - mid), Math.abs(b.bottom - mid));
    if (d < bestD) { bestD = d; best = r; }
  }
  for (const r of rows) {
    const on = r === best;
    r.row.classList.toggle('focus', on);
    if (r.plate) r.target = on ? STEPS : 0;
  }
}

// ---- the canvas materials. step 0 = fully murky, STEPS = locked / resolved (canvas hidden) ----
const STEPS = 6;
// house colours the dots are allowed to use: nearest colour per pixel, ordered dither between them
// quiet: the same hues pulled down and toward each other, so neighbouring dots don't fight in brightness
const hexes = a => a.map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
const QUIET_PAL = hexes(['#1b1a20', '#262c3c', '#3a3155', '#6e4a72', '#3f6b78', '#7c8499']);
const DOT_PAL = ['#1e1e22', '#2e3547', '#5b4a86', '#f29bea', '#7fe3f5', '#d4e3fe']
  .map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
// the dot family: cell = dot size in px, fog = how hard the painting is fogged before dithering
// (bloom is the plain dots with a css glow on top)
const DOTS = {
  dots:    { cell: 4, pal: DOT_PAL,   fog: 0 },
  fogdots: { cell: 4, pal: DOT_PAL,   fog: 12 },
  bloom:   { cell: 4, pal: DOT_PAL,   fog: 0 },
  quiet:   { cell: 6, pal: QUIET_PAL, fog: 0 },
  glass:   { cell: 4, pal: DOT_PAL,   fog: 0 },
};

function cover(ctx, img, w, h) {
  const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  ctx.drawImage(img, (w - img.naturalWidth * s) / 2, (h - img.naturalHeight * s) / 2, img.naturalWidth * s, img.naturalHeight * s);
}

function paint(r) {
  if (!r.img || !r.img.naturalWidth) return;
  const W = r.plate.clientWidth, H = r.plate.clientHeight, k = r.step;
  if (MAT === 'frost') return;
  r.cv.style.display = k >= STEPS ? 'none' : 'block';
  if (k >= STEPS) return;
  if (MAT === 'signal') {
    // lost sync: the picture as wide, short bars. locking = bars shrink step by step until it's sharp.
    // the canvas is small and css stretches it with hard pixels — that stretch is the whole effect
    const t = 1 - k / STEPS;
    const bw = Math.max(1, Math.round(2 + 70 * t * t)), bh = Math.max(1, Math.round(1 + 5 * t));
    r.cv.width = Math.max(1, Math.round(W / bw)); r.cv.height = Math.max(1, Math.round(H / bh));
    const c = r.cv.getContext('2d'); c.imageSmoothingEnabled = true;
    cover(c, r.img, r.cv.width, r.cv.height);
  } else if (DOTS[MAT]) {
    const cfg = DOTS[MAT];
    // coarse house-palette dither over the sharp picture; resolving = dots drop away by the same
    // bayer order they'd fill in with, so the painting shows through a thinning screen
    const S = cfg.cell, w = Math.ceil(W / S), h = Math.ceil(H / S), PAL = cfg.pal;
    if (!r.dither || r.dither.width !== w || r.dither.height !== h) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d', { willReadFrequently: true });
      if (cfg.fog) {
        // fog first: shrink hard and stretch back smooth — the brush strokes are gone before the
        // dither ever sees them, so it patterns calm colour fields instead of crawling over detail.
        // (down/up-scaling, not ctx.filter, because safari's canvas blur support is shaky)
        const t = document.createElement('canvas'); t.width = Math.max(2, w / cfg.fog | 0); t.height = Math.max(2, h / cfg.fog | 0);
        const tx = t.getContext('2d'); cover(tx, r.img, t.width, t.height);
        const m = document.createElement('canvas'); m.width = Math.max(2, w / 3 | 0); m.height = Math.max(2, h / 3 | 0);
        const mx = m.getContext('2d'); mx.imageSmoothingQuality = 'high'; mx.drawImage(t, 0, 0, m.width, m.height);
        x.imageSmoothingQuality = 'high'; x.drawImage(m, 0, 0, w, h);
      } else cover(x, r.img, w, h);
      const id = x.getImageData(0, 0, w, h), d = id.data;
      for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
        const i = (y * w + xx) * 4, o = (B4[(y & 3) * 4 + (xx & 3)] / 16 - .5) * 64;
        let bi = 0, bd = Infinity;
        for (let j = 0; j < PAL.length; j++) {
          const q = PAL[j], dr = d[i] + o - q[0], dg = d[i+1] + o - q[1], db = d[i+2] + o - q[2];
          const dist = dr * dr * .3 + dg * dg * .59 + db * db * .11;
          if (dist < bd) { bd = dist; bi = j; }
        }
        const q = PAL[bi]; d[i] = q[0]; d[i+1] = q[1]; d[i+2] = q[2]; d[i+3] = 255;
      }
      r.dither = id;
    }
    r.cv.width = w; r.cv.height = h;
    const keep = 1 - k / STEPS, out = new ImageData(new Uint8ClampedArray(r.dither.data), w, h);
    for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
      if (B4[(y & 3) * 4 + (xx & 3)] / 16 >= keep) out.data[(y * w + xx) * 4 + 3] = 0;
    }
    r.cv.getContext('2d').putImageData(out, 0, 0);
  }
}

// steps move one notch every ~70ms toward their target: a lock that clicks in, not a fade
let lastStep = 0;
function loop(now) {
  focusRow();
  if (now - lastStep > 70) {
    lastStep = now;
    for (const r of rows) if (r.plate && r.step !== r.target) { r.step += Math.sign(r.target - r.step); paint(r); }
  }
  requestAnimationFrame(loop);
}

function setMat(m) {
  MAT = m;
  document.body.className = 'm-' + m;
  for (const r of rows) if (r.plate) { r.step = r.target; r.dither = null; paint(r); }
  const l = $('#label'); l.textContent = `material: ${m}   [1-7]` + (m === 'glass' ? `   blur ${GB}px  [ ]` : ''); l.style.opacity = 1;
  clearTimeout(l.t); l.t = setTimeout(() => l.style.opacity = 0, 1800);
}
let GB = params.has('gb') ? +params.get('gb') : 8;   // 8 = bekh's pick
document.body.style.setProperty('--gb', GB + 'px');
addEventListener('keydown', e => {
  const i = +e.key - 1; if (MATS[i]) return setMat(MATS[i]);
  // [ ] tune the glass blur live, so the right thickness is found by eye and read off the label
  if (e.key === '[' || e.key === ']') {
    GB = Math.max(0, Math.min(20, GB + (e.key === ']' ? 1 : -1)));
    document.body.style.setProperty('--gb', GB + 'px'); setMat(MAT);
  }
});
addEventListener('resize', () => { for (const r of rows) { r.dither = null; paint(r); } });
</script>
</body>
</html>
