<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ｄｒｅａｍ　ｓｔｒｅａｍ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="status"><span class="dot"></span><span class="what">…</span>
  <span id="flip" title="picture style"><button id="fontbtn" title="font — click next, shift-click back, or f">font</button><button id="inkbtn" title="ink — the passage's colour (c)"><span class="sw"></span>ink</button><span class="sep">·</span><button data-look="glass">glass</button><button data-look="dots">dots</button></span>
</header>
<!-- the ink panel: presets, the system colour panel, and the way back to the default. It opens
     and closes on the ink button (or esc) and on nothing else — a click anywhere would shut it
     the moment you reached for the picker. -->
<div id="inkpanel" hidden>
  <div class="swatches"></div>
  <div class="foot"><input type="color" id="inkpick" title="the system colour panel — wheel, sliders, eyedropper"><label for="inkpick">pick</label><button id="inkreset">reset</button></div>
</div>
<!-- the ribbon's tuner: opened by ?tune=ribbon and nothing else. Two sliders — the analyst's band
     height and the air around it — live as they move, remembered per browser; `reset` gives
     the stylesheet's defaults back. -->
<div id="ribbontune" hidden>
  <label class="dial">height<input type="range" id="rt-h" min="40" max="200" step="1"><output for="rt-h"></output></label>
  <label class="dial">gap<input type="range" id="rt-gap" min="0" max="48" step="1"><output for="rt-gap"></output></label>
  <label class="dial">face<input type="range" id="rt-pos" min="0" max="100" step="1"><output for="rt-pos"></output></label>
  <div class="foot"><span class="read"></span><button id="rt-reset">reset</button></div>
</div>
<main id="feed"></main>
<button id="fresh" hidden>new</button>
<div id="label"></div>
<div id="lightbox" hidden><img alt=""></div>
<!-- the manuscript: one version of the analyst's portrait, whole, over the feed. Opened by a
     press on his ribbon; closed like the lightbox — esc, a click outside the sheet, or ×. -->
<div id="manuscript" hidden>
  <button class="x" title="close (esc)">×</button>
  <article class="sheet">
    <header>
      <img class="face" src="analyst.jpg" alt="">
      <div class="meta"><span class="after"></span><span class="date"></span></div>
      <nav><button class="prev" title="earlier (←)">‹</button><span class="pos"></span><button class="next" title="later (→)">›</button></nav>
    </header>
    <p class="remark"></p>
    <div class="words"></div>
  </article>
</div>
<script src="looks.js"></script>
<script src="fonts.js"></script>
<script src="app.js"></script>
</body>
</html>
