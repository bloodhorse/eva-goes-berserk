<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme:dark)" content="#232323">
<meta name="theme-color" media="(prefers-color-scheme:light)" content="#faf4ed">
<title>loom</title>
<!-- The loom. Left pane: the document as it stands, root to current, one block per node.
     Right pane: the fan — the children of `current`, side by side, one of them about to
     become the next line of the document. Pick, prune, type, fan again.

     The skin is a reading skin and nothing else. The document is not a chat and must not
     be drawn as one: no bubbles, no borders around anybody's words, no chrome between one
     node and the next — the path root→current renders as ONE continuous text, because
     that is literally what the model is handed. Colour is the whole grammar (ghost for
     the header, lilac for his line, ice for the model's) and a 2px rule in the margin is
     the only seam. Everything that is about the tool rather than the text — the facts, the
     controls, the sibling walk — lives in a margin or a footer at 11px, out of the way of
     reading.

     Dark by default with a prefers-color-scheme light room and NO toggle: the OS already
     knows which one it is, and a switch is one more control that can be in the wrong
     position.

     The tree lives here, in `sitting`, and the whole of it is POSTed back after every
     move. The server holds no opinion about it. -->
<style>
  /* A neutral room: near-black ground, one step lighter for anything that is a panel,
     white ink, grey for everything secondary, and exactly ONE accent — spent on the send
     button and focus rings and nothing else. Nobody's words have a colour of their own:
     speakers are told apart by the band around bekh's line, not by ink, because a page
     that colours the model's words is already saying something about the model. */
  :root{
    --bg:#1c1c1f; --ink:#e8e8ea; --ghost:#9a9aa1; --line:#34343a;
    --panel:#26262a; --panel-soft:#222226; --sunk:#19191c;
    --accent:#6b7cff;
    /* posed and errors: a state you have to be able to spot without reading */
    --hot:#e0716f;
    --ctl:28px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#ffffff; --ink:#111114; --ghost:#6e6e76; --line:#e2e2e6;
      --panel:#f3f3f5; --panel-soft:#f7f7f9; --sunk:#fafafa;
      --accent:#5b6cf0;
      --hot:#c7504e;
    }
  }
  /* And that light block is the whole of the light room: there are no RULE overrides
     anywhere below. Every colour on this page is a var() off the tokens above — including
     the two that used to need patching by hand (the dead connection dot and the error
     line, both now mixes of --hot) — so the room swaps for free. Keep it that way: the
     moment a literal colour or a blend mode is written into a rule, Dawn needs a second
     copy of it, and a media query adds no specificity so that copy has to live at the
     bottom of the file or it silently loses. */

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    /* the system face: this is a page for reading a saved chat log, not a terminal */
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }

  /* ---- header ---------------------------------------------------------------------
     A rail, not a title bar: the name of the sitting, the way in and out of it, and the
     one fact the page can't infer (is there a model behind the port). Nothing centred,
     no glyph — the document below is the thing being looked at. */
  header{
    flex:0 0 auto; height:44px; padding:0 32px; display:flex; align-items:center; gap:14px;
    border-bottom:1px solid var(--line); background:var(--panel-soft);
  }
  /* one filler element, everywhere: the thing after it goes to the right edge */
  .spring{margin-left:auto;}
  .namewrap{position:relative; display:inline-flex; align-items:center; min-width:0;}
  /* the select is the sitting's NAME first and a control second, so it is drawn as text:
     no box, no arrow of its own, just the ghost caret hinting there is a list behind it. */
  #pick{
    appearance:none; -webkit-appearance:none; background:transparent; border:0; outline:none;
    color:var(--ink); font:inherit; font-size:13px; padding:2px 16px 2px 0; margin:0;
    max-width:32vw; cursor:pointer; text-overflow:ellipsis;
  }
  .caret{position:absolute; right:2px; color:var(--ghost); font-size:10px; pointer-events:none;}
  /* the dot is the connection and nothing else: ice pulse when llama answers /health,
     dull rose and still when it doesn't. */
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--accent); animation:pulse 3s ease-in-out infinite;}
  .dot.off{background:color-mix(in srgb, var(--hot) 65%, var(--bg)); animation:none;}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ---- controls -------------------------------------------------------------------- */
  /* two kinds, and only two: a word you can click (everything that is a way of looking),
     and an outline button (everything that spends the GPU or writes to the tree). */
  .ghostbtn{
    background:none; border:0; padding:0; margin:0; font:inherit; font-size:13px;
    color:var(--ghost); cursor:pointer;
  }
  .ghostbtn:hover{color:var(--ink);}
  .btn{
    background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px; font:inherit; font-size:13px; cursor:pointer;
  }
  .btn:hover{border-color:var(--ghost);}
  .btn:disabled{opacity:.4; cursor:default;}
  /* the one accent on the page: the button that spends his line */
  .btn.warm{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.warm:hover{filter:brightness(1.08);}
  input, textarea{
    background:var(--sunk); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; font:inherit; font-size:14px; outline:none;
  }
  input:focus, textarea:focus{border-color:var(--accent);}
  textarea{resize:none;}
  ::placeholder{color:var(--ghost);}
  label{font-size:13px; color:var(--ghost);}
  /* the generic field rule above would make a checkbox a padded box — put it back */
  input[type=checkbox]{width:13px; height:13px; padding:0; margin:0; border:0;
    background:transparent; accent-color:var(--accent);}

  /* the inline new-sitting box, and it is a box and not prompt(): a native dialog steals
     the window, can't be styled, and on some browsers is silently suppressed. */
  #newbox{display:none; align-items:center; gap:8px;}
  #newbox.on{display:flex;}
  #newname{width:160px; font-size:13px; padding:3px 8px;}

  /* ---- the two panes ---------------------------------------------------------------
     min-height:0 is load-bearing: a flex child defaults to min-height:auto, which lets a
     long document push the turn box below the fold on a body that refuses to scroll. */
  #panes{flex:1 1 auto; display:flex; min-height:0; min-width:0;}
  #doc{flex:1 1 55%; min-width:0; min-height:0; display:flex; flex-direction:column;
    padding:28px 32px 20px;}
  #fanpane{flex:1 1 45%; min-width:0; min-height:0; display:flex;
    border-left:1px solid var(--line); position:relative;}
  #fancol{flex:1 1 auto; min-width:0; min-height:0; display:flex; flex-direction:column;
    padding:28px 32px 20px;}

  /* ---- the document ----------------------------------------------------------------
     A reading column, capped in px so the measure stays a measure however wide the window
     gets. The blocks carry NO gap: the node texts already contain the newlines that
     separate them (that is what the model sees), and a gap here would draw a seam the
     document does not have. */
  /* --gut is the left margin the controls live in and --rim the right one the swipe lives
     in; the turn box below uses the same two so its field starts on the text's column. */
  #blocks{flex:1 1 auto; overflow-y:auto; width:100%; max-width:860px;
    --gut:72px; --rim:64px; font-size:16px; line-height:1.65;}
  .blk{position:relative; padding:0 var(--rim) 0 var(--gut);}
  .blk .body{white-space:pre-wrap; word-wrap:break-word;}
  .blk.root{color:var(--ghost);}
  /* bekh's line gets a band, the model's words sit on the bare ground. The band wraps ONLY
     his sentence: renderDoc splits the node's text into the newline before it, the line,
     and the `seat:` header after it, so the model's turn marker is never inside his
     bubble and the seams stay real newlines in the flow. */
  .blk.human .core{display:inline-block; max-width:100%; background:var(--panel);
    border-radius:10px; padding:8px 14px; margin:4px 0;}

  /* the left margin: empty until the pointer is over the block. The controls are real and
     always there, they just don't ask for attention while he is reading. */
  .blk .gut{position:absolute; left:0; top:0; width:var(--gut); padding-right:14px;
    text-align:right; opacity:0; transition:opacity 120ms ease; font-size:13px;
    line-height:1.65;}
  .blk:hover .gut, .blk .gut:focus-within{opacity:1;}

  /* the sibling walk, and it replaces the old depth strip outright: the branches you
     turned away from are not a separate map of the tree, they are alternatives to THIS
     line, so they belong beside it. ‹ and › move `current` onto the previous/next
     unpruned sibling by ts and wrap at the ends. */
  .blk .swipe{position:absolute; right:0; top:0; display:flex; align-items:center; gap:4px;
    font-size:13px; color:var(--ghost); line-height:1.65;}
  .blk .swipe .arw{background:none; border:0; padding:0; margin:0; font:inherit;
    font-size:13px; color:var(--ghost); cursor:pointer;}
  .blk .swipe .arw:hover{color:var(--ink);}

  /* the facts a node carries, and `posed`. A hairline under the words, never a row above
     them — a tag row on top of every block is what turned the document into a stack of
     receipts. */
  .foot{font-size:13px; color:var(--ghost); line-height:1.6;
    display:flex; align-items:center; gap:10px; white-space:normal;}
  /* posed: a model line bekh edited. It never comes off — the whole value of the tag is
     that a year later you can still tell which words were the model's. */
  .foot .posed{color:var(--hot);}

  /* editing in place: the textarea is the text, same size, same colour, and only a
     hairline says you are inside it. */
  .ed{width:100%; min-height:5em; font:inherit; font-size:16px; line-height:1.65;
    color:inherit; background:transparent; border:1px solid var(--line); border-radius:8px;
    padding:6px 10px;}

  /* ---- the turn box ----------------------------------------------------------------
     Drawn as the next line of the log rather than as a form: the same ghost prefix the
     human node will actually carry, then his words in his colour. It does not scroll with
     the blocks — a document you have to scroll to find the cursor in is a document you
     stop typing into. */
  /* the same margins as the text above it: the turn box is the next line of the document,
     and a next line that starts a gutter to the left of every other line reads as a form
     under the text, not as the text continuing. */
  #turnwrap{flex:0 0 auto; width:100%; max-width:860px; font-size:16px;
    padding:16px 64px 0 72px;}
  /* a composer field, the way every chat app on his phone draws one: a rounded panel, the
     name the line will carry in grey, his words in ink */
  #turnline{display:flex; align-items:flex-start; gap:8px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:12px 16px;}
  #turnline:focus-within{border-color:var(--accent);}
  #turnlab{flex:0 0 auto; color:var(--ghost); font-size:16px; line-height:1.6;}
  #turn{flex:1 1 auto; min-width:0; min-height:var(--ctl); max-height:30vh;
    background:transparent; border:0; border-radius:0; padding:0; color:var(--ink);
    font-size:16px; line-height:1.6;}
  #turnbtns{display:flex; align-items:center; gap:10px; padding-top:12px;}
  #thenwrap{display:flex; align-items:center; gap:6px; margin-left:auto; white-space:nowrap;}
  #docstat{color:var(--ghost); font-size:13px; padding-top:10px;}

  /* ---- the fan ----------------------------------------------------------------------
     Here a border IS right: these are not the document, they are candidates for it, and
     the card edge is what says "this one is still outside". */
  #fanbar{flex:0 0 auto; display:flex; align-items:center; gap:12px; padding-bottom:16px;}
  #fanbar .cap{color:var(--ghost); font-size:13px;}
  #cards{flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column; gap:12px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; cursor:pointer;}
  .card:hover{border-color:var(--ghost);}
  .card .body{color:var(--ink); font-size:15px; line-height:1.6;
    white-space:pre-wrap; word-wrap:break-word;}
  .card .foot{padding-top:8px;}
  /* the branch still being written: the same card, empty, breathing. No dots — three
     bouncing dots are a chat tell, and this thing is deliberately not a chat. */
  .card.gen{cursor:default; min-height:64px; animation:edge 1.6s ease-in-out infinite;}
  .card.gen:hover{border-color:var(--line);}
  @keyframes edge{0%,100%{border-color:var(--line)}50%{border-color:var(--ghost)}}

  .sys{color:var(--ghost); font-size:13px; padding:2px 0;}
  .sys.err{color:var(--hot);}

  /* ---- the sampler ------------------------------------------------------------------
     A drawer at the far right of the fan pane. It PUSHES the cards narrower instead of
     covering them: nothing on this page should ever be hidden behind a panel he opened to
     change one number. */
  #sampwrap{flex:0 0 auto; width:0; overflow:hidden; background:var(--panel-soft);
    border-left:1px solid transparent; transition:width 180ms ease;}
  #sampwrap.on{width:300px; border-left-color:var(--line);}
  #sampler{width:300px; height:100%; overflow-y:auto; padding:20px;
    display:flex; flex-direction:column; gap:14px;}
  #sampler .f{display:flex; flex-direction:column; gap:4px; min-width:0;}
  #sampler .f.wide{gap:6px;}
  #sampler input, #sampler textarea{width:100%;}
  #sampler .note{color:var(--ghost); font-size:13px; line-height:1.5;}

  /* ---- narrow ------------------------------------------------------------------------
     Not the shape this tool is for — reading a fan of four means having the fan and the
     document on screen at once — but it should not be broken either. The panes stack and
     the drawer goes back to covering the fan, because at this width there is nothing to
     push it into. */
  @media (max-width: 900px){
    #panes{flex-direction:column;}
    #fanpane{border-left:0; border-top:1px solid var(--line);}
    #doc, #fancol{padding:20px;}
    #sampwrap{position:absolute; right:0; top:0; bottom:0; z-index:10;}
  }
</style>
</head>
<body>
  <header>
    <span class="namewrap">
      <select id="pick" title="which sitting"></select><span class="caret">▾</span>
    </span>
    <button class="ghostbtn" id="newbtn" type="button">New</button>
    <span id="newbox">
      <input id="newname" placeholder="Name" autocomplete="off" spellcheck="false">
      <button class="ghostbtn" id="newok" type="button">Create</button>
      <button class="ghostbtn" id="newno" type="button">Cancel</button>
    </span>
    <span class="spring"></span>
    <button class="ghostbtn" id="samp" type="button">Sampler</button>
    <span class="dot off" id="dot" title="llama-server"></span>
  </header>

  <div id="panes">
    <div id="doc">
      <div id="blocks"></div>
      <div id="turnwrap">
        <div id="turnline">
          <span id="turnlab">bekh:</span>
          <textarea id="turn" rows="1" placeholder="Your line" autocomplete="off"
                    spellcheck="false"></textarea>
        </div>
        <div id="turnbtns">
          <button class="btn warm" id="send" type="button">Send</button>
          <button class="btn" id="fanbtn" type="button">Fan</button>
          <button class="btn" id="stop" type="button">Stop</button>
          <span id="thenwrap"><input type="checkbox" id="thenfan" checked><label for="thenfan">Then fan</label></span>
        </div>
        <div id="docstat"></div>
      </div>
    </div>

    <div id="fanpane">
      <div id="fancol">
        <div id="fanbar">
          <span class="cap">Candidates</span>
          <span class="spring"></span>
          <button class="btn" id="more" type="button">More</button>
        </div>
        <div id="cards"></div>
      </div>
      <aside id="sampwrap"><div id="sampler"></div></aside>
    </div>
  </div>

<script>
// ---- the shape of a sitting ----------------------------------------------------------
// The document a base model continues is not a chat: it is one text, and the tree is only
// a way of keeping several futures of that text at once. The prompt for any node is the
// concatenation of `text` along the path root→node, VERBATIM, with nothing inserted
// between blocks. Everything that looks like a turn structure — the newline, the name,
// the colon — lives inside the node texts themselves, because the model must never see a
// frame we imagined and it didn't.
// One trailing newline, not two: the turn prefix below opens with its own, and the pair
// makes exactly the one blank line a saved chat log puts between its header and the
// first message. Two here would make the model's very first document open on a gap no
// real log has.
const HEADER = 'a chat log between two friends, saved from a phone. no punctuation fixed, no capitals.\n';
// Straight off the research sheet, loop-killers on. llama's own defaults are wrong for
// this in two specific ways and both are fixed here: n_predict is -1 (infinite) out of
// the box, and dry_penalty_last_n is 64 tokens, which is useless against a loop that
// starts two thousand tokens into a transcript. It is set to the context size and NOT
// to -1: the sheet says -1 means "whole context", but llama-server 0.4.0 validates the
// field as 0..INT_MAX and answers 400 to a negative — every branch would fail before
// the model saw a token. Raise it with -c if the server ever runs a longer window.
const PARAMS = {
  n_predict: 220,
  stop: ['\nbekh:', '\nbekh :', '\n\nbekh'],
  temperature: 1.0, min_p: 0.08, top_k: 0, top_p: 1.0,
  repeat_penalty: 1.05, repeat_last_n: 512,
  dry_multiplier: 0.8, dry_base: 1.75, dry_allowed_length: 3, dry_penalty_last_n: 8192,
  fan: 4,           // loom-side; the server strips it before llama ever sees it
};
// llama EATS the stop string — it is cut out of `content` and handed back separately, so
// the document would lose the "\nbekh:" that ended the model's line. That is exactly why
// the prefix carries the newline AND the name: the human node puts back what the stop ate
// and the document stays one continuous text. Break this and every branch after the first
// runs the two speakers together on one line.
const TURN = {prefix: '\nbekh: ', suffix: '\nseat:'};
// Which numbers the sampler draws, in the order they matter. `stop`, the two turn strings
// and the fan get their own widgets below.
const FIELDS = [
  ['n_predict', 1], ['temperature', 0.05], ['min_p', 0.01], ['top_k', 1], ['top_p', 0.05],
  ['repeat_penalty', 0.01], ['repeat_last_n', 64],
  ['dry_multiplier', 0.1], ['dry_base', 0.05], ['dry_allowed_length', 1],
  ['dry_penalty_last_n', 64],
];

const $ = id => document.getElementById(id);
const blocksEl = $('blocks'), cardsEl = $('cards');
const pickEl = $('pick'), sampEl = $('sampler'), turnEl = $('turn');

// ---- state ---------------------------------------------------------------------------
let sitting = null;      // the whole tree, and the only state that matters
let shelf = [];          // what /api/sittings last said
let generation = 0;      // bumped by anything that makes a running fan stale
let running = false;

// Wrapped, all three: Safari throws on localStorage outright in a private window, and a
// page that can't remember which sitting you were in must still be a page that works.
const KEY = 'loom.sitting';
function remembered(){ try{ return localStorage.getItem(KEY) || ''; }catch(e){ return ''; } }
function remember(n){ try{ localStorage.setItem(KEY, n); }catch(e){} }

const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)))
  .map(b => b.toString(16).padStart(2, '0')).join('');

async function getJSON(url){
  const r = await fetch(url, {cache: 'no-store'});
  return await r.json();
}
async function postJSON(url, body){
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'},
                             body: JSON.stringify(body)});
  return await r.json();
}

function sys(text, err){
  const d = document.createElement('div');
  d.className = 'sys' + (err ? ' err' : '');
  d.textContent = text;          // textContent: this string can carry llama's own words
  cardsEl.appendChild(d);
  cardsEl.scrollTop = cardsEl.scrollHeight;
}

// ---- the tree ------------------------------------------------------------------------
function node(id){ return sitting.nodes[id]; }
function kids(id){
  return Object.values(sitting.nodes)
    .filter(n => n.parent === id && !n.pruned)
    .sort((a, b) => a.ts - b.ts);       // newest at the bottom, in both panes
}
function path(){
  const out = [];
  let n = node(sitting.current);
  while(n){ out.unshift(n); n = n.parent ? node(n.parent) : null; }
  return out;
}
function promptFrom(id){
  const out = [];
  let n = node(id);
  while(n){ out.unshift(n.text); n = n.parent ? node(n.parent) : null; }
  return out.join('');
}
function addNode(kind, text, parent, meta){
  const n = {id: hex(4), parent: parent, kind: kind, text: text, ts: Date.now() / 1000,
             pruned: false, posed: false, meta: meta || null};
  sitting.nodes[n.id] = n;
  return n;
}

async function save(){
  if(!sitting) return;
  const d = await postJSON('/api/sitting', sitting);
  if(d && d.error) sys('not saved: ' + d.error, true);
  else if(d && d.updated) sitting.updated = d.updated;
}

// ---- rendering -----------------------------------------------------------------------
// DOM building only, never innerHTML — fim's law, and here it is not a formality: every
// model node is a string a base model wrote, and a base model continuing a chat log will
// happily produce `<img onerror=...>` because its training set is full of them.
function facts(n){
  const bits = [];
  if(n.meta){
    if(n.meta.stop_type) bits.push(n.meta.stop_type +
      (n.meta.stopping_word ? ' ' + JSON.stringify(n.meta.stopping_word) : ''));
    if(n.meta.tokens_predicted) bits.push(n.meta.tokens_predicted + ' tok');
    if(n.meta.tps) bits.push(n.meta.tps + ' tps');
  }
  return bits.join(' · ');
}

// The hairline under a block or inside a card: what the branch cost, and whether anybody
// has touched it since. Returns null when there is nothing to say — an empty footer under
// every one of his own lines is just a ruled page.
function footLine(n, extra){
  const text = facts(n);
  if(!text && !n.posed && !(extra && extra.length)) return null;
  const f = document.createElement('div');
  f.className = 'foot';
  const left = document.createElement('span');
  left.textContent = text;
  f.appendChild(left);
  if(n.posed){
    const p = document.createElement('span');
    p.className = 'posed';
    p.textContent = 'posed';
    f.appendChild(p);
  }
  const spring = document.createElement('span');
  spring.className = 'spring';
  f.appendChild(spring);
  (extra || []).forEach(b => f.appendChild(b));
  return f;
}

// A word you can click. `stop` is not optional inside a fan card: the whole card is the
// pick target, so an edit button that let the click through would edit and then pick.
function ghostBtn(label, fn, stop){
  const b = document.createElement('button');
  b.className = 'ghostbtn';
  b.type = 'button';
  b.textContent = label;
  b.addEventListener('click', e => { if(stop) e.stopPropagation(); fn(); });
  return b;
}

// Edit in place: the block becomes a textarea, saves on blur or cmd/ctrl+enter. A model
// line that comes back changed is POSED FOREVER — the tag is the only thing standing
// between "the model said this" and "we said this and forgot", which is the one confusion
// that would make a whole sitting worthless as evidence.
function editBlock(n, body, after){
  const ta = document.createElement('textarea');
  ta.className = 'ed';
  ta.value = n.text;
  let done = false;
  const commit = async () => {
    if(done) return;
    done = true;
    if(ta.value !== n.text){
      n.text = ta.value;
      if(n.kind === 'model') n.posed = true;
      await save();
    }
    (after || render)();
  };
  ta.addEventListener('blur', commit);
  ta.addEventListener('keydown', e => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); ta.blur(); }
    if(e.key === 'Escape'){ done = true; (after || render)(); }
  });
  body.replaceWith(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

// The sibling walk. This is the only affordance for getting back into a branch he turned
// away from, and without one a pruned-nothing tree is still a tunnel. It sits on the block
// itself because that is what it is about: not "the tree has four nodes at depth 3" but
// "this line had three alternatives". Picking a sibling of an ANCESTOR truncates the
// document there, exactly as picking any node always has.
function swipe(n){
  if(!n.parent) return null;
  const sibs = kids(n.parent);
  if(sibs.length < 2) return null;
  const at = sibs.findIndex(s => s.id === n.id);
  if(at < 0) return null;
  const box = document.createElement('div');
  box.className = 'swipe';
  // wrap at both ends: with four branches, one more press of › is always a branch, and a
  // dead arrow at the edge is a control that lies about what is there.
  const go = d => pickNode(sibs[(at + d + sibs.length) % sibs.length].id);
  const arrow = (glyph, d) => {
    const b = document.createElement('button');
    b.className = 'arw';
    b.type = 'button';
    b.textContent = glyph;
    b.addEventListener('click', () => go(d));
    return b;
  };
  const count = document.createElement('span');
  count.textContent = (at + 1) + '/' + sibs.length;
  box.appendChild(arrow('‹', -1));
  box.appendChild(count);
  box.appendChild(arrow('›', 1));
  return box;
}

// A human node is one flat string — prefix + his line + suffix — and the band must wrap
// only his line: the `seat:` header after it is the model's turn marker, and the newline
// before it is the seam between two speakers. So the text goes in as three pieces that
// concatenate back to exactly n.text: bare newline, the band, bare suffix. Nothing added,
// nothing hidden — if the suffix doesn't match (an old node from before a rename), the
// whole thing goes in plain. Text nodes only, never innerHTML: this string can be his,
// but its neighbours came out of a model.
function fillBody(body, n){
  body.textContent = '';
  const suf = (sitting.turn && sitting.turn.suffix) || '';
  if(n.kind === 'human' && suf && n.text.endsWith(suf) && n.text.length > suf.length){
    const head = n.text.slice(0, -suf.length);
    const lead = head.match(/^\n*/)[0];
    const core = head.slice(lead.length);
    if(core){
      body.appendChild(document.createTextNode(lead));
      const band = document.createElement('span');
      band.className = 'core';
      band.textContent = core;
      body.appendChild(band);
      body.appendChild(document.createTextNode(suf));
      return;
    }
  }
  body.textContent = n.text;
}

function renderDoc(){
  blocksEl.textContent = '';
  for(const n of path()){
    const el = document.createElement('div');
    el.className = 'blk ' + n.kind;
    const body = document.createElement('div');
    body.className = 'body';
    fillBody(body, n);
    const gut = document.createElement('div');
    gut.className = 'gut';
    gut.appendChild(ghostBtn('Edit', () => editBlock(n, body)));
    el.appendChild(gut);
    el.appendChild(body);
    const foot = footLine(n);
    if(foot) el.appendChild(foot);
    const sw = swipe(n);
    if(sw) el.appendChild(sw);
    blocksEl.appendChild(el);
  }
  blocksEl.scrollTop = blocksEl.scrollHeight;
}

function renderFan(){
  cardsEl.textContent = '';
  const list = kids(sitting.current);
  if(!list.length && !running){
    const d = document.createElement('div');
    d.className = 'sys';
    d.textContent = 'No candidates yet.';
    cardsEl.appendChild(d);
    return;
  }
  for(const n of list){
    const el = document.createElement('div');
    el.className = 'card';
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = n.text;
    el.appendChild(body);
    el.appendChild(footLine(n, [
      ghostBtn('Edit', () => editBlock(n, body), true),
      ghostBtn('Prune', () => pruneNode(n.id), true),
    ]));
    // the card IS the pick: reading it and choosing it are the same gesture, and a pick
    // button on a card you already clicked is a second thing to aim at for nothing. The
    // guard keeps the two word-buttons and an open editor out of it.
    el.addEventListener('click', e => {
      if(e.target.closest('button, textarea')) return;
      pickNode(n.id);
    });
    cardsEl.appendChild(el);
  }
  cardsEl.scrollTop = cardsEl.scrollHeight;
}

function render(){
  if(!sitting) return;
  const total = Object.keys(sitting.nodes).length;
  const live = Object.values(sitting.nodes).filter(n => !n.pruned).length;
  $('docstat').textContent = `${live} live · ${total - live} pruned · depth ${path().length - 1}`;
  turnLabel();
  renderDoc();
  renderFan();
}

// The ghost in front of the turn box is the real prefix, trimmed — so renaming the speaker
// in the sampler shows up where he is about to type, not only in the next saved node.
function turnLabel(){
  if(!sitting) return;
  $('turnlab').textContent = (sitting.turn.prefix || '').trim() || '…';
}

// ---- moves ---------------------------------------------------------------------------
// Every one of these bumps `generation` first. A fan loop checks it between branches, so
// the instant he picks, prunes or switches, the branches still queued behind a slow
// completion stop arriving into a fan that is no longer the fan he is looking at.
async function pickNode(id){
  generation++;
  sitting.current = id;
  await save();
  render();
}
async function pruneNode(id){
  generation++;
  // Hidden, never deleted: a branch you pruned in a bad mood is evidence too, and the
  // file is text. Nothing in the page ever removes a node from `nodes`.
  node(id).pruned = true;
  await save();
  render();
}

function pending(){
  const el = document.createElement('div');
  el.className = 'card gen';
  cardsEl.appendChild(el);
  cardsEl.scrollTop = cardsEl.scrollHeight;
  return el;
}

// The fan runs HERE, in the browser, one branch at a time. Sequential and not parallel on
// purpose: llama-server has a fixed number of slots and a shared prompt cache, and four
// concurrent completions off the same prefix fight over both — slower in wall-clock than
// doing them in a row, and the cards would all land at once instead of one by one.
async function runFan(n){
  if(!sitting) return;
  const mine = ++generation;
  const from = sitting.current;
  running = true;
  $('fanbtn').disabled = $('more').disabled = $('send').disabled = true;
  try{
    for(let i = 0; i < n; i++){
      if(mine !== generation) return;
      const card = pending();
      let d;
      try{
        d = await postJSON('/api/complete', {prompt: promptFrom(from), params: sitting.params});
      }catch(e){
        card.remove();
        sys('the loom is not answering: ' + e, true);
        return;
      }
      card.remove();
      if(mine !== generation) return;
      if(d.error){
        // "cancelled" is him pressing stop, not a failure: no red line for a decision.
        if(d.error !== 'cancelled') sys(d.error, true);
        return;
      }
      addNode('model', d.text, from, {
        stop_type: d.stop_type, stopping_word: d.stopping_word,
        tokens_predicted: d.tokens_predicted, tps: d.tps,
        // Frozen: a branch is only readable later if you know what produced it, and the
        // sampler moves between fans.
        params: JSON.parse(JSON.stringify(sitting.params)),
      });
      await save();
      render();
    }
  }finally{
    running = false;
    $('fanbtn').disabled = $('more').disabled = $('send').disabled = false;
  }
}

async function sendLine(){
  if(!sitting) return;
  const typed = turnEl.value.trim();
  if(!typed) return;
  turnEl.value = '';
  grow();
  generation++;
  // prefix + typed + suffix, built here and stored as one flat string, so the document on
  // disk is a document and the two names are nothing but settings — rename "seat" in the
  // sampler and the next node carries the new name, the old ones keep theirs.
  const n = addNode('human', sitting.turn.prefix + typed + sitting.turn.suffix, sitting.current);
  sitting.current = n.id;
  await save();
  render();
  if($('thenfan').checked) runFan(sitting.params.fan || 4);
}

async function stopAll(){
  generation++;
  running = false;
  try{ await postJSON('/api/cancel', {}); }catch(e){}
  render();
}

// ---- the sampler ---------------------------------------------------------------------
// Escaped both ways, because every string in here has newlines in it and a textarea that
// showed them as real line breaks could not tell one stop string from two.
function esc(s){ return String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\t/g, '\\t'); }
function unesc(s){
  let out = '';
  for(let i = 0; i < s.length; i++){
    if(s[i] !== '\\'){ out += s[i]; continue; }
    const c = s[++i];
    out += c === 'n' ? '\n' : c === 't' ? '\t' : c === undefined ? '\\' : c;
  }
  return out;
}

function field(label, value, onchange, opts){
  const wrap = document.createElement('div');
  wrap.className = 'f' + ((opts && opts.wide) ? ' wide' : '');
  const l = document.createElement('label');
  l.textContent = label;
  const inp = document.createElement(opts && opts.rows ? 'textarea' : 'input');
  if(opts && opts.rows) inp.rows = opts.rows;
  if(opts && opts.step !== undefined){ inp.type = 'number'; inp.step = opts.step; }
  inp.value = value;
  // `change` and not `input`: every keystroke would be a POST, and a half-typed 0.0 is
  // not a temperature anybody meant.
  inp.addEventListener('change', async () => { onchange(inp.value); await save(); });
  wrap.appendChild(l); wrap.appendChild(inp);
  return wrap;
}

function buildSampler(){
  sampEl.textContent = '';
  if(!sitting) return;
  const p = sitting.params;
  for(const [key, step] of FIELDS){
    sampEl.appendChild(field(key, p[key], v => { p[key] = Number(v); }, {step}));
  }
  sampEl.appendChild(field('fan', p.fan, v => { p.fan = Math.max(1, Math.min(12, Number(v) || 1)); },
                           {step: 1}));
  sampEl.appendChild(field('turn prefix', esc(sitting.turn.prefix),
                           v => { sitting.turn.prefix = unesc(v); turnLabel(); }));
  sampEl.appendChild(field('turn suffix', esc(sitting.turn.suffix),
                           v => { sitting.turn.suffix = unesc(v); }));
  sampEl.appendChild(field('stop (one per line)', p.stop.map(esc).join('\n'),
    v => { p.stop = v.split('\n').filter(s => s.length).map(unesc); },
    {rows: 4, wide: true}));
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = 'Changes apply to the next branch.';
  sampEl.appendChild(note);
}

// ---- the shelf -----------------------------------------------------------------------
function drawShelf(){
  pickEl.textContent = '';
  for(const s of shelf){
    const o = document.createElement('option');
    o.value = s.name;
    o.textContent = s.name;
    pickEl.appendChild(o);
  }
  if(sitting) pickEl.value = sitting.name;
}

async function loadShelf(){
  const d = await getJSON('/api/sittings');
  shelf = d.sittings || [];
  drawShelf();
}

async function openSitting(name){
  const d = await getJSON('/api/sitting?name=' + encodeURIComponent(name));
  if(d.error){ sys(d.error, true); return; }
  generation++;
  sitting = d;
  remember(name);
  pickEl.value = name;
  buildSampler();
  render();
}

async function newSitting(name){
  if(!/^[A-Za-z0-9_.-]{1,64}$/.test(name)){
    sys('names are letters, digits, _ . - and up to 64 of them', true);
    return;
  }
  generation++;
  const root = {id: hex(4), parent: null, kind: 'root', text: HEADER,
                ts: Date.now() / 1000, pruned: false, posed: false, meta: null};
  // One line of scene-setting and an empty seed, and that is the whole of it. No example
  // exchanges ship with this tool: seeded lines have to be bekh's own, cut from a real
  // room, and anything we invented here would be us writing his half of the transcript.
  sitting = {
    name: name, created: Date.now() / 1000, updated: 0,
    params: JSON.parse(JSON.stringify(PARAMS)),
    turn: JSON.parse(JSON.stringify(TURN)),
    root: root.id, current: root.id, nodes: {[root.id]: root},
  };
  await save();
  remember(name);
  await loadShelf();
  pickEl.value = name;
  buildSampler();
  render();
}

// ---- wiring --------------------------------------------------------------------------
pickEl.addEventListener('change', () => openSitting(pickEl.value));
$('newbtn').addEventListener('click', () => {
  $('newbox').classList.add('on');
  $('newname').focus();
});
$('newno').addEventListener('click', () => $('newbox').classList.remove('on'));
$('newok').addEventListener('click', async () => {
  const name = $('newname').value.trim();
  $('newbox').classList.remove('on');
  $('newname').value = '';
  if(name) await newSitting(name);
});
$('newname').addEventListener('keydown', e => { if(e.key === 'Enter') $('newok').click(); });
$('samp').addEventListener('click', () => $('sampwrap').classList.toggle('on'));
$('send').addEventListener('click', sendLine);
$('fanbtn').addEventListener('click', () => runFan(sitting ? (sitting.params.fan || 4) : 4));
$('more').addEventListener('click', () => runFan(sitting ? (sitting.params.fan || 4) : 4));
$('stop').addEventListener('click', stopAll);

// Desktop page, so one level of the enter net is enough — fim states the rule at three
// levels because iOS's return key is not reliably a keydown, and none of that applies to
// a browser with a real keyboard in front of it.
turnEl.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  e.preventDefault();
  sendLine();
});
function grow(){
  turnEl.style.height = 'auto';
  turnEl.style.height = Math.min(turnEl.scrollHeight, window.innerHeight * 0.3) + 'px';
}
turnEl.addEventListener('input', grow);

async function health(){
  try{
    const d = await getJSON('/api/health');
    $('dot').classList.toggle('off', !d.ok);
  }catch(e){ $('dot').classList.add('off'); }
}

(async function start(){
  await loadShelf();
  const want = remembered();
  const name = shelf.some(s => s.name === want) ? want : (shelf[0] && shelf[0].name);
  if(name) await openSitting(name);
  else $('newbtn').click();          // an empty shelf opens with the name box waiting
  health();
  setInterval(health, 5000);
})();
</script>
</body>
</html>
