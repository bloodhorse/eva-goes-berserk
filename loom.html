<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme:dark)" content="#232323">
<meta name="theme-color" media="(prefers-color-scheme:light)" content="#faf4ed">
<title>loom</title>
<!-- The dialogue is the home screen. A fan opens a separate reading screen when its
     first answer arrives; choosing one returns to the dialogue. The tree and prompt
     remain verbatim, and the server still stores the whole sitting after every move. -->
<style>
  /* A neutral room: near-black ground, one step lighter for anything that is a panel,
     white ink, grey for everything secondary, and exactly ONE accent — spent on the send
     button and focus rings and nothing else. Nobody's words have a colour of their own:
     speakers are told apart by the band around bekh's line, not by ink, because a page
     that colours the model's words is already saying something about the model. */
  /* The room is ours, not a template's: the warm charcoal ground and blue-white ink the
     rest of the desk uses, a lilac accent instead of the indigo every chat app ships with,
     ice for the live dot, rose for posed. A hint — the layout is still a plain page. */
  :root{
    --bg:#232323; --ink:#d4e3fe; --ghost:#7d8a9c; --line:#2e3547;
    --panel:#2a2b31; --panel-soft:#272830; --sunk:#1e1e22;
    --accent:#f5c8fe; --on-accent:#232323;
    --live:#c6f1fe;
    /* posed and errors: a state you have to be able to spot without reading */
    --hot:#eb6f92;
    --ctl:28px;
  }
  /* the dawn side of the same palette: paper ground, violet ink, the accents deepened so
     they still read on white */
  @media (prefers-color-scheme: light){
    :root{
      --bg:#faf4ed; --ink:#575279; --ghost:#8f8aa3; --line:#dfdad9;
      --panel:#f2ebe3; --panel-soft:#f6f0e9; --sunk:#fffaf3;
      --accent:#907aa9; --on-accent:#faf4ed;
      --live:#56949f;
      --hot:#b4637a;
    }
  }
  /* And that light block is the whole of the light room: there are no RULE overrides
     anywhere below. Every colour on this page is a var() off the tokens above — including
     the two that used to need patching by hand (the dead connection dot and the error
     line, both now mixes of --hot) — so the room swaps for free. Keep it that way: the
     moment a literal colour or a blend mode is written into a rule, Dawn needs a second
     copy of it, and a media query adds no specificity so that copy has to live at the
     bottom of the file or it silently loses. */

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  /* iOS inflates text in landscape unless told not to; the page sizes its own type */
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{
    background:var(--bg); color:var(--ink);
    /* the system face: this is a page for reading a saved chat log, not a terminal */
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }

  [hidden]{display:none !important;}
  button, input, textarea, select{font:inherit;}
  button{cursor:pointer;}
  button:disabled{opacity:.4; cursor:default;}
  button:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:4px;}
  .spring{margin-left:auto;}
  .ghostbtn{background:none; border:0; padding:6px 0; color:var(--ghost); font-size:14px;}
  .ghostbtn:hover{color:var(--ink);}
  .ghostbtn.hot{color:var(--hot);}
  .btn, .iconbtn{background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:8px 14px;}
  .btn:hover, .iconbtn:hover{border-color:var(--ghost);}
  .iconbtn{width:42px; height:42px; padding:0; display:inline-grid; place-items:center; flex-shrink:0;}
  .iconbtn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round;}
  input, textarea, select{background:var(--sunk); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; outline:none; min-width:0;}
  input:focus, textarea:focus{border-color:var(--accent);}
  textarea{resize:none;}
  ::placeholder{color:var(--ghost);}
  label{font-size:14px; color:var(--ghost);}
  input[type=checkbox]{accent-color:var(--accent);}

  /* One corner control; the shelf and sampler only take space when requested. */
  #menubtn{position:fixed; top:max(16px, env(safe-area-inset-top));
    right:max(18px, env(safe-area-inset-right)); z-index:30; background:var(--bg);}
  #tools{position:fixed; right:max(18px, env(safe-area-inset-right)); top:68px; z-index:30;
    width:min(340px, calc(100vw - 36px)); max-height:calc(100dvh - 90px); overflow-y:auto;
    background:var(--panel-soft); border:1px solid var(--line); border-radius:14px; padding:20px;
    box-shadow:0 12px 40px color-mix(in srgb, var(--sunk) 35%, transparent);}
  .shelfrow{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  #pick{flex:1; width:100%; text-overflow:ellipsis;}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--live);}
  .dot.off{background:var(--hot);}
  .toolrow{display:flex; gap:20px; flex-wrap:wrap;}
  #tools > .ghostbtn{display:block; width:100%; text-align:left;}
  #renamebox, #askbox{display:none; flex-wrap:wrap; align-items:center; gap:12px;
    border-top:1px solid var(--line); margin-top:12px; padding-top:16px;}
  #renamebox.on, #askbox.on{display:flex;}
  #renamename{width:100%;}
  #askq{width:100%;}
  #sampwrap{display:none; border-top:1px solid var(--line); margin-top:12px; padding-top:16px;}
  #sampwrap.on{display:block;}
  #sampler{display:flex; flex-direction:column; gap:14px;}
  #sampler .f{display:flex; flex-direction:column; gap:4px;}
  #sampler input, #sampler textarea{width:100%;}
  #sampler .note{color:var(--ghost); font-size:14px;}

  /* Storage: a list of names in the menu, a + to add, and one plain note screen that
     reads like the dialogue — same measure, same size, the text exactly as pasted. */
  #storewrap{display:none; border-top:1px solid var(--line); margin-top:12px; padding-top:8px;}
  #storewrap.on{display:block;}
  .storehead{display:flex; align-items:center;}
  #noteadd{font-size:22px; line-height:1; padding:0 4px;}
  #notelist{display:flex; flex-direction:column;}
  #notelist .notelink{text-align:left; color:var(--ink); text-decoration:underline;
    text-decoration-color:var(--line); text-underline-offset:4px; overflow-wrap:anywhere;}
  #notelist .notelink:hover{text-decoration-color:var(--accent);}
  #notebar{display:flex; align-items:center; gap:16px; padding:0 56px 20px 64px; flex-shrink:0;}
  #notebar h1{font-size:16px; font-weight:500; margin:0; overflow-wrap:anywhere;}
  #notename{flex:1;}
  #noteback{background:transparent; border-color:transparent; margin-left:-10px;}
  #noteview{flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin; font-size:16px;
    line-height:1.65; padding:2px 56px 28px 64px;}
  #notetext{flex:1; min-height:0; margin:2px 56px 28px 64px; font-size:16px; line-height:1.65;}
  @media (max-width:900px){
    #notebar{padding:0 0 16px;} #noteview{padding:2px 0 20px;} #notetext{margin:2px 0 20px;}
  }
  @media (max-width:540px){
    #notebar{padding:0 0 14px; gap:10px;} #noteview{padding:2px 0 16px;} #notetext{margin:2px 0 16px;}
  }

  /* The former 55% dialogue pane, widened by about a third and centered. */
  :root{--reading: min(72vw, 1120px);}
  #panes{flex:1; display:flex; min-height:0; min-width:0;}
  #doc, #fanpane, #notepane{width:var(--reading); max-width:100%; margin:0 auto; min-height:0;
    display:flex; flex-direction:column; padding:64px 24px max(24px, env(safe-area-inset-bottom));}
  #blocks{flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin;
    --gut:64px; --rim:56px; font-size:16px; line-height:1.65;}
  .blk{position:relative; padding:0 var(--rim) 0 var(--gut);}
  .body{white-space:pre-wrap; overflow-wrap:anywhere;}
  .blk.root{color:var(--ghost);}
  .blk.human .core{display:inline-block; max-width:100%; background:var(--panel);
    border-radius:12px; padding:10px 16px; margin:6px 0;}
  .blk .gut{position:absolute; left:0; top:0; width:var(--gut); padding-right:12px;
    text-align:right; opacity:0; transition:opacity 120ms ease;}
  .blk:hover .gut, .blk:focus-within .gut{opacity:1;}
  .blk .swipe{position:absolute; right:0; top:0; display:flex; align-items:center; gap:4px;
    font-size:13px; color:var(--ghost); opacity:0;}
  .blk:hover .swipe, .blk:focus-within .swipe{opacity:1;}
  .arw{background:none; border:0; padding:6px 2px; color:var(--ghost);}
  .foot{font-size:13px; color:var(--ghost); display:flex; gap:10px;}
  .posed{color:var(--hot);}
  .ed{width:100%; min-height:5em; font-size:16px; line-height:1.65; background:transparent;}

  #turnwrap{flex-shrink:0; padding:24px 56px 0 64px;}
  #turnline{display:flex; align-items:flex-end; gap:10px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:10px 10px 10px 18px;}
  #turnline:focus-within{border-color:var(--accent);}
  #turnlab{flex-shrink:0; color:var(--ghost); font-size:16px; line-height:1.6; padding:8px 0;}
  #turn{flex:1; width:100%; min-height:42px; max-height:30dvh; background:transparent;
    border:0; border-radius:0; padding:8px 0; font-size:16px; line-height:1.6;}
  #send{background:var(--accent); color:var(--on-accent); border-color:var(--accent); border-radius:12px;}
  #send .stop-icon{display:none;}
  #send.busy .send-icon{display:none;}
  #send.busy .stop-icon{display:block;}
  #activity{color:var(--ghost); font-size:14px; padding:8px 2px 0;}
  #activity:empty{display:none;}

  /* Alternatives read top to bottom, with the same measure as the dialogue. */
  #fanbar{display:flex; align-items:center; gap:16px; padding:0 56px 20px 64px; flex-shrink:0;}
  #fanbar h1{font-size:16px; font-weight:500; margin:0;}
  #back{background:transparent; border-color:transparent; margin-left:-10px;}
  #cards{flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin;
    display:flex; flex-direction:column; gap:20px; padding:2px 56px 28px 64px;}
  .card{flex-shrink:0; background:var(--panel); border:1px solid transparent; border-radius:14px;
    padding:20px 24px; cursor:pointer;}
  .card:hover{border-color:var(--accent);}
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:0;}
  .card .body{font-size:16px; line-height:1.65;}
  .card .foot{padding-top:8px;}
  .card.gen{cursor:default; color:var(--ghost); background:transparent; font-size:14px;}
  .card.gen:hover{border-color:transparent;}
  #notice{position:fixed; bottom:max(18px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:40;
    max-width:calc(100vw - 32px); background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:12px 18px; font-size:14px;}
  #notice:empty{display:none;}
  #notice.err{color:var(--hot);}
  .sys{color:var(--ghost); font-size:14px;}

  @media (max-width:900px){
    :root{--reading:100%;}
    #doc, #fanpane, #notepane{padding:72px 20px max(20px, env(safe-area-inset-bottom));}
    /* No margins for controls once the screen narrows: at 36px the "edit" word and the
       ‹ 2/3 › walk were wider than their margin and sat on top of the text, and on a
       touch screen there is no hover to reveal them anyway. So every block becomes a
       small grid — its text, the posed tag, then one row with edit on the left and the
       sibling walk on the right, in the flow, where nothing can overlap. */
    #blocks{--gut:0px; --rim:0px;}
    .blk{display:grid; grid-template-columns:1fr auto;
      grid-template-areas:"body body" "foot foot" "gut swipe"; padding:0 0 14px;}
    .blk > .body, .blk > .ed{grid-area:body;}
    .blk > .foot{grid-area:foot;}
    .blk .gut{grid-area:gut; position:static; width:auto; padding:0; text-align:left; opacity:1;}
    .blk .swipe{grid-area:swipe; position:static; opacity:1;}
    #turnwrap{padding:20px 0 0;}
    #fanbar{padding:0 0 16px;}
    #cards{padding:2px 0 20px;}
    /* the -10px that optically aligns the arrow on desktop pushed its focus ring past
       the 12px phone margin and clipped it at the screen edge */
    #back, #noteback{margin-left:0;}
    /* On a phone the bottom is the text box: a notice pinned there covered the box and
       the send button until the error cleared. Up top, under the menu button, it covers
       one line of reading at worst and never the controls. */
    #notice{top:max(66px, calc(env(safe-area-inset-top) + 58px)); bottom:auto;
      left:16px; right:16px; transform:none; max-width:none;}
  }
  @media (max-width:540px){
    #doc, #fanpane, #notepane{padding-left:12px; padding-right:12px;}
    #turnwrap{padding:16px 0 0;}
    #fanbar{padding:0 0 14px; gap:10px;}
    #cards{padding:2px 0 16px; gap:16px;}
    .card{padding:16px 18px;}
  }
  /* Touch screens, at any width (an iPad in landscape is wider than 900 and still can't
     hover): controls that only appear on hover must just be there, and tap targets get
     room for a thumb. Fields go to 16px because iOS Safari zooms the whole page into any
     field smaller than that on focus — the room picker, rename, note name and sampler
     fields were all 14px. */
  @media (hover:none){
    .blk .gut, .blk .swipe{opacity:1;}
    .blk .gut .ghostbtn{padding:10px 14px 10px 0;}
    .arw{padding:8px 12px; font-size:18px;}
    input, select, textarea{font-size:16px;}
  }
  /* A phone on its side: ~390px tall, and the portrait 72px top gap plus the composer
     left 214px to read in. Keep just enough top to clear the fixed menu button (58px). */
  @media (max-height:500px){
    #doc, #fanpane, #notepane{padding-top:64px;}
    #turnwrap{padding-top:10px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
  /* The page speaks lowercase — every label, button, hint, message and placeholder. Done here
     and not in the strings, so a new label can't forget. Buttons and selects need it said
     outright: browsers reset text-transform on form controls instead of inheriting it.
     The document is exempt, and so is anything typed: `.body` holds his lines and the model's
     words, and a capital there is part of the text the model continues — lowercasing it on
     screen would show a document the model never saw. */
  body, button, select{text-transform:lowercase;}
  .body, .body *, input, textarea{text-transform:none;}
  ::placeholder{text-transform:lowercase;}
</style>
</head>
<body>
  <button class="iconbtn" id="menubtn" type="button" aria-label="Sitting menu" aria-expanded="false" aria-controls="tools" title="sitting menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
  </button>
  <aside id="tools" aria-label="Sitting controls" hidden>
    <div class="shelfrow">
      <select id="pick" aria-label="Which sitting"></select>
      <span class="dot off" id="dot" title="llama-server" role="img" aria-label="Model unavailable"></span>
    </div>
    <div class="toolrow">
      <button class="ghostbtn" id="newbtn" type="button" title="a new room: the chat-log header, your lines and the other side's">Basic</button>
      <button class="ghostbtn" id="newbarebtn" type="button" title="a new bare room: no header, no names, you write and it continues">Bare</button>
      <button class="ghostbtn" id="renamebtn" type="button">Rename</button>
      <button class="ghostbtn" id="clearbtn" type="button" title="start this room over; the old run is kept">Clear</button>
      <button class="ghostbtn" id="delbtn" type="button">Delete</button>
    </div>
    <button class="ghostbtn" id="choicesbtn" type="button">View alternatives</button>
    <button class="ghostbtn" id="fanbtn" type="button">Continue from here</button>
    <button class="ghostbtn" id="samp" type="button" aria-expanded="false" aria-controls="sampwrap">Sampler</button>
    <div id="askbox">
      <span id="askq"></span>
      <button class="ghostbtn hot" id="askok" type="button"></button>
      <button class="ghostbtn" id="askno" type="button">Cancel</button>
    </div>
    <div id="renamebox">
      <input id="renamename" placeholder="Room name" aria-label="Room name" maxlength="120" autocomplete="off" spellcheck="false">
      <button class="ghostbtn" id="renameok" type="button">Save name</button>
      <button class="ghostbtn" id="renameno" type="button">Cancel</button>
    </div>
    <button class="ghostbtn" id="storebtn" type="button" aria-expanded="false" aria-controls="storewrap">Storage</button>
    <div id="sampwrap"><div id="sampler"></div></div>
    <div id="storewrap">
      <div class="storehead"><span class="spring"></span>
        <button class="ghostbtn" id="noteadd" type="button" aria-label="Add a note" title="add a note">+</button>
      </div>
      <div id="notelist"></div>
    </div>
  </aside>

  <main id="panes">
    <section id="doc" aria-label="Dialogue">
      <div id="blocks"></div>
      <div id="turnwrap">
        <div id="turnline">
          <span id="turnlab">bekh:</span>
          <textarea id="turn" rows="1" placeholder="Your line" aria-label="Your message" autocomplete="off" spellcheck="false"></textarea>
          <button class="iconbtn" id="send" type="button" aria-label="Send" title="send">
            <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
            <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
        <div id="activity" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section id="fanpane" aria-label="Choose an answer" hidden>
      <div id="fanbar">
        <button class="iconbtn" id="back" type="button" aria-label="Back to dialogue" title="back to dialogue">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
        </button>
        <h1>Choose an answer</h1>
        <span class="spring"></span>
        <button class="ghostbtn" id="more" type="button">More</button>
        <button class="iconbtn" id="stop" type="button" aria-label="Stop generating" title="stop generating" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
      <div id="cards"></div>
    </section>

    <section id="notepane" aria-label="Note" hidden>
      <div id="notebar">
        <button class="iconbtn" id="noteback" type="button" aria-label="Back" title="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
        </button>
        <h1 id="notetitle"></h1>
        <input id="notename" placeholder="Name (blank = random)" aria-label="Note name" maxlength="120" autocomplete="off" spellcheck="false" hidden>
        <span class="spring"></span>
        <button class="ghostbtn" id="noteedit" type="button">Edit</button>
        <button class="ghostbtn" id="notesave" type="button" hidden>Save</button>
        <button class="ghostbtn" id="notecancel" type="button" hidden>Cancel</button>
      </div>
      <div id="noteview" class="body"></div>
      <textarea id="notetext" placeholder="Paste it here" aria-label="Note text" spellcheck="false" hidden></textarea>
    </section>
  </main>
  <div id="notice" role="status" aria-live="polite"></div>

<script>
// ---- the shape of a sitting ----------------------------------------------------------
// The document a base model continues is not a chat: it is one text, and the tree is only
// a way of keeping several futures of that text at once. The prompt for any node is the
// concatenation of `text` along the path root→node, VERBATIM, with nothing inserted
// between blocks. Everything that looks like a turn structure — the newline, the name,
// the colon — lives inside the node texts themselves, because the model must never see a
// frame we imagined and it didn't.
// One trailing newline, not two: the turn prefix below opens with its own, and the pair
// makes exactly the one blank line a saved chat log puts between its header and the
// first message. Two here would make the model's very first document open on a gap no
// real log has.
const HEADER = 'a chat log between two friends, saved from a phone. no punctuation fixed, no capitals.\n';
// Straight off the research sheet, loop-killers on. llama's own defaults are wrong for
// this in two specific ways and both are fixed here: n_predict is -1 (infinite) out of
// the box, and dry_penalty_last_n is 64 tokens, which is useless against a loop that
// starts two thousand tokens into a transcript. It is set to the context size and NOT
// to -1: the sheet says -1 means "whole context", but llama-server 0.4.0 validates the
// field as 0..INT_MAX and answers 400 to a negative — every branch would fail before
// the model saw a token. Raise it with -c if the server ever runs a longer window.
const PARAMS = {
  n_predict: 220,
  stop: ['\nbekh:', '\nbekh :', '\n\nbekh'],
  temperature: 1.0, min_p: 0.08, top_k: 0, top_p: 1.0,
  repeat_penalty: 1.05, repeat_last_n: 512,
  dry_multiplier: 0.8, dry_base: 1.75, dry_allowed_length: 3, dry_penalty_last_n: 8192,
  fan: 4,           // loom-side; the server strips it before llama ever sees it
};
// llama EATS the stop string — it is cut out of `content` and handed back separately, so
// the document would lose the "\nbekh:" that ended the model's line. That is exactly why
// the prefix carries the newline AND the name: the human node puts back what the stop ate
// and the document stays one continuous text. Break this and every branch after the first
// runs the two speakers together on one line.
const TURN = {prefix: '\nbekh: ', suffix: '\nseat:'};
// A "bare" sitting is not a mode: it is the same four settings emptied — no header, no
// names, no stop strings — so the model sees nothing but the text and continues it. Derived
// from the settings rather than stored, so flipping the prefix in the sampler mid-sitting
// flips the behaviour with it and the file never carries a flag that can disagree.
const bare = () => !!sitting && !(sitting.turn.prefix || sitting.turn.suffix);
// Which numbers the sampler draws, in the order they matter. `stop`, the two turn strings
// and the fan get their own widgets below.
const FIELDS = [
  ['n_predict', 1], ['temperature', 0.05], ['min_p', 0.01], ['top_k', 1], ['top_p', 0.05],
  ['repeat_penalty', 0.01], ['repeat_last_n', 64],
  ['dry_multiplier', 0.1], ['dry_base', 0.05], ['dry_allowed_length', 1],
  ['dry_penalty_last_n', 64],
];

const $ = id => document.getElementById(id);
const blocksEl = $('blocks'), cardsEl = $('cards');
const pickEl = $('pick'), sampEl = $('sampler'), turnEl = $('turn');

// ---- state ---------------------------------------------------------------------------
let sitting = null;      // the whole tree, and the only state that matters
let shelf = [];          // what /api/sittings last said
let generation = 0;      // bumped by anything that makes a running fan stale
let running = false;
let stopping = false;
let choosing = false;
let fanFrom = null;
let cancelTask = null;
let saving = false;
let saveQueue = Promise.resolve();

// Wrapped, all three: Safari throws on localStorage outright in a private window, and a
// page that can't remember which sitting you were in must still be a page that works.
const KEY = 'loom.sitting';
function remembered(){ try{ return localStorage.getItem(KEY) || ''; }catch(e){ return ''; } }
function remember(n){ try{ localStorage.setItem(KEY, n); }catch(e){} }

const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)))
  .map(b => b.toString(16).padStart(2, '0')).join('');

async function getJSON(url){
  const r = await fetch(url, {cache: 'no-store'});
  return await r.json();
}
async function postJSON(url, body){
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'},
                             body: JSON.stringify(body)});
  return await r.json();
}

function sys(text, err){
  $('notice').textContent = text;
  $('notice').classList.toggle('err', !!err);
}
function menu(open){
  $('tools').hidden = !open;
  $('menubtn').setAttribute('aria-expanded', String(open));
  if(!open) $('renamebox').classList.remove('on');
}
function showDialogue(){
  choosing = false;
  $('doc').hidden = false;
  $('fanpane').hidden = true;
  $('notepane').hidden = true;
  turnEl.focus({preventScroll:true});
}
function showChoices(from){
  const entering = !choosing || fanFrom !== from;
  fanFrom = from;
  choosing = true;
  menu(false);
  $('doc').hidden = true;
  $('fanpane').hidden = false;
  $('notepane').hidden = true;
  renderFan();
  if(entering){
    cardsEl.scrollTop = 0;
    $('back').focus({preventScroll:true});
  }
}
function alternativesFrom(){
  if(!sitting) return null;
  if(kids(sitting.current).some(n => n.kind === 'model')) return sitting.current;
  const n = node(sitting.current);
  return n.kind === 'model' ? n.parent : null;
}

// ---- storage -------------------------------------------------------------------------
// Findings, one plain text file each, nothing to do with the sitting that is open: none of
// this touches `sitting`, `generation` or the tree. `note` is what the note screen shows,
// or null while a new one is being written.
let note = null;

async function loadNotes(){
  const list = $('notelist');
  let d;
  try{ d = await getJSON('/api/notes'); }
  catch(e){ sys('storage is not answering: ' + e.message, true); return; }
  list.textContent = '';
  const rows = (d && d.notes) || [];
  if(!rows.length){
    const s = document.createElement('div');
    s.className = 'sys';
    s.textContent = 'Nothing stored yet.';
    list.appendChild(s);
  }
  for(const r of rows){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ghostbtn notelink';
    b.textContent = r.name;
    b.addEventListener('click', () => openNote(r.name));
    list.appendChild(b);
  }
}

function showNote(){
  choosing = false;
  menu(false);
  $('doc').hidden = true;
  $('fanpane').hidden = true;
  $('notepane').hidden = false;
}

// Reading and writing are the same screen with the words swapped; the name field shows
// only for a new note, because an existing note's name is its file and edit keeps it.
function noteMode(editing){
  const fresh = editing && !note;
  $('noteview').hidden = editing;
  $('notetext').hidden = !editing;
  $('noteedit').hidden = editing;
  $('notesave').hidden = !editing;
  $('notecancel').hidden = !editing;
  $('notename').hidden = !fresh;
  $('notetitle').hidden = fresh;
}

async function openNote(name){
  let d;
  try{ d = await getJSON('/api/note?name=' + encodeURIComponent(name)); }
  catch(e){ sys('could not open the note: ' + e.message, true); return; }
  if(d.error){ sys(d.error, true); return; }
  note = {name: d.name, text: d.text};
  $('notetitle').textContent = note.name;
  $('noteview').textContent = note.text;       // textContent: pasted text is never markup
  noteMode(false);
  showNote();
}

function newNote(){
  note = null;
  $('notename').value = '';
  $('notetext').value = '';
  noteMode(true);
  showNote();
  $('notename').focus();
}

function editNote(){
  if(!note) return;
  $('notetext').value = note.text;
  noteMode(true);
  $('notetext').focus();
}

async function saveNote(){
  const text = $('notetext').value;
  const body = note ? {name: note.name, text: text, create: false}
                    : {name: $('notename').value.trim(), text: text, create: true};
  let d;
  try{ d = await postJSON('/api/note', body); }
  catch(e){ sys('not saved: ' + e.message, true); return; }
  // On a refusal (a taken name) the screen stays as it is, text and all, so nothing
  // pasted is lost to a wrong name.
  if(d.error){ sys(d.error, true); return; }
  sys('');
  await openNote(d.name);
  loadNotes();
}

function cancelNote(){
  if(note) noteMode(false);
  else showDialogue();
}

// ---- the tree ------------------------------------------------------------------------
function node(id){ return sitting.nodes[id]; }
function kids(id){
  return Object.values(sitting.nodes)
    .filter(n => n.parent === id && !n.pruned)
    .sort((a, b) => a.ts - b.ts);       // newest at the bottom, in both panes
}
function path(){
  const out = [];
  let n = node(sitting.current);
  while(n){ out.unshift(n); n = n.parent ? node(n.parent) : null; }
  return out;
}
function promptFrom(id){
  const out = [];
  let n = node(id);
  while(n){ out.unshift(n.text); n = n.parent ? node(n.parent) : null; }
  return out.join('');
}
function addNode(kind, text, parent, meta){
  const n = {id: hex(4), parent: parent, kind: kind, text: text, ts: Date.now() / 1000,
             pruned: false, posed: false, meta: meta || null};
  sitting.nodes[n.id] = n;
  return n;
}

// A pick can happen while the previous candidate is still saving. Queue snapshots so
// an older write can never overwrite the selected path, or write into a different room.
function save(){
  if(!sitting) return Promise.resolve(true);
  const owner = sitting;
  const snapshot = JSON.parse(JSON.stringify(owner));
  const job = saveQueue.then(async () => {
    try{
      const d = await postJSON('/api/sitting', snapshot);
      if(d && d.error) throw new Error(d.error);
      if(d && d.updated) owner.updated = d.updated;
      return true;
    }catch(e){
      sys('Not saved: ' + e.message, true);
      return false;
    }
  });
  saveQueue = job;
  return job;
}

// ---- rendering -----------------------------------------------------------------------
// DOM building only, never innerHTML — fim's law, and here it is not a formality: every
// model node is a string a base model wrote, and a base model continuing a chat log will
// happily produce `<img onerror=...>` because its training set is full of them.
// Sampling metadata stays in the file. Only an edited model line needs a visible mark.
function footLine(n){
  if(!n.posed) return null;
  const f = document.createElement('div');
  f.className = 'foot';
  const p = document.createElement('span');
  p.className = 'posed';
  p.textContent = 'posed';
  f.appendChild(p);
  return f;
}

// A word you can click. `stop` is not optional inside a fan card: the whole card is the
// pick target, so an edit button that let the click through would edit and then pick.
function ghostBtn(label, fn, stop){
  const b = document.createElement('button');
  b.className = 'ghostbtn';
  b.type = 'button';
  b.textContent = label;
  b.addEventListener('click', e => { if(stop) e.stopPropagation(); fn(); });
  return b;
}

// Edit in place: the block becomes a textarea, saves on blur or cmd/ctrl+enter. A model
// line that comes back changed is POSED FOREVER — the tag is the only thing standing
// between "the model said this" and "we said this and forgot", which is the one confusion
// that would make a whole sitting worthless as evidence.
function editBlock(n, body, after){
  if(saving || stopping) return;
  const ta = document.createElement('textarea');
  ta.className = 'ed';
  ta.value = n.text;
  let done = false;
  const commit = async () => {
    if(done) return;
    done = true;
    if(ta.value !== n.text){
      n.text = ta.value;
      if(n.kind === 'model') n.posed = true;
      await save();
    }
    (after || render)();
  };
  ta.addEventListener('blur', commit);
  ta.addEventListener('keydown', e => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); ta.blur(); }
    if(e.key === 'Escape'){ done = true; (after || render)(); }
  });
  body.replaceWith(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

// The sibling walk. This is the only affordance for getting back into a branch he turned
// away from, and without one a pruned-nothing tree is still a tunnel. It sits on the block
// itself because that is what it is about: not "the tree has four nodes at depth 3" but
// "this line had three alternatives". Picking a sibling of an ANCESTOR truncates the
// document there, exactly as picking any node always has.
function swipe(n){
  if(!n.parent) return null;
  const sibs = kids(n.parent);
  if(sibs.length < 2) return null;
  const at = sibs.findIndex(s => s.id === n.id);
  if(at < 0) return null;
  const box = document.createElement('div');
  box.className = 'swipe';
  // wrap at both ends: with four branches, one more press of › is always a branch, and a
  // dead arrow at the edge is a control that lies about what is there.
  const go = d => pickNode(sibs[(at + d + sibs.length) % sibs.length].id);
  const arrow = (glyph, d) => {
    const b = document.createElement('button');
    b.className = 'arw';
    b.type = 'button';
    b.textContent = glyph;
    b.addEventListener('click', () => go(d));
    return b;
  };
  const count = document.createElement('span');
  count.textContent = (at + 1) + '/' + sibs.length;
  box.appendChild(arrow('‹', -1));
  box.appendChild(count);
  box.appendChild(arrow('›', 1));
  return box;
}

// A human node is one flat string — prefix + his line + suffix — and the band must wrap
// only his line: the `seat:` header after it is the model's turn marker, and the newline
// before it is the seam between two speakers. So the text goes in as three pieces that
// concatenate back to exactly n.text: bare newline, the band, bare suffix. Nothing added,
// nothing hidden — if the suffix doesn't match (an old node from before a rename), the
// whole thing goes in plain. Text nodes only, never innerHTML: this string can be his,
// but its neighbours came out of a model.
function fillBody(body, n){
  body.textContent = '';
  const suf = (sitting.turn && sitting.turn.suffix) || '';
  // No suffix (a bare sitting) still gets the band: whose words are whose is the one piece
  // of structure a bare document keeps, and it lives in the page, never in the text.
  if(n.kind === 'human' && (!suf || (n.text.endsWith(suf) && n.text.length > suf.length))){
    const head = suf ? n.text.slice(0, -suf.length) : n.text;
    const lead = head.match(/^\n*/)[0];
    const core = head.slice(lead.length);
    if(core){
      body.appendChild(document.createTextNode(lead));
      const band = document.createElement('span');
      band.className = 'core';
      band.textContent = core;
      body.appendChild(band);
      body.appendChild(document.createTextNode(suf));
      return;
    }
  }
  body.textContent = n.text;
}

function renderDoc(){
  blocksEl.textContent = '';
  for(const n of path()){
    const el = document.createElement('div');
    if(n.kind === 'root' && !n.text) continue;
    el.className = 'blk ' + n.kind;
    const body = document.createElement('div');
    body.className = 'body';
    fillBody(body, n);
    const gut = document.createElement('div');
    gut.className = 'gut';
    gut.appendChild(ghostBtn('Edit', () => editBlock(n, body)));
    el.appendChild(gut);
    el.appendChild(body);
    const foot = footLine(n);
    if(foot) el.appendChild(foot);
    const sw = swipe(n);
    if(sw) el.appendChild(sw);
    blocksEl.appendChild(el);
  }
  blocksEl.scrollTop = blocksEl.scrollHeight;
}

function renderFan(){
  const scroll = cardsEl.scrollTop;
  const focused = document.activeElement && document.activeElement.dataset.node;
  cardsEl.textContent = '';
  if(!sitting || !fanFrom) return;
  const list = kids(fanFrom).filter(n => n.kind === 'model');
  if(!list.length && !running){
    const d = document.createElement('div');
    d.className = 'sys';
    d.textContent = 'No answers yet.';
    cardsEl.appendChild(d);
  }
  for(const [i, n] of list.entries()){
    const el = document.createElement('div');
    el.className = 'card';
    el.tabIndex = 0;
    el.dataset.node = n.id;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', 'Choose answer ' + (i + 1));
    const body = document.createElement('div');
    body.className = 'body';
    body.id = 'answer-' + n.id;
    body.textContent = n.text || '(empty continuation)';
    el.setAttribute('aria-describedby', body.id);
    el.appendChild(body);
    const foot = footLine(n);
    if(foot) el.appendChild(foot);
    el.addEventListener('click', () => {
      // Selecting a passage to copy it is not choosing the answer.
      if(window.getSelection().toString()) return;
      pickNode(n.id);
    });
    el.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pickNode(n.id); }
    });
    cardsEl.appendChild(el);
    if(focused === n.id) el.focus({preventScroll:true});
  }
  if(running && !stopping) pending();
  cardsEl.scrollTop = scroll;
}

function gate(){
  const on = !!sitting;
  turnEl.disabled = !on || saving;
  $('send').disabled = !on || stopping || saving || (!running && !turnEl.value.length);
  $('send').classList.toggle('busy', running || stopping);
  $('send').setAttribute('aria-label', stopping ? 'Stopping' : running ? 'Stop generating' : 'Send');
  $('send').title = $('send').getAttribute('aria-label').toLowerCase();
  $('fanbtn').disabled = $('more').disabled = !on || running || stopping || saving;
  for(const id of ['pick', 'newbtn', 'newbarebtn', 'clearbtn', 'delbtn', 'renameok', 'renameno']) $(id).disabled = stopping || saving;
  $('clearbtn').disabled ||= !on;
  $('delbtn').disabled ||= !on;
  $('renamebtn').disabled = !on || running || stopping || saving;
  $('renamename').disabled = saving;
  $('choicesbtn').disabled = !on || !alternativesFrom();
  $('stop').hidden = !running && !stopping;
  $('more').hidden = running || stopping;
  $('stop').disabled = stopping;
  turnEl.placeholder = !on ? 'Open the menu to start a sitting' : bare() ? 'Text to continue' : 'Your line';
  $('activity').textContent = stopping ? 'Stopping…' : running ? 'Writing alternatives…' : '';
}

function render(){
  gate();
  if(!sitting) return;
  turnLabel();
  renderDoc();
  if(choosing) renderFan();
}

// The ghost in front of the turn box is the real prefix, trimmed — so renaming the speaker
// in the sampler shows up where he is about to type, not only in the next saved node.
function turnLabel(){
  if(!sitting) return;
  $('turnlab').textContent = (sitting.turn.prefix || '').trim() || '…';
}

// ---- moves ---------------------------------------------------------------------------
async function pickNode(id){
  if(!sitting || stopping || saving) return;
  const cancelled = stopAll();
  sitting.current = id;
  fanFrom = null;
  showDialogue();
  render();
  await save();
  await cancelled;
}

function pending(){
  const el = document.createElement('div');
  el.className = 'card gen';
  el.setAttribute('role', 'status');
  el.textContent = 'Writing another answer…';
  cardsEl.appendChild(el);
}

// Sequential requests share llama's prompt cache. Open the picker on the first answer,
// then append without scrolling away from the answer currently being read.
async function runFan(n, from = sitting && sitting.current){
  if(!sitting || !from || running || stopping || saving) return;
  sys('');
  const mine = ++generation;
  const owner = sitting;
  const params = JSON.parse(JSON.stringify(sitting.params));
  const prompt = promptFrom(from);
  fanFrom = from;
  running = true;
  menu(false);
  gate();
  if(choosing) renderFan();
  try{
    for(let i = 0; i < n; i++){
      if(mine !== generation || sitting !== owner) return;
      const d = await postJSON('/api/complete', {prompt, params});
      if(mine !== generation || sitting !== owner) return;
      if(d.error){
        if(d.error !== 'cancelled') sys(d.error, true);
        return;
      }
      addNode('model', d.text, from, {
        stop_type: d.stop_type, stopping_word: d.stopping_word,
        tokens_predicted: d.tokens_predicted, tps: d.tps,
        params: JSON.parse(JSON.stringify(params)),
      });
      showChoices(from);
      if(!await save()) return;
      if(mine !== generation || sitting !== owner) return;
      gate();
    }
  }catch(e){
    if(mine === generation) sys('The loom is not answering: ' + e.message, true);
  }finally{
    // An old cancelled loop must not unlock controls belonging to a later request.
    if(mine === generation){
      running = false;
      gate();
      if(choosing) renderFan();
    }
  }
}

async function sendLine(){
  if(!sitting || running || stopping || saving) return;
  const typed = bare() ? turnEl.value : turnEl.value.trim();
  if(!typed) return;
  sys('');
  saving = true;
  turnEl.value = '';
  grow();
  generation++;
  const n = addNode('human', sitting.turn.prefix + typed + sitting.turn.suffix, sitting.current);
  sitting.current = n.id;
  render();
  const saved = await save();
  saving = false;
  gate();
  if(saved) runFan(sitting.params.fan || 4);
}

function stopAll(){
  if(cancelTask) return cancelTask;
  generation++;
  if(!running) return Promise.resolve();
  stopping = true;
  gate();
  cancelTask = (async () => {
    try{ await postJSON('/api/cancel', {}); }
    catch(e){ sys('Could not confirm the stop: ' + e.message, true); }
    finally{
      running = false;
      stopping = false;
      cancelTask = null;
      gate();
      if(choosing) renderFan();
    }
  })();
  return cancelTask;
}

// ---- the sampler ---------------------------------------------------------------------
// Escaped both ways, because every string in here has newlines in it and a textarea that
// showed them as real line breaks could not tell one stop string from two.
function esc(s){ return String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\t/g, '\\t'); }
function unesc(s){
  let out = '';
  for(let i = 0; i < s.length; i++){
    if(s[i] !== '\\'){ out += s[i]; continue; }
    const c = s[++i];
    out += c === 'n' ? '\n' : c === 't' ? '\t' : c === undefined ? '\\' : c;
  }
  return out;
}

function field(label, value, onchange, opts){
  const wrap = document.createElement('div');
  wrap.className = 'f' + ((opts && opts.wide) ? ' wide' : '');
  const l = document.createElement('label');
  l.textContent = label;
  const inp = document.createElement(opts && opts.rows ? 'textarea' : 'input');
  if(opts && opts.rows) inp.rows = opts.rows;
  if(opts && opts.step !== undefined){ inp.type = 'number'; inp.step = opts.step; }
  inp.id = 'setting-' + label.replace(/[^a-z0-9]+/gi, '-');
  l.htmlFor = inp.id;
  inp.value = value;
  // `change` and not `input`: every keystroke would be a POST, and a half-typed 0.0 is
  // not a temperature anybody meant.
  inp.addEventListener('change', async () => { onchange(inp.value); await save(); });
  wrap.appendChild(l); wrap.appendChild(inp);
  return wrap;
}

function buildSampler(){
  sampEl.textContent = '';
  if(!sitting) return;
  const p = sitting.params;
  for(const [key, step] of FIELDS){
    sampEl.appendChild(field(key, p[key], v => { p[key] = Number(v); }, {step}));
  }
  sampEl.appendChild(field('fan', p.fan, v => { p.fan = Math.max(1, Math.min(12, Number(v) || 1)); },
                           {step: 1}));
  sampEl.appendChild(field('turn prefix', esc(sitting.turn.prefix),
                           v => { sitting.turn.prefix = unesc(v); turnLabel(); }));
  sampEl.appendChild(field('turn suffix', esc(sitting.turn.suffix),
                           v => { sitting.turn.suffix = unesc(v); }));
  sampEl.appendChild(field('stop (one per line)', p.stop.map(esc).join('\n'),
    v => { p.stop = v.split('\n').filter(s => s.length).map(unesc); },
    {rows: 4, wide: true}));
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = 'Changes apply to the next branch.';
  sampEl.appendChild(note);
}

// ---- the shelf -----------------------------------------------------------------------
function drawShelf(){
  pickEl.textContent = '';
  for(const s of shelf){
    const o = document.createElement('option');
    o.value = s.name;
    o.textContent = s.title || s.name;
    pickEl.appendChild(o);
  }
  if(sitting) pickEl.value = sitting.name;
}

async function loadShelf(){
  const d = await getJSON('/api/sittings');
  shelf = d.sittings || [];
  drawShelf();
}

async function openSitting(name){
  await stopAll();
  await saveQueue;
  const d = await getJSON('/api/sitting?name=' + encodeURIComponent(name));
  if(d.error){ sys(d.error, true); return; }
  generation++;
  sitting = d;
  fanFrom = null;
  turnEl.value = '';
  grow();
  showDialogue();
  menu(false);
  remember(name);
  pickEl.value = name;
  buildSampler();
  render();
}

// A random file ID is permanent; the optional title can change without moving a tree.
async function newSitting(isBare = false){
  if(saving || stopping) return;
  saving = true;
  gate();
  try{
    await stopAll();
    await saveQueue;
    await loadShelf();
    let name;
    do { name = hex(6); } while(shelf.some(s => s.name === name));
    const root = {id: hex(4), parent: null, kind: 'root', text: isBare ? '' : HEADER,
                  ts: Date.now() / 1000, pruned: false, posed: false, meta: null};
    const fresh = {
      name, created: Date.now() / 1000, updated: 0,
      params: JSON.parse(JSON.stringify(PARAMS)),
      turn: isBare ? {prefix: '', suffix: ''} : JSON.parse(JSON.stringify(TURN)),
      root: root.id, current: root.id, nodes: {[root.id]: root},
    };
    if(isBare) fresh.params.stop = [];
    const d = await postJSON('/api/sitting', fresh);
    if(d.error) throw new Error(d.error);
    fresh.updated = d.updated || 0;
    // Keep the previous room and draft until the new file has actually been written.
    sitting = fresh;
    fanFrom = null;
    turnEl.value = '';
    grow();
    remember(name);
    shelf.unshift({name, updated: fresh.updated});
    drawShelf();
    buildSampler();
    $('renamebox').classList.remove('on');
    $('askbox').classList.remove('on');
    sys('');
    menu(false);
    showDialogue();
  }catch(e){
    sys('Could not create the room: ' + e.message, true);
  }finally{
    saving = false;
    render();
    if($('tools').hidden) turnEl.focus();
  }
}

async function renameSitting(){
  if(!sitting || running || stopping || saving) return;
  const title = $('renamename').value.trim();
  if(!title || title.length > 120){
    sys('Use a name between 1 and 120 characters.', true);
    return;
  }
  saving = true;
  gate();
  const owner = sitting;
  const previous = owner.title;
  try{
    await saveQueue;
    owner.title = title;
    if(!await save()){
      if(previous === undefined) delete owner.title;
      else owner.title = previous;
      return;
    }
    const row = shelf.find(s => s.name === owner.name);
    if(row) row.title = title;
    drawShelf();
    $('renamebox').classList.remove('on');
    sys('');
    menu(false);
  }finally{
    saving = false;
    gate();
    if($('tools').hidden && !choosing) turnEl.focus();
  }
}

// Delete is for sittings made by mistake. The server moves the file to sittings/.trash,
// it never unlinks. `sitting` goes null BEFORE the request, so a fan still finishing a
// branch can't save() the tree back onto the shelf a second after it left.
async function deleteSitting(){
  if(!sitting) return;
  const name = sitting.name;
  await stopAll();
  await saveQueue;
  fanFrom = null;
  showDialogue();
  sitting = null;
  const d = await postJSON('/api/delete', {name: name});
  if(d && d.error){
    // failed = the file is still on the shelf: go back to it, and say so AFTER the
    // reopen, or the render wipes the red line before he ever sees it
    await openSitting(name);
    sys('delete failed: ' + d.error, true);
    return;
  }
  await loadShelf();
  if(shelf.length){ await openSitting(shelf[0].name); return; }
  blocksEl.textContent = ''; cardsEl.textContent = ''; sampEl.textContent = '';
  render();
  menu(true);
}

// Clear = the same room, run again. Name, header line, turn strings and sampler stay; the
// tree goes back to its root alone. The server copies the whole run into sittings/.trash
// FIRST, and if that copy fails nothing is reset — a clear that loses the old run is a
// delete with a friendlier label. The root node itself is kept, not rebuilt, so a header
// he edited by hand survives the clear.
async function clearSitting(){
  if(!sitting) return;
  await stopAll();
  await saveQueue;
  fanFrom = null;
  showDialogue();
  const d = await postJSON('/api/clear', {name: sitting.name});
  if(d && d.error){ sys('clear failed, nothing was reset: ' + d.error, true); return; }
  const root = node(sitting.root);
  sitting.nodes = {[root.id]: root};
  sitting.current = root.id;
  await save();
  render();
  turnEl.focus();
}

// ---- wiring --------------------------------------------------------------------------
pickEl.addEventListener('change', () => openSitting(pickEl.value));
$('newbtn').addEventListener('click', () => newSitting());
$('newbarebtn').addEventListener('click', () => newSitting(true));
$('renamebtn').addEventListener('click', () => {
  if(!sitting) return;
  $('askbox').classList.remove('on');
  $('renamename').value = sitting.title || sitting.name;
  $('renamebox').classList.add('on');
  $('renamename').focus();
  $('renamename').select();
});
$('renameno').addEventListener('click', () => $('renamebox').classList.remove('on'));
$('renameok').addEventListener('click', renameSitting);
$('renamename').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); renameSitting(); }
  if(e.key === 'Escape'){
    e.preventDefault();
    $('renamebox').classList.remove('on');
    $('renamebtn').focus();
  }
});
// One confirm box for both, holding whichever action asked last.
let asked = null;
function ask(question, yes, action){
  if(!sitting) return;
  $('renamebox').classList.remove('on');
  $('askq').textContent = question;
  $('askok').textContent = yes;
  asked = action;
  $('askbox').classList.add('on');
}
// No confirm on Clear: the old run is copied to .trash before anything resets, so the
// button is already undoable and a question in front of it is only friction. Delete keeps
// its question — that one takes the room off the shelf.
$('clearbtn').addEventListener('click', () => {
  $('askbox').classList.remove('on'); asked = null;
  clearSitting();
});
$('delbtn').addEventListener('click', () =>
  sitting && ask(`Delete “${sitting.title || sitting.name}”?`, 'Yes, delete', deleteSitting));
$('askno').addEventListener('click', () => { $('askbox').classList.remove('on'); asked = null; });
$('askok').addEventListener('click', async () => {
  $('askbox').classList.remove('on');
  const act = asked; asked = null;
  if(act) await act();
});
$('storebtn').addEventListener('click', () => {
  const on = !$('storewrap').classList.contains('on');
  $('storewrap').classList.toggle('on', on);
  $('storebtn').setAttribute('aria-expanded', String(on));
  if(on) loadNotes();
});
$('noteadd').addEventListener('click', newNote);
$('noteback').addEventListener('click', showDialogue);
$('noteedit').addEventListener('click', editNote);
$('notesave').addEventListener('click', saveNote);
$('notecancel').addEventListener('click', cancelNote);
$('menubtn').addEventListener('click', () => menu($('tools').hidden));
document.addEventListener('click', e => {
  if(!e.target.closest('#tools, #menubtn')) menu(false);
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape' || e.defaultPrevented || e.target.closest('.ed')) return;
  if(!$('tools').hidden){ menu(false); $('menubtn').focus(); }
  else if(choosing){ showDialogue(); stopAll(); }
});
$('samp').addEventListener('click', () => {
  const open = $('sampwrap').classList.toggle('on');
  $('samp').setAttribute('aria-expanded', String(open));
});
$('send').addEventListener('click', () => running ? stopAll() : sendLine());
$('fanbtn').addEventListener('click', () => runFan(sitting ? (sitting.params.fan || 4) : 4));
$('choicesbtn').addEventListener('click', () => {
  const from = alternativesFrom();
  if(from) showChoices(from);
});
$('more').addEventListener('click', () => runFan(sitting ? (sitting.params.fan || 4) : 4, fanFrom));
$('stop').addEventListener('click', stopAll);
$('back').addEventListener('click', () => { showDialogue(); stopAll(); });

// Desktop page, so one level of the enter net is enough — fim states the rule at three
// levels because iOS's return key is not reliably a keydown, and none of that applies to
// a browser with a real keyboard in front of it.
// On a phone the return key is the only way to type a line break, and in a bare room a
// line break is text. So on a touch screen return inserts a newline and the send button
// sends; with a real keyboard return sends and shift+return breaks the line.
const TOUCH = window.matchMedia('(hover: none) and (pointer: coarse)');
turnEl.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || e.shiftKey || e.isComposing || TOUCH.matches) return;
  e.preventDefault();
  sendLine();
});
function grow(){
  turnEl.style.height = 'auto';
  turnEl.style.height = Math.min(turnEl.scrollHeight, window.innerHeight * 0.3) + 'px';
}
turnEl.addEventListener('input', () => { grow(); gate(); });

async function health(){
  try{
    const d = await getJSON('/api/health');
    $('dot').classList.toggle('off', !d.ok);
    $('dot').setAttribute('aria-label', d.ok ? 'Model available' : 'Model unavailable');
  }catch(e){ $('dot').classList.add('off'); $('dot').setAttribute('aria-label', 'Model unavailable'); }
}

(async function start(){
  try{
  await loadShelf();
  const want = remembered();
  const name = shelf.some(s => s.name === want) ? want : (shelf[0] && shelf[0].name);
  if(name) await openSitting(name);
  else { gate(); menu(true); }   // Create a room only when Basic or Bare is pressed.
  health();
  setInterval(health, 5000);
  }catch(e){ gate(); sys('Could not open the sitting: ' + e.message, true); }
})();
</script>
